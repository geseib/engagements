version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: archive-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-engage2_archive_dev}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - archive-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-engage2_archive_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Archive Server
  archive-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${NODE_ENV:-development}
    container_name: archive-server
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3443}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-engage2_archive_dev}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      MTLS_SERVER_KEY: ${MTLS_SERVER_KEY:-/app/certs/server-key.pem}
      MTLS_SERVER_CERT: ${MTLS_SERVER_CERT:-/app/certs/server-cert.pem}
      MTLS_CA_CERT: ${MTLS_CA_CERT:-/app/certs/ca-cert.pem}
      MTLS_ALLOWED_CLIENTS: ${MTLS_ALLOWED_CLIENTS:-engage2-dev-client,engage2-admin-client}
    ports:
      - "${PORT:-3443}:${PORT:-3443}"
    volumes:
      - ./certs:/app/certs:ro
      - ./logs:/app/logs
      # Development volume mounts
      - ./src:/app/src:ro
      - ./package.json:/app/package.json:ro
    networks:
      - archive-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-3443}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Redis (for caching and session storage)
  redis:
    image: redis:7-alpine
    container_name: archive-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - archive-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Nginx (reverse proxy and load balancer)
  nginx:
    image: nginx:alpine
    container_name: archive-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - archive-network
    depends_on:
      - archive-server
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  archive-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16