        \        DebugPrompt: prompt || 'No prompt available',\n        CreatedAt:\
        \ new Date().toISOString(),\n        CreatedBy: 'Claude AI'\n      };\n  \
        \    \n      await db.send(new PutCommand({\n        TableName: process.env.TABLE_NAME,\n\
        \        Item: summaryRecord\n      }));\n      \n      // Broadcast lightweight\
        \ AI summary ready notification via WebSocket\n      try {\n        await\
        \ broadcastToGame(gameId, {\n          type: 'aiSummaryReady',\n         \
        \ gameId,\n          questionId,\n          timestamp: new Date().toISOString()\n\
        \        });\n      } catch (error) {\n        console.log('\U0001F50C WebSocket\
