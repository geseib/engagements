      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        exports.clearGame = async (event) => {\n  try {\n    const gameId = event.pathParameters.gameId;\n\
        \    \n    // Get all items for this game\n    const res = await db.query({\n\
        \      TableName: process.env.TABLE_NAME,\n      KeyConditionExpression: 'PK\
        \ = :g',\n      ExpressionAttributeValues: { ':g': `GAME#${gameId}` }\n  \
        \  }).promise();\n    \n    // Delete all items in batches\n    const items\
        \ = res.Items || [];\n    const batchSize = 25;\n    let deletedCount = 0;\n\
        \    \n    for (let i = 0; i < items.length; i += batchSize) {\n      const\
        \ batch = items.slice(i, i + batchSize);\n      const deleteRequests = batch.map(item\
        \ => ({\n        DeleteRequest: {\n          Key: { PK: item.PK, SK: item.SK\
        \ }\n        }\n      }));\n      \n      await db.batchWrite({\n        RequestItems:\
        \ {\n          [process.env.TABLE_NAME]: deleteRequests\n        }\n     \
        \ }).promise();\n      \n      deletedCount += deleteRequests.length;\n  \
        \  }\n    \n    console.log(`\U0001F5D1\uFE0F Cleared ${deletedCount} items\
        \ from game ${gameId}`);\n    \n    return {\n      statusCode: 200,\n   \
        \   body: JSON.stringify({ \n        message: `Game ${gameId} cleared successfully`,\n\
        \        itemsDeleted: deletedCount\n      }),\n      headers: { 'Access-Control-Allow-Origin':\
        \ '*' }\n    };\n    \n  } catch (error) {\n    console.error('Clear game\
        \ error:', error);\n    return {\n      statusCode: 500,\n      body: JSON.stringify({\
        \ error: `Failed to clear game: ${error.message}` }),\n      headers: { 'Access-Control-Allow-Origin':\
        \ '*' }\n    };\n  }\n};"
      Events:
        AdminClearGameEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /admin/clear-game/{gameId}
            Method: POST
