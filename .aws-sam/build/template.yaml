AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Clean Engagements Platform with consistent resource naming Environment:
  {Environment} Domain: {DomainName}

  '
Parameters:
  Environment:
    Type: String
    AllowedValues:
    - dev
    - test
    - prod
    Description: Environment name (dev, test, prod)
  StackName:
    Type: String
    Description: Stack name for resource naming (e.g., engagedev, engagetest, engageprod)
  DomainName:
    Type: String
    Description: Primary domain name for this environment
    Default: ''
  SecondaryDomainName:
    Type: String
    Description: Secondary domain name (for prod dual domains)
    Default: ''
  HostedZoneId:
    Type: String
    Description: Route53 hosted zone ID
    Default: ZB9TUA073B5SH
Conditions:
  HasDomain:
    Fn::Not:
    - Fn::Equals:
      - Ref: DomainName
      - ''
  HasSecondaryDomain:
    Fn::Not:
    - Fn::Equals:
      - Ref: SecondaryDomainName
      - ''
  IsProd:
    Fn::Equals:
    - Ref: Environment
    - prod
Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME:
          Ref: GameTable
        WEBSOCKET_API_ENDPOINT:
          Fn::Sub: https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
        ENVIRONMENT:
          Ref: Environment
Resources:
  GameTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Ref: StackName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled:
          Fn::If:
          - IsProd
          - true
          - false
      Tags:
      - Key: Environment
        Value:
          Ref: Environment
      - Key: StackName
        Value:
          Ref: StackName
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name:
        Fn::Sub: ${StackName}-api-ws
      ProtocolType: WEBSOCKET
      Tags:
        Environment:
          Ref: Environment
        StackName:
          Ref: StackName
  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
    - ConnectRoute
    - DisconnectRoute
    - MessageRoute
    Properties:
      ApiId:
        Ref: WebSocketApi
  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName:
        Ref: Environment
      Description:
        Fn::Sub: ${Environment} stage for WebSocket API
      DeploymentId:
        Ref: WebSocketDeployment
      ApiId:
        Ref: WebSocketApi
      Tags:
        Environment:
          Ref: Environment
        StackName:
          Ref: StackName
  ConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${StackName}-connect
      CodeUri: ConnectFunction
      Handler: connect.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      Tags:
        Environment:
          Ref: Environment
        StackName:
          Ref: StackName
    Metadata:
      SamResourceId: ConnectFunction
  DisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${StackName}-disconnect
      CodeUri: DisconnectFunction
      Handler: disconnect.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      Tags:
        Environment:
          Ref: Environment
        StackName:
          Ref: StackName
    Metadata:
      SamResourceId: DisconnectFunction
  MessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${StackName}-message
      CodeUri: MessageFunction
      Handler: message.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      - Statement:
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
            Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*
      Tags:
        Environment:
          Ref: Environment
        StackName:
          Ref: StackName
    Metadata:
      SamResourceId: MessageFunction
  CreateGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${StackName}-create-game
      CodeUri: CreateGameFunction
      Handler: create-game.handler
      Events:
        CreateGame:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /games
            Method: post
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      Tags:
        Environment:
          Ref: Environment
        StackName:
          Ref: StackName
    Metadata:
      SamResourceId: CreateGameFunction
  StartQuestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${StackName}-start-question
      CodeUri: StartQuestionFunction
      Handler: start-question.handler
      Events:
        StartQuestion:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /games/{gameId}/start-question
            Method: post
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      - Statement:
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
            Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*
      Tags:
        Environment:
          Ref: Environment
        StackName:
          Ref: StackName
    Metadata:
      SamResourceId: StartQuestionFunction
  StartVoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${StackName}-start-vote
      CodeUri: StartVoteFunction
      Handler: start-vote.handler
      Events:
        StartVote:
          Type: Api
          Properties:
            RestApiId:
              Ref: RestApi
            Path: /games/{gameId}/start-vote
            Method: post
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      - Statement:
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
            Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*
      Tags:
        Environment:
          Ref: Environment
        StackName:
          Ref: StackName
    Metadata:
      SamResourceId: StartVoteFunction
  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: ${StackName}-api-rest
      StageName:
        Ref: Environment
      Cors:
        AllowMethods: '''GET,POST,PUT,DELETE,OPTIONS'''
        AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
        AllowOrigin: '''*'''
      Tags:
        Environment:
          Ref: Environment
        StackName:
          Ref: StackName
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: ${StackName}-web
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      Tags:
      - Key: Environment
        Value:
          Ref: Environment
      - Key: StackName
        Value:
          Ref: StackName
  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: ${StackName}-reports
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
        - Id: DeleteOldReports
          Status: Enabled
          ExpirationInDays: 90
      Tags:
      - Key: Environment
        Value:
          Ref: Environment
      - Key: StackName
        Value:
          Ref: StackName
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: FrontendBucket
      PolicyDocument:
        Statement:
        - Sid: PublicReadGetObject
          Effect: Allow
          Principal: '*'
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${FrontendBucket}/*
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasDomain
    Properties:
      DistributionConfig:
        Aliases:
        - Ref: DomainName
        Origins:
        - Id: S3Origin
          DomainName:
            Fn::GetAtt:
            - FrontendBucket
            - RegionalDomainName
          S3OriginConfig:
            OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          CachedMethods:
          - GET
          - HEAD
          ForwardedValues:
            QueryString: false
        Enabled: true
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn:
            Ref: SSLCertificate
          SslSupportMethod: sni-only
        PriceClass: PriceClass_100
      Tags:
      - Key: Environment
        Value:
          Ref: Environment
      - Key: StackName
        Value:
          Ref: StackName
  SSLCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName:
        Ref: DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
      - DomainName:
          Ref: DomainName
        HostedZoneId:
          Ref: HostedZoneId
      Tags:
      - Key: Environment
        Value:
          Ref: Environment
      - Key: StackName
        Value:
          Ref: StackName
  DNSRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name:
        Ref: DomainName
      Type: A
      AliasTarget:
        DNSName:
          Fn::GetAtt:
          - CloudFrontDistribution
          - DomainName
        HostedZoneId: Z2FDTNDATAQYW2
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      OperationName: ConnectRoute
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: ConnectInteg
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      OperationName: DisconnectRoute
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: DisconnectInteg
  MessageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: WebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      OperationName: MessageRoute
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: MessageInteg
  ConnectInteg:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: WebSocketApi
      Description: Connect Integration
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConnectFunction.Arn}/invocations
  DisconnectInteg:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: WebSocketApi
      Description: Disconnect Integration
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DisconnectFunction.Arn}/invocations
  MessageInteg:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: WebSocketApi
      Description: Message Integration
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MessageFunction.Arn}/invocations
  ConnectPermission:
    Type: AWS::Lambda::Permission
    DependsOn:
    - WebSocketApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: ConnectFunction
      Principal: apigateway.amazonaws.com
  DisconnectPermission:
    Type: AWS::Lambda::Permission
    DependsOn:
    - WebSocketApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: DisconnectFunction
      Principal: apigateway.amazonaws.com
  MessagePermission:
    Type: AWS::Lambda::Permission
    DependsOn:
    - WebSocketApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: MessageFunction
      Principal: apigateway.amazonaws.com
Outputs:
  RestApiUrl:
    Description: REST API Gateway endpoint URL
    Value:
      Fn::Sub: https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name:
        Fn::Sub: ${StackName}-rest-api-url
  WebSocketUrl:
    Description: WebSocket API Gateway endpoint URL
    Value:
      Fn::Sub: wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name:
        Fn::Sub: ${StackName}-websocket-url
  FrontendBucketName:
    Description: Frontend S3 bucket name
    Value:
      Ref: FrontendBucket
    Export:
      Name:
        Fn::Sub: ${StackName}-frontend-bucket
  FrontendUrl:
    Description: Frontend URL
    Value:
      Fn::If:
      - HasDomain
      - Fn::Sub: https://${DomainName}
      - Fn::Sub: http://${FrontendBucket}.s3-website-${AWS::Region}.amazonaws.com
    Export:
      Name:
        Fn::Sub: ${StackName}-frontend-url
  GameTableName:
    Description: DynamoDB table name
    Value:
      Ref: GameTable
    Export:
      Name:
        Fn::Sub: ${StackName}-table-name
  Environment:
    Description: Environment name
    Value:
      Ref: Environment
    Export:
      Name:
        Fn::Sub: ${StackName}-environment
  StackName:
    Description: CloudFormation stack name
    Value:
      Ref: AWS::StackName
    Export:
      Name:
        Fn::Sub: ${StackName}-stack-name
