    Type: AWS::Serverless::Function
    Properties:
      Handler: index.clearGame
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        exports.clearGame = async (event) => {\n  const gameId = event.pathParameters.gameId;\n\
        \  \n  // Get all items for this game\n  const res = await db.query({\n  \
        \  TableName: process.env.TABLE_NAME,\n    KeyConditionExpression: 'PK = :g',\n\
        \    ExpressionAttributeValues: { ':g': `GAME#${gameId}` }\n  }).promise();\n\
