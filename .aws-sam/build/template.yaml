AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "DEVELOPMENT quiz game with WebSocket support for real-time state management:\n\
  \  \u2022 Questions: GAME#1234 / QUESTION#001\n  \u2022 Answers: GAME#1234 / ANSWER#001#PLAYER#name\
  \  \n  \u2022 Votes: GAME#1234 / VOTE#001#PLAYER#name\n  \u2022 State: GAME#1234\
  \ / STATE (with currentQuestion=001, stage=ASK/VOTE/RESULTS)\n  \u2022 WebSocket\
  \ connections for real-time updates\n"
Parameters:
  DomainName:
    Type: String
    Description: The fully qualified domain name (e.g. quiz.example.com)
    Default: engagements.sb.seibtribe.us
  HostedZoneId:
    Type: String
    Description: The Route53 Hosted Zone ID for the domain
    Default: Z03473042HSYD8BUY4XSL
Conditions:
  HasDomain:
    Fn::Not:
    - Fn::Equals:
      - Ref: DomainName
      - ''
Globals:
  Function:
    Runtime: nodejs16.x
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME:
          Ref: GameTable
        WEBSOCKET_API_ENDPOINT:
          Fn::Sub: https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/dev
Resources:
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-websocket-dev
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
    - ConnectRoute
    - DisconnectRoute
    - SendMessageRoute
    Properties:
      ApiId:
        Ref: WebSocketApi
  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: dev
      Description: Development stage for WebSocket API
      DeploymentId:
        Ref: WebSocketDeployment
      ApiId:
        Ref: WebSocketApi
  ConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ConnectFunction
      Handler: connect.handler
      Runtime: nodejs18.x
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME:
            Ref: GameTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
    Metadata:
      SamResourceId: ConnectFunction
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      OperationName: ConnectRoute
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: ConnectInteg
  ConnectInteg:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: WebSocketApi
      Description: Connect Integration
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub:
        - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${lambdaArn}/invocations
        - lambdaArn:
            Fn::GetAtt:
            - ConnectFunction
            - Arn
  ConnectPermission:
    Type: AWS::Lambda::Permission
    DependsOn:
    - WebSocketApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: ConnectFunction
      Principal: apigateway.amazonaws.com
  DisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.disconnectHandler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        \nexports.disconnectHandler = async (event) => {\n  const connectionId = event.requestContext.connectionId;\n\
        \n  console.log(`\U0001F50C WebSocket Disconnect: ${connectionId}`);\n\n \
        \ try {\n    // Remove connection info\n    await db.send(new DeleteCommand({\n\
        \      TableName: process.env.TABLE_NAME,\n      Key: {\n        PK: `CONNECTION#${connectionId}`,\n\
        \        SK: 'METADATA'\n      }\n    }));\n    \n    return { statusCode:\
        \ 200, body: 'Disconnected' };\n  } catch (error) {\n    console.error('Disconnect\
        \ error:', error);\n    return { statusCode: 500, body: 'Failed to disconnect'\
        \ };\n  }\n};"
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      OperationName: DisconnectRoute
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: DisconnectInteg
  DisconnectInteg:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: WebSocketApi
      Description: Disconnect Integration
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub:
        - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${lambdaArn}/invocations
        - lambdaArn:
            Fn::GetAtt:
            - DisconnectFunction
            - Arn
  DisconnectPermission:
    Type: AWS::Lambda::Permission
    DependsOn:
    - WebSocketApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: DisconnectFunction
      Principal: apigateway.amazonaws.com
  SendMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.sendMessageHandler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      - Statement:
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
            Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*
      InlineCode: "const { DynamoDBClient } = require('@aws-sdk/client-dynamodb');\n\
        const { DynamoDBDocumentClient, PutCommand, DeleteCommand, ScanCommand } =\
        \ require('@aws-sdk/lib-dynamodb');\nconst { ApiGatewayManagementApiClient,\
        \ PostToConnectionCommand } = require('@aws-sdk/client-apigatewaymanagementapi');\n\
        \nconst dynamoClient = new DynamoDBClient({});\nconst db = DynamoDBDocumentClient.from(dynamoClient);\n\
        const apigateway = new ApiGatewayManagementApiClient({\n  endpoint: process.env.WEBSOCKET_API_ENDPOINT\n\
        });\n\nexports.sendMessageHandler = async (event) => {\n  const connectionId\
        \ = event.requestContext.connectionId;\n  const body = JSON.parse(event.body);\n\
        \  \n  console.log(`\U0001F4E8 WebSocket Message:`, body);\n  \n  try {\n\
        \    if (body.action === 'broadcast') {\n      // Broadcast to all connections\
        \ in the game\n      const gameId = body.gameId;\n      const message = body.message;\n\
        \      \n      // Get all connections for this game\n      const connections\
        \ = await getGameConnections(gameId);\n      \n      // Send message to all\
        \ connections\n      const sendPromises = connections.map(async (connection)\
        \ => {\n        try {\n          await apiGateway.postToConnection({\n   \
        \         ConnectionId: connection.ConnectionId,\n            Data: JSON.stringify(message)\n\
        \          }).promise();\n        } catch (error) {\n          if (error.statusCode\
        \ === 410) {\n            // Connection is stale, remove it\n            await\
        \ db.delete({\n              TableName: process.env.TABLE_NAME,\n        \
        \      Key: {\n                PK: `CONNECTION#${connection.ConnectionId}`,\n\
        \                SK: 'METADATA'\n              }\n            }).promise();\n\
        \          }\n        }\n      });\n      \n      await Promise.all(sendPromises);\n\
        \      return { statusCode: 200, body: 'Message sent' };\n    }\n    \n  \
        \  return { statusCode: 400, body: 'Unknown action' };\n  } catch (error)\
        \ {\n    console.error('Send message error:', error);\n    return { statusCode:\
        \ 500, body: 'Failed to send message' };\n  }\n};\n\nasync function getGameConnections(gameId)\
        \ {\n  const result = await db.scan({\n    TableName: process.env.TABLE_NAME,\n\
        \    FilterExpression: 'begins_with(PK, :pk) AND GameId = :gameId',\n    ExpressionAttributeValues:\
        \ {\n      ':pk': 'CONNECTION#',\n      ':gameId': gameId\n    }\n  }).promise();\n\
        \  \n  return result.Items;\n}"
  SendMessageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: WebSocketApi
      RouteKey: sendmessage
      AuthorizationType: NONE
      OperationName: SendMessageRoute
      Target:
        Fn::Join:
        - /
        - - integrations
          - Ref: SendMessageInteg
  SendMessageInteg:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: WebSocketApi
      Description: Send Message Integration
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub:
        - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${lambdaArn}/invocations
        - lambdaArn:
            Fn::GetAtt:
            - SendMessageFunction
            - Arn
  SendMessagePermission:
    Type: AWS::Lambda::Permission
    DependsOn:
    - WebSocketApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: SendMessageFunction
      Principal: apigateway.amazonaws.com
  GameTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-dev-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      - AttributeName: ConnectionId
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      GlobalSecondaryIndexes:
      - IndexName: ConnectionIndex
        KeySchema:
        - AttributeName: ConnectionId
          KeyType: HASH
        Projection:
          ProjectionType: ALL
  GameApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowMethods:
        - OPTIONS
        - GET
        - POST
        AllowHeaders:
        - Content-Type
  JoinGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.join
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      - Statement:
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
            Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/dev/POST/@connections/*
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        const apigateway = new AWS.ApiGatewayManagementApi({\n  endpoint: process.env.WEBSOCKET_API_ENDPOINT\n\
        });\n\n// Helper function to broadcast WebSocket message\nconst broadcastToGame\
        \ = async (gameId, message) => {\n  try {\n    // Get all WebSocket connections\
        \ for this game using scan (simple approach)\n    const connectionsResult\
        \ = await db.scan({\n      TableName: process.env.TABLE_NAME,\n      FilterExpression:\
        \ 'begins_with(PK, :prefix) AND GameId = :gameId',\n      ExpressionAttributeValues:\
        \ {\n        ':prefix': 'CONNECTION#',\n        ':gameId': gameId\n      }\n\
        \    }).promise();\n    \n    const connections = connectionsResult.Items\
        \ || [];\n    \n    console.log(`\U0001F50C Broadcasting to ${connections.length}\
        \ connections for game ${gameId}`);\n    \n    const broadcastPromises = connections.map(async\
        \ (connection) => {\n      try {\n        await apigateway.postToConnection({\n\
        \          ConnectionId: connection.ConnectionId,\n          Data: JSON.stringify(message)\n\
        \        }).promise();\n      } catch (error) {\n        console.log(`\U0001F50C\
        \ Failed to send to connection ${connection.ConnectionId}:`, error);\n   \
        \     // Remove dead connections\n        if (error.statusCode === 410) {\n\
        \          await db.delete({\n            TableName: process.env.TABLE_NAME,\n\
        \            Key: { PK: connection.PK, SK: connection.SK }\n          }).promise();\n\
        \        }\n      }\n    });\n    \n    await Promise.all(broadcastPromises);\n\
        \  } catch (error) {\n    console.error('\U0001F50C Broadcast error:', error);\n\
        \  }\n};\n\nexports.join = async (event) => {\n  const gameId = event.pathParameters.gameId;\n\
        \  const { name } = JSON.parse(event.body);\n  \n  // Check if the game exists\n\
        \  const gameCheck = await db.get({\n    TableName: process.env.TABLE_NAME,\n\
        \    Key: { PK: `GAME#${gameId}`, SK: 'METADATA' }\n  }).promise();\n  \n\
        \  if (!gameCheck.Item) {\n    return { \n      statusCode: 404, \n      body:\
        \ JSON.stringify({ error: 'Game not found. Please check the game ID.' }) \n\
        \    };\n  }\n  \n  // Check if player name already exists\n  const existingPlayer\
        \ = await db.get({\n    TableName: process.env.TABLE_NAME,\n    Key: { PK:\
        \ `GAME#${gameId}`, SK: `PLAYER#${name}` }\n  }).promise();\n  \n  if (existingPlayer.Item)\
        \ {\n    // Player already exists - allow rejoining by updating their timestamp\n\
        \    const ttl = Math.floor(Date.now() / 1000) + (14 * 24 * 60 * 60); // 2\
        \ weeks TTL\n    \n    await db.update({\n      TableName: process.env.TABLE_NAME,\n\
        \      Key: { PK: `GAME#${gameId}`, SK: `PLAYER#${name}` },\n      UpdateExpression:\
        \ 'SET RejoinedAt = :rejoined, #ttl = :ttl',\n      ExpressionAttributeNames:\
        \ { '#ttl': 'ttl' },\n      ExpressionAttributeValues: {\n        ':rejoined':\
        \ new Date().toISOString(),\n        ':ttl': ttl\n      }\n    }).promise();\n\
        \    \n    // Broadcast lightweight player rejoined notification (don't fail\
        \ join if broadcast fails)\n    try {\n      await broadcastToGame(gameId,\
        \ {\n        type: 'playerJoined',\n        gameId,\n        timestamp: new\
        \ Date().toISOString()\n      });\n    } catch (error) {\n      console.log('\U0001F50C\
        \ WebSocket broadcast failed for rejoin, continuing...', error.message);\n\
        \    }\n    \n    return {\n      statusCode: 200,\n      body: JSON.stringify({\
        \ \n        message: 'Rejoined successfully', \n        name,\n        rejoined:\
        \ true,\n        previousScore: existingPlayer.Item.TotalScore || 0\n    \
        \  }),\n      headers: { 'Access-Control-Allow-Origin': '*' }\n    };\n  }\n\
        \  \n  const ttl = Math.floor(Date.now() / 1000) + (14 * 24 * 60 * 60); //\
        \ 2 weeks TTL\n  \n  await db.put({\n    TableName: process.env.TABLE_NAME,\n\
        \    Item: { \n      PK: `GAME#${gameId}`, \n      SK: `PLAYER#${name}`, \n\
        \      PlayerName: name,\n      JoinedAt: new Date().toISOString(),\n    \
        \  TotalScore: 0,\n      ttl \n    }\n  }).promise();\n  \n  // Broadcast\
        \ lightweight new player joined notification (don't fail join if broadcast\
        \ fails)\n  try {\n    await broadcastToGame(gameId, {\n      type: 'playerJoined',\n\
        \      gameId,\n      timestamp: new Date().toISOString()\n    });\n  } catch\
        \ (error) {\n    console.log('\U0001F50C WebSocket broadcast failed for new\
        \ join, continuing...', error.message);\n  }\n  \n  return { \n    statusCode:\
        \ 200, \n    body: JSON.stringify({ message: 'Joined', name }),\n    headers:\
        \ { 'Access-Control-Allow-Origin': '*' }\n  };\n};"
      Events:
        JoinGameEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /games/{gameId}/players
            Method: POST
  GetPlayersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.getPlayers
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        exports.getPlayers = async (event) => {\n  const gameId = event.pathParameters.gameId;\n\
        \  \n  const res = await db.query({\n    TableName: process.env.TABLE_NAME,\n\
        \    KeyConditionExpression: 'PK = :g AND begins_with(SK, :p)',\n    ExpressionAttributeValues:\
        \ { ':g': `GAME#${gameId}`, ':p': 'PLAYER#' }\n  }).promise();\n  \n  const\
        \ players = res.Items.map(i => ({\n    name: i.PlayerName,\n    score: i.TotalScore\
        \ || 0,\n    joinedAt: i.JoinedAt\n  }));\n  return { statusCode: 200, body:\
        \ JSON.stringify({ players }) };\n};"
      Events:
        GetPlayersEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /games/{gameId}/players
            Method: GET
  StartQuestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.startQuestion
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      - Statement:
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
            Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/dev/POST/@connections/*
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        const apigateway = new AWS.ApiGatewayManagementApi({\n  endpoint: process.env.WEBSOCKET_API_ENDPOINT\n\
        });\n\n// Helper function to broadcast WebSocket message\nconst broadcastToGame\
        \ = async (gameId, message) => {\n  try {\n    const connectionsResult = await\
        \ db.scan({\n      TableName: process.env.TABLE_NAME,\n      FilterExpression:\
        \ 'begins_with(PK, :prefix) AND GameId = :gameId',\n      ExpressionAttributeValues:\
        \ {\n        ':prefix': 'CONNECTION#',\n        ':gameId': gameId\n      }\n\
        \    }).promise();\n    \n    const connections = connectionsResult.Items\
        \ || [];\n    console.log(`\U0001F50C Broadcasting to ${connections.length}\
        \ connections for game ${gameId}`);\n    \n    const broadcastPromises = connections.map(async\
        \ (connection) => {\n      try {\n        await apigateway.postToConnection({\n\
        \          ConnectionId: connection.ConnectionId,\n          Data: JSON.stringify(message)\n\
        \        }).promise();\n      } catch (error) {\n        console.log(`\U0001F50C\
        \ Failed to send to connection ${connection.ConnectionId}:`, error);\n   \
        \     if (error.statusCode === 410) {\n          await db.delete({\n     \
        \       TableName: process.env.TABLE_NAME,\n            Key: { PK: connection.PK,\
        \ SK: connection.SK }\n          }).promise();\n        }\n      }\n    });\n\
        \    \n    await Promise.all(broadcastPromises);\n  } catch (error) {\n  \
        \  console.error('\U0001F50C Broadcast error:', error);\n  }\n};\nexports.startQuestion\
        \ = async (event) => {\n  const gameId = event.pathParameters.gameId;\n  const\
        \ { questionNumber, questionRef, setId, category } = JSON.parse(event.body);\n\
        \  const ttl = Math.floor(Date.now() / 1000) + (14 * 24 * 60 * 60);\n  \n\
        \  console.log(`\U0001F4DD Starting question ${questionNumber} for game ${gameId},\
        \ ref: ${questionRef}`);\n  \n  // Store question pointer: GAME#1234 / QUESTION#001\n\
        \  await db.put({\n    TableName: process.env.TABLE_NAME,\n    Item: {\n \
        \     PK: `GAME#${gameId}`,\n      SK: `QUESTION#${questionNumber}`,\n   \
        \   QuestionRef: questionRef, // Pointer to SET#setId / QUESTION#category#number\n\
        \      SetId: setId,\n      Category: category,\n      StartedAt: new Date().toISOString(),\n\
        \      ttl\n    }\n  }).promise();\n  \n  // Update game state: current question\
        \ and stage\n  await db.put({\n    TableName: process.env.TABLE_NAME,\n  \
        \  Item: {\n      PK: `GAME#${gameId}`,\n      SK: 'STATE',\n      CurrentQuestion:\
        \ questionNumber, // \"001\", \"002\", etc.\n      Stage: 'ASK', // BEGIN,\
        \ ASK, VOTE, RESULTS, END\n      UpdatedAt: new Date().toISOString(),\n  \
        \    ttl\n    }\n  }).promise();\n  \n  // Broadcast lightweight question\
        \ started notification via WebSocket\n  try {\n    await broadcastToGame(gameId,\
        \ {\n      type: 'questionStarted',\n      gameId,\n      questionId: questionNumber,\n\
        \      timestamp: new Date().toISOString()\n    });\n  } catch (error) {\n\
        \    console.log('\U0001F50C WebSocket broadcast failed for question start,\
        \ continuing...', error.message);\n  }\n  \n  return { statusCode: 200, body:\
        \ JSON.stringify({ status: 'OK' }) };\n};"
      Events:
        StartQuestionEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /games/{gameId}/start-question
            Method: POST
  SubmitAnswerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.submitAnswer
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      - Statement:
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
            Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/dev/POST/@connections/*
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        const apigateway = new AWS.ApiGatewayManagementApi({\n  endpoint: process.env.WEBSOCKET_API_ENDPOINT\n\
        });\n\n// Helper function to broadcast WebSocket message\nconst broadcastToGame\
        \ = async (gameId, message) => {\n  try {\n    const connectionsResult = await\
        \ db.scan({\n      TableName: process.env.TABLE_NAME,\n      FilterExpression:\
        \ 'begins_with(PK, :prefix) AND GameId = :gameId',\n      ExpressionAttributeValues:\
        \ {\n        ':prefix': 'CONNECTION#',\n        ':gameId': gameId\n      }\n\
        \    }).promise();\n    \n    const connections = connectionsResult.Items\
        \ || [];\n    console.log(`\U0001F50C Broadcasting to ${connections.length}\
        \ connections for game ${gameId}`);\n    \n    const broadcastPromises = connections.map(async\
        \ (connection) => {\n      try {\n        await apigateway.postToConnection({\n\
        \          ConnectionId: connection.ConnectionId,\n          Data: JSON.stringify(message)\n\
        \        }).promise();\n      } catch (error) {\n        console.log(`\U0001F50C\
        \ Failed to send to connection ${connection.ConnectionId}:`, error);\n   \
        \     if (error.statusCode === 410) {\n          await db.delete({\n     \
        \       TableName: process.env.TABLE_NAME,\n            Key: { PK: connection.PK,\
        \ SK: connection.SK }\n          }).promise();\n        }\n      }\n    });\n\
        \    \n    await Promise.all(broadcastPromises);\n  } catch (error) {\n  \
        \  console.error('\U0001F50C Broadcast error:', error);\n  }\n};\nexports.submitAnswer\
        \ = async (event) => {\n  const gameId = event.pathParameters.gameId;\n  const\
        \ { name, questionNumber, answer } = JSON.parse(event.body);\n  const ttl\
        \ = Math.floor(Date.now() / 1000) + (14 * 24 * 60 * 60);\n  \n  console.log(`\U0001F4DD\
        \ Answer: game=${gameId}, question=${questionNumber}, player=${name}`);\n\
        \  \n  // Store answer with sequential question number: ANSWER#001#PLAYER#name\n\
        \  await db.put({\n    TableName: process.env.TABLE_NAME,\n    Item: {\n \
        \     PK: `GAME#${gameId}`,\n      SK: `ANSWER#${questionNumber}#PLAYER#${name}`,\n\
        \      PlayerName: name,\n      QuestionNumber: questionNumber,\n      Answer:\
        \ answer,\n      SubmittedAt: new Date().toISOString(),\n      ttl\n    }\n\
        \  }).promise();\n  \n  // Broadcast lightweight answer submitted notification\
        \ via WebSocket\n  try {\n    await broadcastToGame(gameId, {\n      type:\
        \ 'playerAnswered',\n      gameId,\n      questionId: questionNumber,\n  \
        \    timestamp: new Date().toISOString()\n    });\n  } catch (error) {\n \
        \   console.log('\U0001F50C WebSocket broadcast failed for answer submission,\
        \ continuing...', error.message);\n  }\n  \n  return { statusCode: 200, body:\
        \ JSON.stringify({ status: 'OK' }) };\n};"
      Events:
        SubmitAnswerEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /games/{gameId}/answers
            Method: POST
  GetAnswersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.getAnswers
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        exports.getAnswers = async (event) => {\n  const gameId = event.pathParameters.gameId;\n\
