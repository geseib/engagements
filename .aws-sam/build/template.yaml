  GetAISummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.getAISummary
      Runtime: nodejs16.x
      Timeout: 30
      MemorySize: 256
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        \n// Fixed runtime to nodejs16.x for aws-sdk compatibility\nexports.getAISummary\
        \ = async (event) => {\n  try {\n    const gameId = event.pathParameters.gameId;\n\
        \    const questionId = event.pathParameters.questionId;\n    const debugMode\
        \ = event.queryStringParameters?.debug === 'true';\n    \n    console.log(`\U0001F4D6\
        \ Fetching AI summary for game ${gameId}, question ${questionId}, debug: ${debugMode}`);\n\
        \    \n    // Get the AI summary record\n    const result = await db.get({\n\
        \      TableName: process.env.TABLE_NAME,\n      Key: { \n        PK: `GAME#${gameId}`,\
        \ \n        SK: `SUMMARY#${questionId}` \n      }\n    }).promise();\n   \
        \ \n    if (!result.Item) {\n      return {\n        statusCode: 404,\n  \
        \      body: JSON.stringify({ error: 'AI summary not found' }),\n        headers:\
        \ { 'Access-Control-Allow-Origin': '*' }\n      };\n    }\n    \n    const\
        \ response = {\n      questionId: result.Item.QuestionId,\n      summaryText:\
        \ result.Item.SummaryText,\n      discussionQuestions: result.Item.DiscussionQuestions\
        \ || [],\n      nextSteps: result.Item.NextSteps || [],\n      createdAt:\
        \ result.Item.CreatedAt,\n      createdBy: result.Item.CreatedBy\n    };\n\
        \    \n    // Include debug prompt if requested\n    if (debugMode && result.Item.DebugPrompt)\
        \ {\n      response.debugPrompt = result.Item.DebugPrompt;\n    }\n    \n\
        \    return {\n      statusCode: 200,\n      body: JSON.stringify(response),\n\
        \      headers: { 'Access-Control-Allow-Origin': '*' }\n    };\n    \n  }\
        \ catch (error) {\n    console.error('Get AI Summary error:', error);\n  \
        \  return {\n      statusCode: 500,\n      body: JSON.stringify({ error: `Failed\
        \ to get AI summary: ${error.message}` }),\n      headers: { 'Access-Control-Allow-Origin':\
        \ '*' }\n    };\n  }\n};"
      Events:
        GetAISummaryEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /games/{gameId}/summary/{questionId}
            Method: GET
  TestBedrockFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.testBedrock
      Runtime: nodejs18.x
      Timeout: 60
      MemorySize: 256
      Policies:
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - bedrock:InvokeModel
          - bedrock:InvokeModelWithResponseStream
          Resource:
          - Fn::Sub: arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-3-5-sonnet-20241022-v2:0
          - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0
          - arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0
          - arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0
      InlineCode: "const { BedrockRuntimeClient, InvokeModelCommand } = require('@aws-sdk/client-bedrock-runtime');\n\
        \nconst bedrockClient = new BedrockRuntimeClient({ region: 'us-east-1' });\n\
        \n// Function to call Claude via Bedrock\nconst invokeClaude = async (prompt)\
        \ => {\n  const modelId = 'us.anthropic.claude-3-5-sonnet-20241022-v2:0';\n\
        \  \n  console.log(`\U0001F916 Testing Claude with model: ${modelId}`);\n\
        \  console.log(`\U0001F4DD Prompt: ${prompt.substring(0, 100)}...`);\n  \n\
        \  const payload = {\n    anthropic_version: 'bedrock-2023-05-31',\n    max_tokens:\
        \ 500,\n    messages: [\n      {\n        role: 'user',\n        content:\
        \ [{ type: 'text', text: prompt }],\n      },\n    ],\n  };\n  \n  const command\
        \ = new InvokeModelCommand({\n    contentType: 'application/json',\n    body:\
        \ JSON.stringify(payload),\n    modelId,\n  });\n  \n  console.log('\U0001F4E1\
        \ Sending request to Bedrock...');\n  const apiResponse = await bedrockClient.send(command);\n\
        \  \n  const decodedResponseBody = new TextDecoder().decode(apiResponse.body);\n\
        \  const responseBody = JSON.parse(decodedResponseBody);\n  \n  console.log('\u2705\
        \ Bedrock response received successfully');\n  console.log(`\U0001F4CA Response\
        \ length: ${responseBody.content[0].text.length} characters`);\n  \n  return\
        \ responseBody.content[0].text;\n};\n\nexports.testBedrock = async (event)\
        \ => {\n  try {\n    console.log('\U0001F9EA Starting Bedrock test with inference\
        \ profile...');\n    \n    // Simple test prompt\n    const testPrompt = 'You\
        \ are a helpful AI assistant. Please provide a brief business strategy analysis\
        \ with:\\\\n\\\\n1. A 2-sentence summary about the importance of strategic\
        \ planning\\\\n2. 2 discussion questions about strategy implementation\\\\\
        n3. 2 concrete next steps for improving strategic planning\\\\n\\\\nKeep your\
        \ response structured and concise.';\n    \n    console.log('\U0001F680 Calling\
        \ Claude...');\n    const aiResponse = await invokeClaude(testPrompt);\n \
        \   \n    console.log('\u2705 Test completed successfully!');\n    console.log(`\U0001F4C4\
        \ Full response: ${aiResponse}`);\n    \n    return {\n      statusCode: 200,\n\
        \      body: JSON.stringify({\n        success: true,\n        message: 'Bedrock\
        \ test completed successfully!',\n        modelId: 'us.anthropic.claude-3-5-sonnet-20241022-v2:0',\n\
        \        promptLength: testPrompt.length,\n        responseLength: aiResponse.length,\n\
        \        response: aiResponse,\n        timestamp: new Date().toISOString()\n\
        \      }),\n      headers: { 'Access-Control-Allow-Origin': '*' }\n    };\n\
        \    \n  } catch (error) {\n    console.error('\u274C Bedrock test failed:',\
        \ error);\n    console.error('Error details:', {\n      name: error.name,\n\
        \      message: error.message,\n      code: error.$metadata?.httpStatusCode,\n\
        \      requestId: error.$metadata?.requestId\n    });\n    \n    return {\n\
        \      statusCode: 500,\n      body: JSON.stringify({\n        success: false,\n\
        \        error: error.message,\n        errorName: error.name,\n        errorCode:\
        \ error.$metadata?.httpStatusCode,\n        timestamp: new Date().toISOString(),\n\
        \        troubleshooting: {\n          modelAccess: 'Check if anthropic.claude-3-5-sonnet-20241022-v2:0\
        \ is enabled in Bedrock console',\n          permissions: 'Verify Lambda has\
        \ bedrock:InvokeModel permissions',\n          region: 'Ensure Bedrock is\
        \ available in us-east-1'\n        }\n      }),\n      headers: { 'Access-Control-Allow-Origin':\
        \ '*' }\n    };\n  }\n};"
      Events:
        TestBedrockEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /test/bedrock
            Method: GET
  CloudFrontOAI:
