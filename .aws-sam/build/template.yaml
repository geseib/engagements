        \ Final stats: ${questions.length} questions, ${categories.size} categories`);\n\
        \    \n    return {\n      statusCode: 200,\n      body: JSON.stringify({\
        \ \n        setName: setName,\n        setId: setId,\n        questionCount:\
        \ questions.length,\n        categoryCount: categories.size,\n        message:\
        \ `Successfully created question set \"${setName}\" with ${questions.length}\
        \ questions across ${categories.size} categories`,\n        mapping: {\n \
        \         categoryColumn: categoryIndex >= 0 ? headers[categoryIndex] : 'Not\
        \ found',\n          titleColumn: titleIndex >= 0 ? headers[titleIndex] :\
        \ 'Not found',\n          detailColumn: detailIndex >= 0 ? headers[detailIndex]\
