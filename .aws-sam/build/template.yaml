        \ : 'Not found',\n          customInstructionColumn: customInstructionIndex\
        \ >= 0 ? headers[customInstructionIndex] : 'Using set-level instructions'\n\
        \        }\n      }),\n      headers: { 'Access-Control-Allow-Origin': '*'\
        \ }\n    };\n    \n  } catch (error) {\n    console.error('Upload error:',\
        \ error);\n    return {\n      statusCode: 500,\n      body: JSON.stringify({\
        \ error: `Upload failed: ${error.message}` }),\n      headers: { 'Access-Control-Allow-Origin':\
        \ '*' }\n    };\n  }\n};"
