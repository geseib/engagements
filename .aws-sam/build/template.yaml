  GetVotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.getVotes
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        exports.getVotes = async (event) => {\n  const gameId = event.pathParameters.gameId;\n\
        \  const questionNumber = event.queryStringParameters?.questionNumber;\n \
        \ \n  console.log(`\U0001F50D GetVotes: game=${gameId}, questionNumber=${questionNumber}`);\n\
        \  \n  let keyCondition, expressionValues;\n  if (questionNumber) {\n    //\
        \ Get votes for specific question: VOTE#001#PLAYER#\n    keyCondition = 'PK\
        \ = :g AND begins_with(SK, :v)';\n    expressionValues = { \n      ':g': `GAME#${gameId}`,\
        \ \n      ':v': `VOTE#${questionNumber}#PLAYER#` \n    };\n  } else {\n  \
        \  // Get all votes in the game\n    keyCondition = 'PK = :g AND begins_with(SK,\
        \ :v)';\n    expressionValues = { \n      ':g': `GAME#${gameId}`, \n     \
        \ ':v': 'VOTE#' \n    };\n  }\n  \n  const res = await db.query({\n    TableName:\
        \ process.env.TABLE_NAME,\n    KeyConditionExpression: keyCondition,\n   \
        \ ExpressionAttributeValues: expressionValues\n  }).promise();\n  \n  // Transform\
        \ to individual vote records for frontend compatibility\n  const votes = [];\n\
        \  res.Items.forEach(record => {\n    const voterName = record.VoterName;\n\
        \    const questionNum = record.QuestionNumber;\n    \n    // Convert to individual\
        \ vote format\n    if (record.VotesRaw && typeof record.VotesRaw === 'object')\
        \ {\n      Object.entries(record.VotesRaw).forEach(([answerIndex, rank]) =>\
        \ {\n        votes.push({\n          questionNumber: questionNum,\n      \
        \    voter: voterName,\n          answerIndex: parseInt(answerIndex),\n  \
        \        rank: parseInt(rank),\n          submittedAt: record.SubmittedAt\n\
        \        });\n      });\n    }\n  });\n  \n  console.log(`\u2705 Returning\
        \ ${votes.length} vote records for question ${questionNumber}`);\n  return\
        \ { statusCode: 200, body: JSON.stringify({ votes }) };\n};"
      Events:
        GetVotesEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /games/{gameId}/votes
            Method: GET
  SetGameStateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.setGameState
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      - Statement:
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
            Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/dev/POST/@connections/*
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        const apigateway = new AWS.ApiGatewayManagementApi({\n  endpoint: process.env.WEBSOCKET_API_ENDPOINT\n\
        });\n\n// Helper function to broadcast WebSocket message\nconst broadcastToGame\
        \ = async (gameId, message) => {\n  try {\n    const connectionsResult = await\
        \ db.scan({\n      TableName: process.env.TABLE_NAME,\n      FilterExpression:\
        \ 'begins_with(PK, :prefix) AND GameId = :gameId',\n      ExpressionAttributeValues:\
        \ {\n        ':prefix': 'CONNECTION#',\n        ':gameId': gameId\n      }\n\
        \    }).promise();\n    \n    const connections = connectionsResult.Items\
        \ || [];\n    console.log(`\U0001F50C Broadcasting to ${connections.length}\
        \ connections for game ${gameId}`);\n    \n    const broadcastPromises = connections.map(async\
        \ (connection) => {\n      try {\n        await apigateway.postToConnection({\n\
        \          ConnectionId: connection.ConnectionId,\n          Data: JSON.stringify(message)\n\
        \        }).promise();\n      } catch (error) {\n        console.log(`\U0001F50C\
        \ Failed to send to connection ${connection.ConnectionId}:`, error);\n   \
        \     if (error.statusCode === 410) {\n          await db.delete({\n     \
        \       TableName: process.env.TABLE_NAME,\n            Key: { PK: connection.PK,\
        \ SK: connection.SK }\n          }).promise();\n        }\n      }\n    });\n\
        \    \n    await Promise.all(broadcastPromises);\n  } catch (error) {\n  \
        \  console.error('\U0001F50C Broadcast error:', error);\n  }\n};\nexports.setGameState\
        \ = async (event) => {\n  const gameId = event.pathParameters.gameId;\n  const\
        \ body = JSON.parse(event.body);\n  const { \n    currentQuestion, \n    stage,\
        \ \n    state, \n    currentQuestionIndex, \n    currentQuestionId,\n    scoredQuestions,\n\
        \    usedQuestions,\n    playedQuestions,\n    currentQuestionData\n  } =\
        \ body;\n  const ttl = Math.floor(Date.now() / 1000) + (14 * 24 * 60 * 60);\n\
        \  \n  console.log(`\U0001F3AE SetGameState: game=${gameId}, state=${state},\
        \ questionId=${currentQuestionId}`);\n  \n  // Store complete game state for\
        \ player synchronization\n  const stateItem = {\n    PK: `GAME#${gameId}`,\n\
        \    SK: 'STATE',\n    CurrentQuestion: currentQuestion, // \"001\", \"002\"\
        , etc.\n    Stage: stage || (state === 'question' ? 'ASK' : \n           \
        \         state === 'voting' ? 'VOTE' :\n                    state === 'results'\
        \ ? 'RESULTS' : 'BEGIN'),\n    State: state || 'waiting',\n    CurrentQuestionIndex:\
        \ currentQuestionIndex,\n    CurrentQuestionId: currentQuestionId,\n    UpdatedAt:\
        \ new Date().toISOString(),\n    ttl\n  };\n  \n  // Add optional arrays if\
        \ provided\n  if (scoredQuestions) stateItem.ScoredQuestions = scoredQuestions;\n\
        \  if (usedQuestions) stateItem.UsedQuestions = usedQuestions;\n  if (playedQuestions)\
        \ stateItem.PlayedQuestions = playedQuestions;\n  if (currentQuestionData)\
        \ stateItem.CurrentQuestionData = currentQuestionData;\n  \n  await db.put({\n\
        \    TableName: process.env.TABLE_NAME,\n    Item: stateItem\n  }).promise();\n\
        \  \n  // Broadcast lightweight game state change notification via WebSocket\n\
        \  try {\n    await broadcastToGame(gameId, {\n      type: 'gameStateChanged',\n\
        \      gameId,\n      state,\n      questionId: currentQuestionId || currentQuestion,\n\
        \      timestamp: new Date().toISOString()\n    });\n  } catch (error) {\n\
        \    console.log('\U0001F50C WebSocket broadcast failed for game state change,\
        \ continuing...', error.message);\n  }\n  \n  return { statusCode: 200, body:\
        \ JSON.stringify({ status: 'OK' }) };\n};"
      Events:
        SetGameStateEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /games/{gameId}/state
            Method: POST
  GetGameStateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.getGameState
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        exports.getGameState = async (event) => {\n  const gameId = event.pathParameters.gameId;\n\
        \  \n  const res = await db.get({\n    TableName: process.env.TABLE_NAME,\n\
        \    Key: { PK: `GAME#${gameId}`, SK: 'STATE' }\n  }).promise();\n  \n  //\
        \ Also get debug mode from game metadata\n  const metadataRes = await db.get({\n\
        \    TableName: process.env.TABLE_NAME,\n    Key: { PK: `GAME#${gameId}`,\
        \ SK: 'METADATA' }\n  }).promise();\n  \n  const state = res.Item || {};\n\
        \  const metadata = metadataRes.Item || {};\n  let currentQuestionData = null;\n\
        \  \n  // If there's a current question, fetch its data from the pointer\n\
        \  if (state.CurrentQuestion) {\n    try {\n      const questionRes = await\
        \ db.get({\n        TableName: process.env.TABLE_NAME,\n        Key: { PK:\
        \ `GAME#${gameId}`, SK: `QUESTION#${state.CurrentQuestion}` }\n      }).promise();\n\
        \      \n      if (questionRes.Item && questionRes.Item.QuestionRef) {\n \
        \       // Fetch the actual question data using the pointer\n        const\
        \ questionDataRes = await db.get({\n          TableName: process.env.TABLE_NAME,\n\
        \          Key: { PK: `SET#${questionRes.Item.SetId}`, SK: questionRes.Item.QuestionRef\
        \ }\n        }).promise();\n        \n        if (questionDataRes.Item) {\n\
        \          currentQuestionData = {\n            id: state.CurrentQuestion,\
        \ // Use sequential number as ID for frontend\n            title: questionDataRes.Item.Title\
        \ || questionDataRes.Item.Prompt || '',\n            detail: questionDataRes.Item.Detail\
        \ || '',\n            category: questionDataRes.Item.Category || '',\n   \
        \         setId: questionRes.Item.SetId\n          };\n        }\n      }\n\
        \    } catch (e) {\n      console.error('Error fetching question data:', e);\n\
        \    }\n  }\n  \n  // Return clean state - players only need current question,\
        \ host needs question tracking\n  const gameState = {\n    stage: state.Stage\
        \ || 'BEGIN', // BEGIN, ASK, VOTE, RESULTS, END\n    state: state.State ||\
        \ (state.Stage === 'ASK' ? 'question' : \n           state.Stage === 'VOTE'\
        \ ? 'voting' :\n           state.Stage === 'RESULTS' ? 'results' : 'waiting'),\n\
        \    currentQuestionId: state.CurrentQuestion,\n    currentQuestionData: currentQuestionData,\n\
        \    updatedAt: state.UpdatedAt,\n    currentQuestion: state.CurrentQuestion,\
        \ // Add this for backward compatibility\n    debugMode: metadata.DebugMode\
        \ || false // Include debug mode from game metadata\n  };\n  \n  // Host-only\
        \ data (for question tracking and scoring)\n  if (state.ScoredQuestions) gameState.scoredQuestions\
        \ = state.ScoredQuestions;\n  if (state.UsedQuestions) gameState.usedQuestions\
        \ = state.UsedQuestions;\n  if (state.PlayedQuestions) gameState.playedQuestions\
        \ = state.PlayedQuestions;\n  \n  console.log(`\U0001F3AE GetGameState: game=${gameId}`,\
        \ gameState);\n  return { statusCode: 200, body: JSON.stringify(gameState)\
        \ };\n};"
      Events:
        GetGameStateEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /games/{gameId}/state
            Method: GET
