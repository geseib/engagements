        - Id: DeleteTemporaryReports
          Status: Enabled
          ExpirationInDays: 1
          Prefix: ''
          NoncurrentVersionExpirationInDays: 1
          AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 1
        - Id: ExcludePermanentReports
          Status: Enabled
          ExpirationInDays: 365
          Prefix: permanent/
