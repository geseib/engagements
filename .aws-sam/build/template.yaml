        \ }\n      \n      summaries.push({\n        questionId,\n        questionText:\
        \ questionText,\n        summary: parsed.summaryText,\n        discussionQuestions:\
        \ parsed.discussionQuestions,\n        nextSteps: parsed.nextSteps\n     \
        \ });\n      \n      console.log(`\u2705 AI summary generated for question\
        \ ${questionId}`);\n    }\n    \n    return {\n      statusCode: 200,\n  \
        \    body: JSON.stringify({ \n        message: `Successfully generated AI\
        \ summaries for ${summaries.length} questions`,\n        summaries: summaries\n\
        \      }),\n      headers: { 'Access-Control-Allow-Origin': '*' }\n    };\n\
        \    \n  } catch (error) {\n    console.error('\U0001F6A8 AI Summary generation\
        \ failed:', error);\n    \n    // Provide user-friendly error messages based\
