      Tags:
        Environment:
          Ref: Environment
        StackName:
          Ref: StackName
    Metadata:
      SamResourceId: StartVoteFunction
  RestApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName:
        Ref: Environment
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowMethods:
        - OPTIONS
        - GET
        - POST
        - PUT
        - DELETE
        AllowHeaders:
        - Content-Type
      Tags:
        Environment:
          Ref: Environment
        StackName:
          Ref: StackName
  AdminGetQuestionSetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${StackName}-admin-get-question-sets
      CodeUri: AdminGetQuestionSetsFunction
      Handler: get-question-sets.handler
