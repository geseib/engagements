        \ (optional but recommended).]\\n\\n' +\n        'Focus on actionable insights\
        \ that connect directly to what these players shared and the specific context\
        \ they were asked to consider. Be specific and insightful.';\n      \n   \
        \   console.log('\U0001F916 FULL AI PROMPT CONSTRUCTED:');\n      console.log('=====================================');\n\
        \      console.log(prompt);\n      console.log('=====================================');\n\
        \n      // Call Claude via Bedrock for real AI analysis\n      console.log('\U0001F916\
        \ Calling Claude via Bedrock...');\n      \n      let aiResponse;\n      let\
        \ parsed;\n      \n      try {\n        // Call real AI - NO FALLBACKS, NO\
        \ MOCK DATA\n        console.log('\U0001F916 CALLING CLAUDE: Sending prompt\
        \ to Bedrock...');\n        aiResponse = await invokeClaude(prompt);\n   \
        \     console.log('\u2705 CLAUDE SUCCESS: Real AI response received');\n \
        \       parsed = parseAIResponse(aiResponse);\n      } catch (aiError) {\n\
        \        console.log(`\u274C CLAUDE FAILED: ${aiError.message}`);\n      \
        \  throw new Error(`AI analysis unavailable: ${aiError.message}`);\n     \
        \ }\n      \n      // Store the summary (filter out undefined values)\n  \
        \    const summaryRecord = {\n        PK: `GAME#${gameId}`,\n        SK: `SUMMARY#${questionId}`,\n\
        \        QuestionId: questionId,\n        SummaryText: parsed.summaryText\
        \ || 'AI analysis completed',\n        DiscussionQuestions: parsed.discussionQuestions\
        \ || [],\n        NextSteps: parsed.nextSteps || [],\n        FullAIResponse:\
