        \  \n  const answers = res.Items.map(item => ({\n    name: item.PlayerName,\n\
        \    questionNumber: item.QuestionNumber,\n    answer: item.Answer,\n    submittedAt:\
        \ item.SubmittedAt\n  }));\n  \n  console.log(`\U0001F4CB Returning ${answers.length}\
