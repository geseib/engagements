  GetCategoriesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.getCategories
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        exports.getCategories = async (event) => {\n  const setId = event.pathParameters?.setId;\n\
        \  \n  if (!setId) {\n    return { \n      statusCode: 400, \n      body:\
        \ JSON.stringify({ error: 'setId parameter is required' }),\n      headers:\
        \ { 'Access-Control-Allow-Origin': '*' }\n    };\n  }\n  \n  try {\n    //\
        \ Get categories\n    const categoriesRes = await db.query({\n      TableName:\
        \ process.env.TABLE_NAME,\n      KeyConditionExpression: 'PK = :pk AND begins_with(SK,\
        \ :sk)',\n      ExpressionAttributeValues: { \n        ':pk': `SET#${setId}`,\n\
        \        ':sk': 'CATEGORY#'\n      }\n    }).promise();\n    \n    // Get\
        \ all questions to count by category\n    const questionsRes = await db.query({\n\
        \      TableName: process.env.TABLE_NAME,\n      KeyConditionExpression: 'PK\
        \ = :pk AND begins_with(SK, :sk)',\n      ExpressionAttributeValues: { \n\
        \        ':pk': `SET#${setId}`,\n        ':sk': 'QUESTION#'\n      }\n   \
        \ }).promise();\n    \n    // Count questions per category\n    const questionCountByCategory\
        \ = {};\n    questionsRes.Items.forEach(question => {\n      const category\
        \ = question.Category;\n      if (category) {\n        questionCountByCategory[category]\
        \ = (questionCountByCategory[category] || 0) + 1;\n      }\n    });\n    \n\
        \    const categories = categoriesRes.Items.map(cat => ({\n      name: cat.Name,\n\
        \      description: cat.Description || '',\n      questionCount: questionCountByCategory[cat.Name]\
        \ || 0\n    }));\n    \n    return { \n      statusCode: 200, \n      body:\
        \ JSON.stringify({ categories }),\n      headers: {\n        'Access-Control-Allow-Origin':\
        \ '*',\n        'Access-Control-Allow-Headers': 'Content-Type',\n        'Access-Control-Allow-Methods':\
        \ 'GET'\n      }\n    };\n  } catch (error) {\n    console.error('Error fetching\
        \ categories:', error);\n    return { \n      statusCode: 500, \n      body:\
        \ JSON.stringify({ error: 'Failed to fetch categories' }),\n      headers:\
        \ { 'Access-Control-Allow-Origin': '*' }\n    };\n  }\n};"
      Events:
        GetCategoriesEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /question-sets/{setId}/categories
            Method: GET
  GetQuestionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.getQuestions
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        exports.getQuestions = async (event) => {\n  const setId = event.queryStringParameters?.setId;\n\
        \  const gameId = event.queryStringParameters?.gameId;\n  const getNext =\
        \ event.queryStringParameters?.getNext === 'true';\n  const categoriesParam\
        \ = event.queryStringParameters?.categories;\n  \n  if (!setId) {\n    return\
        \ { \n      statusCode: 400, \n      body: JSON.stringify({ error: 'setId\
        \ parameter is required' }),\n      headers: { 'Access-Control-Allow-Origin':\
        \ '*' }\n    };\n  }\n  \n  // Get all questions for this set\n  const res\
        \ = await db.query({\n    TableName: process.env.TABLE_NAME,\n    KeyConditionExpression:\
        \ 'PK = :pk AND begins_with(SK, :sk)',\n    ExpressionAttributeValues: { \n\
        \      ':pk': `SET#${setId}`,\n      ':sk': 'QUESTION#'\n    }\n  }).promise();\n\
        \  \n  let questions = res.Items.map(i => ({\n    id: i.SK, // Use full SK\
        \ as unique ID\n    title: i.Title || i.Prompt || '',\n    detail: i.Detail\
        \ || '',\n    category: i.Category || '',\n    setId: setId\n  }));\n  \n\
        \  // Apply category filtering if specified\n  if (categoriesParam) {\n  \
        \  const activeCategories = categoriesParam.split(',').map(c => c.trim());\n\
        \    console.log(`\U0001F3F7\uFE0F Filtering by categories: ${activeCategories.join(',\
        \ ')}`);\n    console.log(`\U0001F4CB Questions before filter: ${questions.length}`);\n\
        \    console.log(`\U0001F50D Sample categories in questions:`, questions.slice(0,\
        \ 3).map(q => q.category));\n    questions = questions.filter(q => activeCategories.includes(q.category));\n\
        \    console.log(`\U0001F4CB Questions after category filter: ${questions.length}`);\n\
        \  }\n  \n  if (getNext && questions.length > 0 && gameId) {\n    // Get used\
        \ questions for this game to avoid duplicates\n    let usedQuestions = [];\n\
        \    try {\n      const stateRes = await db.get({\n        TableName: process.env.TABLE_NAME,\n\
        \        Key: { PK: `GAME#${gameId}`, SK: 'STATE' }\n      }).promise();\n\
        \      \n      if (stateRes.Item?.UsedQuestions) {\n        usedQuestions\
        \ = stateRes.Item.UsedQuestions;\n      }\n    } catch (e) {\n      console.log('No\
        \ game state found, treating as new game');\n    }\n    \n    // Filter out\
        \ already used questions\n    const availableQuestions = questions.filter(q\
        \ => !usedQuestions.includes(q.id));\n    console.log(`\U0001F3B2 Available\
        \ questions: ${availableQuestions.length}/${questions.length}`);\n    \n \
        \   if (availableQuestions.length === 0) {\n      return {\n        statusCode:\
        \ 200,\n        body: JSON.stringify({ \n          gameComplete: true, \n\
        \          message: 'All questions in selected categories have been used'\
        \ \n        }),\n        headers: { 'Access-Control-Allow-Origin': '*' }\n\
        \      };\n    }\n    \n    // Return random available question\n    const\
        \ randomIndex = Math.floor(Math.random() * availableQuestions.length);\n \
        \   const selectedQuestion = availableQuestions[randomIndex];\n    \n    console.log(`\U0001F3AF\
        \ Selected question: ${selectedQuestion.id} from category: ${selectedQuestion.category}`);\n\
        \    \n    return {\n      statusCode: 200,\n      body: JSON.stringify({\
        \ \n        questions: [selectedQuestion],\n        availableCount: availableQuestions.length\
        \ - 1\n      }),\n      headers: { 'Access-Control-Allow-Origin': '*' }\n\
        \    };\n  }\n  \n  return { \n    statusCode: 200, \n    body: JSON.stringify({\
        \ questions }),\n    headers: { 'Access-Control-Allow-Origin': '*' }\n  };\n\
        };"
      Events:
        GetQuestionsEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /questions
            Method: GET
  ListGamesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.listGames
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        exports.listGames = async (event) => {\n  try {\n    // Get all game metadata\n\
        \    const metadataRes = await db.scan({\n      TableName: process.env.TABLE_NAME,\n\
        \      FilterExpression: 'begins_with(PK, :gamePrefix) AND SK = :metadata',\n\
        \      ExpressionAttributeValues: {\n        ':gamePrefix': 'GAME#',\n   \
        \     ':metadata': 'METADATA'\n      }\n    }).promise();\n    \n    // Get\
        \ the last played date for each game by checking the STATE record\n    const\
        \ games = [];\n    for (const item of metadataRes.Items) {\n      const gameId\
        \ = item.PK.replace('GAME#', '');\n      \n      // Get the game state to\
        \ find the last activity\n      let lastPlayedAt = item.CreatedAt || new Date().toISOString();\n\
        \      try {\n        const stateRes = await db.get({\n          TableName:\
        \ process.env.TABLE_NAME,\n          Key: { PK: `GAME#${gameId}`, SK: 'STATE'\
        \ }\n        }).promise();\n        \n        if (stateRes.Item && stateRes.Item.UpdatedAt)\
        \ {\n          lastPlayedAt = stateRes.Item.UpdatedAt;\n        }\n      }\
        \ catch (e) {\n        console.log(`No state found for game ${gameId}, using\
        \ created date`);\n      }\n      \n      games.push({\n        gameId: gameId,\n\
        \        title: item.Title || item.EventTitle || 'Engagements Session',\n\
        \        hostName: item.HostName || 'Unknown Host',\n        createdAt: item.CreatedAt\
        \ || new Date().toISOString(),\n        lastPlayedAt: lastPlayedAt,\n    \
        \    eventTitle: item.Title || item.EventTitle || 'Engagements Session'\n\
        \      });\n    }\n    \n    // Sort by most recent first\n    games.sort((a,\
        \ b) => new Date(b.lastPlayedAt) - new Date(a.lastPlayedAt));\n    \n    return\
        \ {\n      statusCode: 200,\n      body: JSON.stringify({ games }),\n    \
        \  headers: {\n        'Access-Control-Allow-Origin': '*',\n        'Access-Control-Allow-Headers':\
        \ 'Content-Type',\n        'Access-Control-Allow-Methods': 'GET'\n      }\n\
        \    };\n  } catch (error) {\n    console.error('Error listing games:', error);\n\
        \    return {\n      statusCode: 500,\n      body: JSON.stringify({ error:\
        \ 'Failed to list games' }),\n      headers: { 'Access-Control-Allow-Origin':\
        \ '*' }\n    };\n  }\n};"
      Events:
        ListGamesEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /games
            Method: GET
  GetGameReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.getGameReport
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        exports.getGameReport = async (event) => {\n  const gameId = event.pathParameters.gameId;\n\
        \  \n  try {\n    // Get game state\n    const stateRes = await db.get({\n\
        \      TableName: process.env.TABLE_NAME,\n      Key: { PK: `GAME#${gameId}`,\
        \ SK: 'STATE' }\n    }).promise();\n    \n    const gameState = stateRes.Item\
        \ || {};\n    const playedQuestions = gameState.PlayedQuestions || [];\n \
        \   \n    // Get all question pointers for this game\n    const questionData\
        \ = [];\n    for (const questionNumber of playedQuestions) {\n      // Get\
        \ question pointer\n      const pointerRes = await db.get({\n        TableName:\
        \ process.env.TABLE_NAME,\n        Key: { PK: `GAME#${gameId}`, SK: `QUESTION#${questionNumber}`\
        \ }\n      }).promise();\n      \n      if (pointerRes.Item && pointerRes.Item.QuestionRef)\
        \ {\n        // Fetch actual question data\n        const questionRes = await\
        \ db.get({\n          TableName: process.env.TABLE_NAME,\n          Key: {\
        \ PK: `SET#${pointerRes.Item.SetId}`, SK: pointerRes.Item.QuestionRef }\n\
        \        }).promise();\n        \n        if (questionRes.Item) {\n      \
        \    questionData.push({\n            id: questionNumber,\n            title:\
        \ questionRes.Item.Title || questionRes.Item.Prompt || '',\n            detail:\
        \ questionRes.Item.Detail || '',\n            category: questionRes.Item.Category\
        \ || '',\n            setId: pointerRes.Item.SetId\n          });\n      \
        \  }\n      }\n    }\n    \n    return {\n      statusCode: 200,\n      body:\
        \ JSON.stringify({ questions: questionData, playedQuestions }),\n      headers:\
        \ { 'Access-Control-Allow-Origin': '*' }\n    };\n  } catch (error) {\n  \
        \  console.error('Error getting game report data:', error);\n    return {\n\
        \      statusCode: 500,\n      body: JSON.stringify({ error: 'Failed to get\
        \ report data' }),\n      headers: { 'Access-Control-Allow-Origin': '*' }\n\
        \    };\n  }\n};"
      Events:
        GetGameReportEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /games/{gameId}/report
            Method: GET
  AdminUploadQuestionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.uploadQuestions
      Timeout: 60
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        exports.uploadQuestions = async (event) => {\n  try {\n    const { fileName,\
        \ fileContent, customTitle, customDescription, customInstructions, aiContextInstructions,\
        \ engagementType } = JSON.parse(event.body);\n    \n    console.log(`Processing\
        \ CSV upload: ${fileName}`);\n    console.log(`Custom title: ${customTitle}`);\n\
        \    console.log(`Custom instructions: ${customInstructions}`);\n    console.log(`AI\
        \ context instructions: ${aiContextInstructions}`);\n    \n    // Parse CSV\
        \ content with better CSV parsing\n    const lines = fileContent.split('\\\
        n').filter(line => line.trim());\n    if (lines.length < 2) {\n      return\
        \ {\n        statusCode: 400,\n        body: JSON.stringify({ error: 'CSV\
        \ file must have at least a header and one data row' }),\n        headers:\
        \ { 'Access-Control-Allow-Origin': '*' }\n      };\n    }\n    \n    // Extract\
        \ set name from custom title or filename\n    const setName = customTitle?.trim()\
        \ || fileName.replace(/\\.csv$/i, '');\n    const setId = setName.toLowerCase().replace(/[^a-z0-9]/g,\
        \ '');\n    const setDescription = customDescription?.trim() || `Imported\
        \ from ${fileName}`;\n    \n    // Enhanced CSV parsing function\n    const\
        \ parseCSVLine = (line) => {\n      const result = [];\n      let current\
        \ = '';\n      let inQuotes = false;\n      \n      for (let i = 0; i < line.length;\
        \ i++) {\n        const char = line[i];\n        if (char === '\"') {\n  \
        \        inQuotes = !inQuotes;\n        } else if (char === ',' && !inQuotes)\
        \ {\n          result.push(current.trim());\n          current = '';\n   \
        \     } else {\n          current += char;\n        }\n      }\n      result.push(current.trim());\n\
        \      return result;\n    };\n    \n    // Parse header with flexible mapping\n\
        \    const headers = parseCSVLine(lines[0]).map(h => h.replace(/\"/g, '').trim());\n\
        \    console.log('\U0001F50D Detected CSV Headers:', headers);\n    \n   \
        \ // Simple and reliable column mapping - support exact greatest-hits.csv\
        \ format or generic fallback\n    const getColumnIndex = (header) => headers.findIndex(h\
        \ => h.toLowerCase() === header.toLowerCase());\n    \n    // Try greatest-hits.csv\
        \ format first: Category,Question#,Title,Detail_lesson,School,CustomInstruction\n\
        \    let categoryIndex = getColumnIndex('Category');\n    let titleIndex =\
        \ getColumnIndex('Title');\n    let detailIndex = getColumnIndex('Detail_lesson');\n\
        \    let schoolIndex = getColumnIndex('School');\n    let customInstructionIndex\
        \ = getColumnIndex('CustomInstruction');\n    \n    // Fallback to generic\
        \ column names if exact matches not found\n    if (categoryIndex === -1) categoryIndex\
        \ = headers.findIndex(h => h.toLowerCase().includes('category'));\n    if\
        \ (titleIndex === -1) titleIndex = headers.findIndex(h => h.toLowerCase().includes('title')\
        \ && !h.toLowerCase().includes('#'));\n    if (detailIndex === -1) detailIndex\
        \ = headers.findIndex(h => h.toLowerCase().includes('detail') || h.toLowerCase().includes('lesson'));\n\
        \    if (schoolIndex === -1) schoolIndex = headers.findIndex(h => h.toLowerCase().includes('school'));\n\
        \    if (customInstructionIndex === -1) customInstructionIndex = headers.findIndex(h\
        \ => h.toLowerCase().includes('instruction'));\n    \n    console.log('\U0001F50D\
        \ Detected CSV Headers:', headers);\n    console.log('\U0001F4CB Column Mapping:');\n\
        \    console.log(`  Category: ${categoryIndex >= 0 ? headers[categoryIndex]\
        \ : 'NOT FOUND'} (index: ${categoryIndex})`);\n    console.log(`  Title: ${titleIndex\
        \ >= 0 ? headers[titleIndex] : 'NOT FOUND'} (index: ${titleIndex})`);\n  \
        \  console.log(`  Detail: ${detailIndex >= 0 ? headers[detailIndex] : 'NOT\
        \ FOUND'} (index: ${detailIndex})`);\n    console.log(`  School: ${schoolIndex\
        \ >= 0 ? headers[schoolIndex] : 'NOT FOUND'} (index: ${schoolIndex})`);\n\
        \    console.log(`  Instructions: ${customInstructionIndex >= 0 ? headers[customInstructionIndex]\
        \ : 'NOT FOUND'} (index: ${customInstructionIndex})`);\n    \n    // Check\
        \ required columns\n    if (categoryIndex === -1 || titleIndex === -1) {\n\
        \      const missing = [];\n      if (categoryIndex === -1) missing.push('Category');\n\
        \      if (titleIndex === -1) missing.push('Title');\n      \n      return\
        \ {\n        statusCode: 400,\n        body: JSON.stringify({ \n         \
        \ error: `Missing required columns: ${missing.join(', ')}. \\nDetected headers:\
        \ [${headers.join(', ')}]\\nRequired: Category column (category/type/subject)\
        \ and Title column (title/prompt/question)` \n        }),\n        headers:\
        \ { 'Access-Control-Allow-Origin': '*' }\n      };\n    }\n    \n    // Parse\
        \ questions with mapped columns\n    const questions = [];\n    const categories\
        \ = new Set();\n    let questionCount = 0;\n    \n    for (let i = 1; i <\
        \ lines.length; i++) {\n      try {\n        const values = parseCSVLine(lines[i]);\n\
        \        if (values.length < 2) continue; // Skip empty lines\n        \n\
        \        // Extract values using mapped indices\n        const category =\
        \ values[categoryIndex]?.replace(/\"/g, '')?.trim();\n        const title\
        \ = values[titleIndex]?.replace(/\"/g, '')?.trim();\n        const detail\
        \ = detailIndex >= 0 ? values[detailIndex]?.replace(/\"/g, '')?.trim() ||\
        \ '' : '';\n        const school = schoolIndex >= 0 ? values[schoolIndex]?.replace(/\"\
        /g, '')?.trim() || '' : '';\n        const questionCustomInstruction = customInstructionIndex\
        \ >= 0 ? values[customInstructionIndex]?.replace(/\"/g, '')?.trim() || ''\
        \ : '';\n        \n        if (title && category) {\n          questionCount++;\n\
        \          \n          questions.push({\n            Title: title,\n     \
        \       Detail: detail,\n            Category: category,\n            School:\
        \ school,\n            // Use per-question custom instruction if available,\
        \ otherwise use set-level custom instructions\n            CustomInstructions:\
        \ questionCustomInstruction || customInstructions?.trim() || '',\n       \
        \     Active: true,\n            QuestionNumber: questionCount\n         \
        \ });\n          categories.add(category);\n          \n          console.log(`\
        \  \U0001F4DD Question ${questionCount}: ${category} - ${title.substring(0,\
        \ 50)}...`);\n        }\n      } catch (e) {\n        console.log(`\u26A0\uFE0F\
        \ Skipping malformed line ${i}: ${lines[i].substring(0, 100)}...`);\n    \
        \  }\n    }\n    \n    if (questions.length === 0) {\n      return {\n   \
        \     statusCode: 400,\n        body: JSON.stringify({ error: 'No valid questions\
        \ found in CSV' }),\n        headers: { 'Access-Control-Allow-Origin': '*'\
        \ }\n      };\n    }\n    \n    console.log(`\u2705 Successfully parsed ${questions.length}\
        \ questions in ${categories.size} categories`);\n    \n    // Check if set\
        \ already exists\n    const existingSet = await db.get({\n      TableName:\
        \ process.env.TABLE_NAME,\n      Key: { PK: 'SETS', SK: `SET#${setId}` }\n\
        \    }).promise();\n    \n    if (existingSet.Item) {\n      return {\n  \
        \      statusCode: 400,\n        body: JSON.stringify({ error: `Question set\
        \ \"${setName}\" already exists. Please use a different title or delete the\
        \ existing set first.` }),\n        headers: { 'Access-Control-Allow-Origin':\
        \ '*' }\n      };\n    }\n    \n    // Create set metadata with enhanced information\n\
        \    await db.put({\n      TableName: process.env.TABLE_NAME,\n      Item:\
        \ {\n        PK: 'SETS',\n        SK: `SET#${setId}`,\n        Name: setName,\n\
        \        Description: setDescription,\n        CustomInstruction: customInstructions?.trim()\
        \ || '',\n        AIContextInstruction: aiContextInstructions?.trim() || '',\n\
        \        TotalQuestions: questions.length,\n        CategoryCount: categories.size,\n\
        \        Active: true,\n        CreatedAt: new Date().toISOString(),\n   \
        \     SourceFile: fileName,\n        EngagementType: engagementType || 'call-and-answer',\n\
        \        Mapping: {\n          categoryColumn: categoryIndex >= 0 ? headers[categoryIndex]\
        \ : '',\n          titleColumn: titleIndex >= 0 ? headers[titleIndex] : '',\n\
        \          detailColumn: detailIndex >= 0 ? headers[detailIndex] : '',\n \
        \         schoolColumn: schoolIndex >= 0 ? headers[schoolIndex] : '',\n  \
        \        customInstructionColumn: customInstructionIndex >= 0 ? headers[customInstructionIndex]\
        \ : ''\n        }\n      }\n    }).promise();\n    \n    // Create categories\n\
        \    const categoryPromises = Array.from(categories).map((categoryName, idx)\
        \ => {\n      const categoryId = `c${String(idx + 1).padStart(3, '0')}`;\n\
        \      return db.put({\n        TableName: process.env.TABLE_NAME,\n     \
        \   Item: {\n          PK: `SET#${setId}`,\n          SK: `CATEGORY#${categoryId}`,\n\
        \          Name: categoryName,\n          Description: `${categoryName} questions`,\n\
        \          QuestionCount: questions.filter(q => q.Category === categoryName).length\n\
        \        }\n      }).promise();\n    });\n    \n    await Promise.all(categoryPromises);\n\
        \    \n    // Create questions with enhanced data\n    console.log(`\U0001F4BE\
        \ Creating ${questions.length} questions in database...`);\n    const questionPromises\
        \ = questions.map((question, idx) => {\n      const categoryIndex = Array.from(categories).indexOf(question.Category)\
        \ + 1;\n      const categoryId = `c${String(categoryIndex).padStart(3, '0')}`;\n\
        \      const questionNumber = String(idx + 1).padStart(3, '0');\n      const\
        \ questionId = `QUESTION#${categoryId}#${questionNumber}`;\n      \n     \
        \ return db.put({\n        TableName: process.env.TABLE_NAME,\n        Item:\
        \ {\n          PK: `SET#${setId}`,\n          SK: questionId,\n          Title:\
        \ question.Title,\n          Detail: question.Detail || '',\n          Category:\
        \ question.Category,\n          School: question.School || '',\n         \
        \ CustomInstructions: question.CustomInstructions || '',\n          OrderInCategory:\
        \ questionNumber,\n          QuestionNumber: question.QuestionNumber,\n  \
        \        Active: true\n        }\n      }).promise();\n    });\n    \n   \
        \ await Promise.all(questionPromises);\n    \n    console.log(`\U0001F389\
