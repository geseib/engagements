  AdminGetQuestionSetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.getQuestionSets
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        \nexports.getQuestionSets = async (event) => {\n  try {\n    // Get all question\
        \ set metadata (both active and inactive)\n    const res = await db.query({\n\
        \      TableName: process.env.TABLE_NAME,\n      KeyConditionExpression: 'PK\
        \ = :pk',\n      ExpressionAttributeValues: { ':pk': 'SETS' }\n    }).promise();\n\
        \    \n    const allSets = [];\n    for (const item of res.Items) {\n    \
        \  const setId = item.SK.replace('SET#', '');\n      \n      // Get categories\
        \ for this set\n      const categoriesRes = await db.query({\n        TableName:\
        \ process.env.TABLE_NAME,\n        KeyConditionExpression: 'PK = :pk AND begins_with(SK,\
        \ :sk)',\n        ExpressionAttributeValues: { \n          ':pk': `SET#${setId}`,\n\
        \          ':sk': 'CATEGORY#'\n        }\n      }).promise();\n      \n  \
        \    const categories = categoriesRes.Items.map(cat => ({\n        name: cat.Name,\n\
        \        description: cat.Description || '',\n        count: cat.QuestionCount\
        \ || 0\n      }));\n      \n      allSets.push({\n        id: setId,\n   \
        \     name: item.Name || 'Unknown Set',\n        description: item.Description\
        \ || '',\n        totalQuestions: item.TotalQuestions || 0,\n        categoryCount:\
        \ item.CategoryCount || categories.length,\n        customInstruction: item.CustomInstruction\
        \ || '',\n        aiContextInstruction: item.AIContextInstruction || '',\n\
        \        active: item.Active || false,\n        createdAt: item.CreatedAt\
        \ || '',\n        sourceFile: item.SourceFile || '',\n        engagementType:\
        \ item.EngagementType || 'call-and-answer',\n        categories: categories\n\
        \      });\n    }\n    \n    // Sort by creation date (newest first)\n   \
        \ allSets.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));\n\
        \    \n    return { \n      statusCode: 200, \n      body: JSON.stringify({\
        \ sets: allSets }),\n      headers: {\n        'Access-Control-Allow-Origin':\
        \ '*',\n        'Access-Control-Allow-Headers': 'Content-Type',\n        'Access-Control-Allow-Methods':\
        \ 'GET'\n      }\n    };\n    \n  } catch (error) {\n    console.error('Get\
        \ question sets error:', error);\n    return {\n      statusCode: 500,\n \
        \     body: JSON.stringify({ error: `Failed to get question sets: ${error.message}`\
        \ }),\n      headers: { 'Access-Control-Allow-Origin': '*' }\n    };\n  }\n\
        };"
      Events:
        AdminGetQuestionSetsEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /admin/question-sets
            Method: GET
  AdminToggleQuestionSetFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.toggleQuestionSet
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        \nexports.toggleQuestionSet = async (event) => {\n  try {\n    const setId\
        \ = event.pathParameters.setId;\n    const { active } = JSON.parse(event.body);\n\
        \    \n    console.log(`Toggling question set ${setId} to active: ${active}`);\n\
        \    \n    // Update the question set active status\n    await db.update({\n\
        \      TableName: process.env.TABLE_NAME,\n      Key: { PK: 'SETS', SK: `SET#${setId}`\
        \ },\n      UpdateExpression: 'SET Active = :active, UpdatedAt = :updatedAt',\n\
        \      ExpressionAttributeValues: {\n        ':active': active,\n        ':updatedAt':\
        \ new Date().toISOString()\n      }\n    }).promise();\n    \n    console.log(`\u2705\
        \ Successfully toggled question set ${setId} to active: ${active}`);\n   \
        \ \n    return {\n      statusCode: 200,\n      body: JSON.stringify({ \n\
        \        message: `Question set ${active ? 'activated' : 'deactivated'} successfully`,\n\
        \        setId: setId,\n        active: active\n      }),\n      headers:\
        \ { 'Access-Control-Allow-Origin': '*' }\n    };\n    \n  } catch (error)\
        \ {\n    console.error('Toggle question set error:', error);\n    return {\n\
        \      statusCode: 500,\n      body: JSON.stringify({ error: `Failed to toggle\
        \ question set: ${error.message}` }),\n      headers: { 'Access-Control-Allow-Origin':\
        \ '*' }\n    };\n  }\n};"
      Events:
        AdminToggleQuestionSetEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /admin/toggle-question-set/{setId}
            Method: POST
  AdminDeleteQuestionSetFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.deleteQuestionSet
      Timeout: 60
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        \nexports.deleteQuestionSet = async (event) => {\n  try {\n    const setId\
        \ = event.pathParameters.setId;\n    console.log(`Deleting question set: ${setId}`);\n\
        \    \n    // Get set metadata first to check if it exists\n    const metaRes\
        \ = await db.get({\n      TableName: process.env.TABLE_NAME,\n      Key: {\
        \ PK: 'SETS', SK: `SET#${setId}` }\n    }).promise();\n    \n    if (!metaRes.Item)\
        \ {\n      return {\n        statusCode: 404,\n        body: JSON.stringify({\
        \ error: 'Question set not found' }),\n        headers: { 'Access-Control-Allow-Origin':\
        \ '*' }\n      };\n    }\n    \n    const setName = metaRes.Item.Name;\n \
        \   \n    // Get all items for this question set from SET# partition\n   \
        \ const setRes = await db.query({\n      TableName: process.env.TABLE_NAME,\n\
        \      KeyConditionExpression: 'PK = :setpk',\n      ExpressionAttributeValues:\
        \ { ':setpk': `SET#${setId}` }\n    }).promise();\n    \n    // Delete the\
        \ set metadata first\n    await db.delete({\n      TableName: process.env.TABLE_NAME,\n\
        \      Key: { PK: 'SETS', SK: `SET#${setId}` }\n    }).promise();\n    \n\
        \    let deletedCount = 1; // Count the metadata deletion\n    \n    // Delete\
        \ all items from SET# partition in batches\n    const setItems = setRes.Items\
        \ || [];\n    const batchSize = 25;\n    \n    for (let i = 0; i < setItems.length;\
        \ i += batchSize) {\n      const batch = setItems.slice(i, i + batchSize);\n\
        \      const deleteRequests = batch.map(item => ({\n        DeleteRequest:\
        \ {\n          Key: { PK: item.PK, SK: item.SK }\n        }\n      }));\n\
        \      \n      await db.batchWrite({\n        RequestItems: {\n          [process.env.TABLE_NAME]:\
        \ deleteRequests\n        }\n      }).promise();\n      \n      deletedCount\
        \ += deleteRequests.length;\n    }\n    \n    console.log(`\U0001F5D1\uFE0F\
        \ Deleted question set \"${setName}\": ${deletedCount} items removed`);\n\
        \    \n    return {\n      statusCode: 200,\n      body: JSON.stringify({\
        \ \n        message: `Question set \"${setName}\" deleted successfully`,\n\
        \        itemsDeleted: deletedCount\n      }),\n      headers: { 'Access-Control-Allow-Origin':\
        \ '*' }\n    };\n    \n  } catch (error) {\n    console.error('Delete question\
        \ set error:', error);\n    return {\n      statusCode: 500,\n      body:\
        \ JSON.stringify({ error: `Failed to delete question set: ${error.message}`\
        \ }),\n      headers: { 'Access-Control-Allow-Origin': '*' }\n    };\n  }\n\
        };"
      Events:
        AdminDeleteQuestionSetEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /admin/delete-question-set/{setId}
            Method: POST
  AdminEditQuestionSetFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.editQuestionSet
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        exports.editQuestionSet = async (event) => {\n  try {\n    const setId = event.pathParameters.setId;\n\
        \    const { name, description, customInstruction, aiContextInstruction }\
        \ = JSON.parse(event.body);\n    \n    if (!name || !name.trim()) {\n    \
        \  return {\n        statusCode: 400,\n        body: JSON.stringify({ error:\
        \ 'Name is required' }),\n        headers: { 'Access-Control-Allow-Origin':\
        \ '*' }\n      };\n    }\n    \n    // Update the question set metadata\n\
        \    const updateParams = {\n      TableName: process.env.TABLE_NAME,\n  \
        \    Key: { PK: 'SETS', SK: `SET#${setId}` },\n      UpdateExpression: 'SET\
        \ #name = :name',\n      ExpressionAttributeNames: {\n        '#name': 'Name'\n\
        \      },\n      ExpressionAttributeValues: {\n        ':name': name.trim()\n\
        \      }\n    };\n    \n    // Add optional fields if provided\n    if (description\
        \ !== null && description !== undefined) {\n      updateParams.UpdateExpression\
        \ += ', Description = :description';\n      updateParams.ExpressionAttributeValues[':description']\
        \ = description;\n    }\n    \n    if (customInstruction !== null && customInstruction\
        \ !== undefined) {\n      updateParams.UpdateExpression += ', CustomInstruction\
        \ = :customInstruction';\n      updateParams.ExpressionAttributeValues[':customInstruction']\
        \ = customInstruction;\n    }\n    \n    if (aiContextInstruction !== null\
        \ && aiContextInstruction !== undefined) {\n      updateParams.UpdateExpression\
        \ += ', AIContextInstruction = :aiContextInstruction';\n      updateParams.ExpressionAttributeValues[':aiContextInstruction']\
        \ = aiContextInstruction;\n    }\n    \n    await db.update(updateParams).promise();\n\
        \    \n    console.log(`\u270F\uFE0F Updated question set \"${setId}\" with\
        \ name: ${name}`);\n    \n    return {\n      statusCode: 200,\n      body:\
        \ JSON.stringify({ \n        message: `Question set \"${setId}\" updated successfully`,\n\
        \        setId: setId,\n        name: name\n      }),\n      headers: { 'Access-Control-Allow-Origin':\
        \ '*' }\n    };\n    \n  } catch (error) {\n    console.error('Edit question\
        \ set error:', error);\n    return {\n      statusCode: 500,\n      body:\
        \ JSON.stringify({ error: `Failed to edit question set: ${error.message}`\
        \ }),\n      headers: { 'Access-Control-Allow-Origin': '*' }\n    };\n  }\n\
        };"
      Events:
        AdminEditQuestionSetEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /admin/edit-question-set/{setId}
            Method: POST
  SaveReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.saveReport
      Timeout: 60
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      - S3CrudPolicy:
          BucketName:
            Ref: ReportsBucket
      InlineCode: "const AWS = require('aws-sdk');\nconst s3 = new AWS.S3();\nexports.saveReport\
        \ = async (event) => {\n  try {\n    const gameId = event.pathParameters.gameId;\n\
        \    const { eventTitle, pdfBlob, permanent = false } = JSON.parse(event.body);\n\
        \    \n    // Generate filename\n    const timestamp = new Date().toISOString().split('T')[0];\n\
        \    const sanitizedTitle = eventTitle.replace(/[^a-zA-Z0-9\\s-]/g, '').replace(/\\\
        s+/g, '-');\n    const baseFileName = `${sanitizedTitle}-${timestamp}-${gameId}.pdf`;\n\
        \    \n    // Add prefix for permanent files\n    const fileName = permanent\
        \ ? `permanent/${baseFileName}` : baseFileName;\n    \n    // Convert base64\
        \ to buffer\n    const pdfBuffer = Buffer.from(pdfBlob, 'base64');\n    \n\
        \    // Upload to S3\n    const uploadParams = {\n      Bucket: process.env.REPORTS_BUCKET_NAME,\n\
        \      Key: fileName,\n      Body: pdfBuffer,\n      ContentType: 'application/pdf',\n\
        \      ContentDisposition: `attachment; filename=\"${baseFileName}\"`,\n \
        \     Metadata: {\n        'x-amz-meta-permanent': permanent ? 'true' : 'false',\n\
        \        'x-amz-meta-game-id': gameId,\n        'x-amz-meta-event-title':\
        \ eventTitle\n      }\n    };\n    \n    const uploadResult = await s3.upload(uploadParams).promise();\n\
        \    \n    // Generate presigned URL for download (valid for 24 hours)\n \
        \   const downloadUrl = s3.getSignedUrl('getObject', {\n      Bucket: process.env.REPORTS_BUCKET_NAME,\n\
        \      Key: fileName,\n      Expires: 24 * 60 * 60 // 24 hours in seconds\n\
        \    });\n    \n    console.log(`\U0001F4C4 Report saved: ${fileName}`);\n\
        \    \n    return {\n      statusCode: 200,\n      body: JSON.stringify({\n\
        \        fileName: fileName,\n        downloadUrl: downloadUrl,\n        s3Location:\
        \ uploadResult.Location\n      }),\n      headers: { 'Access-Control-Allow-Origin':\
        \ '*' }\n    };\n    \n  } catch (error) {\n    console.error('Save report\
        \ error:', error);\n    return {\n      statusCode: 500,\n      body: JSON.stringify({\
        \ error: `Failed to save report: ${error.message}` }),\n      headers: { 'Access-Control-Allow-Origin':\
        \ '*' }\n    };\n  }\n};"
      Environment:
        Variables:
          REPORTS_BUCKET_NAME:
            Ref: ReportsBucket
      Events:
        SaveReportEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /games/{gameId}/save-report
            Method: POST
  UpdateGameTitleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.updateGameTitle
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        exports.updateGameTitle = async (event) => {\n  try {\n    const gameId =\
        \ event.pathParameters.gameId;\n    const { eventTitle } = JSON.parse(event.body);\n\
        \    \n    // Update the game metadata with the new title\n    await db.update({\n\
        \      TableName: process.env.TABLE_NAME,\n      Key: { PK: `GAME#${gameId}`,\
