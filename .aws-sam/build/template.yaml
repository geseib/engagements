AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Clean Engagements Platform with consistent resource naming Environment:
  {Environment} Domain: {DomainName}

  '
Parameters:
  Environment:
    Type: String
    AllowedValues:
    - dev
    - test
    - prod
    Description: Environment name (dev, test, prod)
  StackName:
    Type: String
    Description: Stack name for resource naming (e.g., engagedev, engagetest, engageprod)
  DomainName:
    Type: String
    Description: Primary domain name for this environment
    Default: ''
  SecondaryDomainName:
    Type: String
    Description: Secondary domain name (for prod dual domains)
    Default: ''
  HostedZoneId:
    Type: String
    Description: Route53 hosted zone ID
    Default: ZB9TUA073B5SH
Conditions:
  HasDomain:
    Fn::Not:
    - Fn::Equals:
      - Ref: DomainName
      - ''
  HasSecondaryDomain:
    Fn::Not:
    - Fn::Equals:
      - Ref: SecondaryDomainName
      - ''
  IsProd:
    Fn::Equals:
    - Ref: Environment
    - prod
Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME:
          Ref: GameTable
        WEBSOCKET_API_ENDPOINT:
          Fn::Sub: https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
        ENVIRONMENT:
          Ref: Environment
Resources:
  GameTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Ref: StackName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled:
          Fn::If:
          - IsProd
          - true
          - false
      Tags:
      - Key: Environment
        Value:
          Ref: Environment
      - Key: StackName
        Value:
          Ref: StackName
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name:
        Fn::Sub: ${StackName}-api-ws
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
      Tags:
        Environment:
          Ref: Environment
        StackName:
          Ref: StackName
  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
    - ConnectRoute
    - DisconnectRoute
    - MessageRoute
    Properties:
      ApiId:
        Ref: WebSocketApi
  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName:
        Ref: Environment
      Description:
        Fn::Sub: ${Environment} stage for WebSocket API
      DeploymentId:
        Ref: WebSocketDeployment
      ApiId:
        Ref: WebSocketApi
      Tags:
        Environment:
          Ref: Environment
        StackName:
          Ref: StackName
  ConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${StackName}-connect
      CodeUri: ConnectFunction
      Handler: connect.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      Tags:
        Environment:
          Ref: Environment
        StackName:
          Ref: StackName
    Metadata:
      SamResourceId: ConnectFunction
  DisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${StackName}-disconnect
      CodeUri: DisconnectFunction
      Handler: disconnect.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      Tags:
        Environment:
          Ref: Environment
        StackName:
          Ref: StackName
    Metadata:
      SamResourceId: DisconnectFunction
  MessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${StackName}-message
      CodeUri: MessageFunction
      Handler: message.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      - Statement:
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
            Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*
      Tags:
        Environment:
          Ref: Environment
        StackName:
          Ref: StackName
    Metadata:
      SamResourceId: MessageFunction
  CreateGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${StackName}-create-game
      CodeUri: CreateGameFunction
      Handler: create-game.handler
      Events:
        CreateGame:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: RestApi
            Path: /games
            Method: post
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      Tags:
        Environment:
          Ref: Environment
        StackName:
          Ref: StackName
    Metadata:
      SamResourceId: CreateGameFunction
  StartQuestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${StackName}-start-question
      CodeUri: StartQuestionFunction
      Handler: start-question.handler
      Events:
        StartQuestion:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: RestApi
            Path: /games/{gameId}/start-question
            Method: post
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      - Statement:
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
            Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*
      Tags:
        Environment:
          Ref: Environment
        StackName:
          Ref: StackName
    Metadata:
      SamResourceId: StartQuestionFunction
  StartVoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${StackName}-start-vote
      CodeUri: StartVoteFunction
      Handler: start-vote.handler
      Events:
        StartVote:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: RestApi
            Path: /games/{gameId}/start-vote
