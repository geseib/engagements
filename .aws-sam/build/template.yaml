        \ {\n    return db.delete({\n      TableName: process.env.TABLE_NAME,\n  \
        \    Key: { PK: item.PK, SK: item.SK }\n    }).promise();\n  });\n  \n  await\
        \ Promise.all(deletePromises);\n  \n  console.log(`\U0001F5D1\uFE0F Cleared\
        \ ${res.Items.length} items from game ${gameId}`);\n  return { statusCode:\
        \ 200, body: JSON.stringify({ message: 'Game cleared', itemsDeleted: res.Items.length\
        \ }) };\n};"
      Events:
        ClearGameEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /games/{gameId}/clear
            Method: POST
  GetQuestionSetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.getQuestionSets
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: GameTable
      InlineCode: "const AWS = require('aws-sdk');\nconst db = new AWS.DynamoDB.DocumentClient();\n\
        exports.getQuestionSets = async () => {\n  const res = await db.query({\n\
        \    TableName: process.env.TABLE_NAME,\n    KeyConditionExpression: 'PK =\
        \ :pk',\n    ExpressionAttributeValues: { ':pk': 'SETS' }\n  }).promise();\n\
        \  \n  // Filter for active sets only and add categories\n  const activeSets\
        \ = [];\n  for (const item of res.Items) {\n    if (item.Active) {\n     \
        \ const setId = item.SK.replace('SET#', '');\n      \n      // Get categories\
        \ for this set\n      const categoriesRes = await db.query({\n        TableName:\
        \ process.env.TABLE_NAME,\n        KeyConditionExpression: 'PK = :pk AND begins_with(SK,\
        \ :sk)',\n        ExpressionAttributeValues: { \n          ':pk': `SET#${setId}`,\n\
        \          ':sk': 'CATEGORY#'\n        }\n      }).promise();\n      \n  \
        \    const categories = categoriesRes.Items.map(cat => ({\n        name: cat.Name,\n\
        \        description: cat.Description || '',\n        count: 10 // Assuming\
        \ 10 questions per category for now\n      }));\n      \n      activeSets.push({\n\
        \        id: setId,\n        name: item.Name || 'Unknown Set',\n        description:\
        \ item.Description || '',\n        totalQuestions: item.TotalQuestions ||\
        \ 0,\n        categoryCount: item.CategoryCount || categories.length,\n  \
        \      customInstruction: item.CustomInstruction || null,\n        aiContextInstruction:\
        \ item.AIContextInstruction || null,\n        active: true,\n        categories:\
        \ categories,\n        engagementType: item.EngagementType || 'call-and-answer'\n\
        \      });\n    }\n  }\n  \n  return { \n    statusCode: 200, \n    body:\
        \ JSON.stringify({ sets: activeSets }),\n    headers: {\n      'Access-Control-Allow-Origin':\
        \ '*',\n      'Access-Control-Allow-Headers': 'Content-Type',\n      'Access-Control-Allow-Methods':\
        \ 'GET'\n    }\n  };\n};"
      Events:
        GetQuestionSetsEvent:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: GameApi
            Path: /question-sets
