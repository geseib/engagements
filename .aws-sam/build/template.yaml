    Export:
      Name:
        Fn::Sub: ${StackName}-frontend-bucket
  FrontendUrl:
    Description: Frontend URL
    Value:
      Fn::If:
      - HasDomain
      - Fn::Sub: https://${DomainName}
      - Fn::Sub: http://${FrontendBucket}.s3-website-${AWS::Region}.amazonaws.com
    Export:
      Name:
        Fn::Sub: ${StackName}-frontend-url
  GameTableName:
    Description: DynamoDB table name
    Value:
      Ref: GameTable
    Export:
      Name:
        Fn::Sub: ${StackName}-table-name
  AIPromptsBucketName:
    Description: AI Prompts S3 bucket name
    Value:
      Ref: AIPromptsBucket
    Export:
      Name:
        Fn::Sub: ${StackName}-ai-prompts-bucket
  Environment:
    Description: Environment name
    Value:
      Ref: Environment
    Export:
      Name:
        Fn::Sub: ${StackName}-environment
  StackName:
    Description: CloudFormation stack name
    Value:
      Ref: AWS::StackName
    Export:
      Name:
        Fn::Sub: ${StackName}-stack-name
