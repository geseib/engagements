        \     statusCode: statusCode,\n      body: JSON.stringify({ \n        error:\
        \ userMessage,\n        details: error.message // For debugging, can be removed\
        \ in production\n      }),\n      headers: { 'Access-Control-Allow-Origin':\
        \ '*' }\n    };\n  }\n};"
      Events:
