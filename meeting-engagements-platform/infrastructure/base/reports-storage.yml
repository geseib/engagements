AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3 Storage for Engagement Reports with Configurable Lifecycle Management'

Parameters:
  Environment:
    Type: String
    Default: 'dev'
    AllowedValues: ['dev', 'test', 'prod']
    Description: 'Environment name'
  
  DefaultReportRetentionDays:
    Type: Number
    Default: 90
    MinValue: 30
    MaxValue: 2555  # 7 years max
    Description: 'Default retention period for PDF reports in days'

Resources:
  # S3 Bucket for storing PDF reports
  EngagementReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-engagement-reports-${Environment}'
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteReportsAfterRetentionPeriod
            Status: Enabled
            ExpirationInDays: !Ref DefaultReportRetentionDays
            NoncurrentVersionExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: TransitionToIA
            Status: Enabled
            Transition:
              StorageClass: STANDARD_IA
              TransitionInDays: 30
          - Id: TransitionToGlacier
            Status: Enabled
            Transition:
              StorageClass: GLACIER
              TransitionInDays: 60
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ReportProcessorFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .pdf

  # Lambda function to process uploaded reports
  ReportProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-report-processor-${Environment}'
      Runtime: nodejs18.x
      Handler: index.handler
      Role: !GetAtt ReportProcessorRole.Arn
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref DynamoDBTableName
          REPORTS_BUCKET: !Ref EngagementReportsBucket
          ENVIRONMENT: !Ref Environment
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const dynamodb = new AWS.DynamoDB.DocumentClient();
          
          exports.handler = async (event) => {
            console.log('Processing S3 event:', JSON.stringify(event, null, 2));
            
            for (const record of event.Records) {
              if (record.eventName.startsWith('ObjectCreated')) {
                const bucket = record.s3.bucket.name;
                const key = record.s3.object.key;
                
                // Extract engagement ID from S3 key: reports/{engagementId}/{timestamp}-report.pdf
                const engagementId = key.split('/')[1];
                
                if (engagementId) {
                  await updateEngagementWithReport(engagementId, key);
                }
              }
            }
          };
          
          async function updateEngagementWithReport(engagementId, s3Key) {
            try {
              await dynamodb.update({
                TableName: process.env.DYNAMODB_TABLE,
                Key: {
                  PK: `ENGAGEMENT#${engagementId}`,
                  SK: 'METADATA'
                },
                UpdateExpression: 'SET ReportGenerated = :generated, ReportS3Key = :s3Key, ReportGeneratedAt = :timestamp',
                ExpressionAttributeValues: {
                  ':generated': true,
                  ':s3Key': s3Key,
                  ':timestamp': new Date().toISOString()
                }
              }).promise();
              
              console.log(`Updated engagement ${engagementId} with report ${s3Key}`);
            } catch (error) {
              console.error(`Failed to update engagement ${engagementId}:`, error);
            }
          }

  # IAM Role for Report Processor Lambda
  ReportProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReportProcessorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub '${EngagementReportsBucket}/*'

  # Lambda permission for S3 to invoke the function
  ReportProcessorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReportProcessorFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub '${EngagementReportsBucket}/*'

  # Lambda function to update S3 lifecycle policies when settings change
  LifecyclePolicyUpdaterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-lifecycle-updater-${Environment}'
      Runtime: nodejs18.x
      Handler: index.handler
      Role: !GetAtt LifecyclePolicyUpdaterRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          REPORTS_BUCKET: !Ref EngagementReportsBucket
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const s3 = new AWS.S3();
          
          exports.handler = async (event) => {
            console.log('Updating S3 lifecycle policy:', JSON.stringify(event, null, 2));
            
            const { retentionDays } = event;
            
            if (!retentionDays || retentionDays < 30) {
              throw new Error('Invalid retention days. Minimum is 30 days.');
            }
            
            const lifecycleConfig = {
              Rules: [
                {
                  ID: 'DeleteReportsAfterRetentionPeriod',
                  Status: 'Enabled',
                  Filter: {
                    Prefix: 'reports/'
                  },
                  Expiration: {
                    Days: retentionDays
                  },
                  NoncurrentVersionExpiration: {
                    NoncurrentDays: 1
                  },
                  AbortIncompleteMultipartUpload: {
                    DaysAfterInitiation: 1
                  }
                },
                {
                  ID: 'TransitionToIA',
                  Status: 'Enabled',
                  Filter: {
                    Prefix: 'reports/'
                  },
                  Transitions: [
                    {
                      Days: Math.min(30, Math.floor(retentionDays / 3)),
                      StorageClass: 'STANDARD_IA'
                    },
                    {
                      Days: Math.min(60, Math.floor(retentionDays / 2)),
                      StorageClass: 'GLACIER'
                    }
                  ]
                }
              ]
            };
            
            await s3.putBucketLifecycleConfiguration({
              Bucket: process.env.REPORTS_BUCKET,
              LifecycleConfiguration: lifecycleConfig
            }).promise();
            
            console.log(`Updated lifecycle policy with ${retentionDays} days retention`);
            
            return {
              statusCode: 200,
              body: JSON.stringify({
                message: 'Lifecycle policy updated successfully',
                retentionDays
              })
            };
          };

  # IAM Role for Lifecycle Policy Updater
  LifecyclePolicyUpdaterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LifecyclePolicyUpdaterPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutLifecycleConfiguration
                  - s3:GetLifecycleConfiguration
                Resource: !GetAtt EngagementReportsBucket.Arn

  # CloudWatch Log Groups
  ReportProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ReportProcessorFunction}'
      RetentionInDays: 14

  LifecyclePolicyUpdaterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${LifecyclePolicyUpdaterFunction}'
      RetentionInDays: 14

Parameters:
  DynamoDBTableName:
    Type: String
    Description: 'Name of the DynamoDB table for engagement data'

Outputs:
  ReportsBucketName:
    Description: 'Name of the S3 bucket for engagement reports'
    Value: !Ref EngagementReportsBucket
    Export:
      Name: !Sub '${AWS::StackName}-ReportsBucket'

  ReportsBucketArn:
    Description: 'ARN of the S3 bucket for engagement reports'
    Value: !GetAtt EngagementReportsBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ReportsBucketArn'

  ReportProcessorFunctionArn:
    Description: 'ARN of the report processor Lambda function'
    Value: !GetAtt ReportProcessorFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ReportProcessorFunction'

  LifecyclePolicyUpdaterFunctionArn:
    Description: 'ARN of the lifecycle policy updater Lambda function'
    Value: !GetAtt LifecyclePolicyUpdaterFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LifecyclePolicyUpdaterFunction'
