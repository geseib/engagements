AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Clean Engagements Platform with consistent resource naming
  Environment: {Environment}
  Domain: {DomainName}

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
    Description: Environment name (dev, test, prod)

  StackName:
    Type: String
    Description: Stack name for resource naming (e.g., engagedev, engagetest, engageprod)

  DomainName:
    Type: String
    Description: Primary domain name for this environment
    Default: ""

  SecondaryDomainName:
    Type: String
    Description: Secondary domain name (for prod dual domains)
    Default: ""

  HostedZoneId:
    Type: String
    Description: Route53 hosted zone ID
    Default: "ZB9TUA073B5SH"

  GitHubToken:
    Type: String
    Description: GitHub Personal Access Token for creating issues
    NoEcho: true
    Default: ""

  GitHubRepo:
    Type: String
    Description: GitHub repository in format owner/repo-name
    Default: "geseib/engagements"

  # Google OAuth credentials are passed as values (not SSM references)
  # because CloudFormation does not support ssm-secure dynamic references
  # in Cognito UserPoolIdentityProvider properties. The deploy script
  # (scripts/deploy-clean.sh) fetches them from SSM (/engdev/google/*) and
  # passes them through; when empty, Google OAuth resources are skipped.
  GoogleClientId:
    Type: String
    Description: Google OAuth Client ID (empty disables Google sign-in resources)
    Default: ""

  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: Google OAuth Client Secret (empty disables Google sign-in resources)
    Default: ""

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasSecondaryDomain: !Not [!Equals [!Ref SecondaryDomainName, ""]]
  IsProd: !Equals [!Ref Environment, "prod"]
  # True when the deploy passes Google credentials (dev's deploy script
  # fetches them from /engdev/google/* SSM params). Test/prod CI does not
  # pass them yet and stays on console-configured providers; before enabling
  # there, delete the console-created provider so CFN can own it.
  HasGoogleOAuth: !Not [!Equals [!Ref GoogleClientSecret, ""]]

Globals:
  Function:
    # Lambda runtime for all functions. Bumped nodejs18.x (EOL) -> nodejs22.x on 2026-08-04.
    # Single change point; smoke-test AI + WebSocket functions after any runtime change.
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref GameTable
        WEBSOCKET_API_ENDPOINT: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
        ENVIRONMENT: !Ref Environment
        # Account ID for constructing Bedrock inference-profile ARNs at runtime
        # (replaces hardcoded account IDs that used to live in Lambda source).
        ACCOUNT_ID: !Ref AWS::AccountId

Resources:

  ### DynamoDB Table with Simple Naming
  GameTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref StackName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: StackName
          Value: !Ref StackName

  ### WebSocket API with Simple Naming
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${StackName}-api-ws'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ### WebSocket Deployment
  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - ConnectRoute
      - DisconnectRoute
      - MessageRoute
    Properties:
      ApiId: !Ref WebSocketApi

  ### WebSocket Stage
  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: !Ref Environment
      Description: !Sub '${Environment} stage for WebSocket API'
      DeploymentId: !Ref WebSocketDeployment
      ApiId: !Ref WebSocketApi
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ### Lambda Functions with Simple Naming

  ## WebSocket Functions
  ConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-connect'
      CodeUri: lambda-functions/websocket/
      Handler: connect.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  DisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-disconnect'
      CodeUri: lambda-functions/websocket/
      Handler: disconnect.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  MessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-message'
      CodeUri: lambda-functions/websocket/
      Handler: message.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ## Game Management Functions
  CreateGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-create-game'
      CodeUri: lambda-functions/websocket/
      Handler: create-game.handler
      Events:
        CreateGame:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  StartQuestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-start-question'
      CodeUri: lambda-functions/websocket/
      Handler: start-question.handler
      Events:
        StartQuestion:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/start-question
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  StartVoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-start-vote'
      CodeUri: lambda-functions/websocket/
      Handler: start-vote.handler
      Events:
        StartVote:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/start-vote
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ### HTTP API with Simple Naming (like original GameApi)
  RestApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["OPTIONS","GET","POST","PUT","DELETE"]
        AllowHeaders: ["Content-Type", "Authorization"]
        ExposeHeaders: ["Content-Length", "X-Request-Id"]
      # Lambda authorizer (UserPoolV2 JWTs). No DefaultAuthorizer on purpose:
      # player and host game routes stay public; admin routes opt in per-event
      # with "Auth: Authorizer: CognitoAuthorizer". Exception: the
      # /admin/create-github-issue feedback route stays public because the
      # player page's IssueFab uses it anonymously.
      Auth:
        Authorizers:
          CognitoAuthorizer:
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            Identity:
              Headers:
                - Authorization
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ## Admin Functions
  AdminGetQuestionSetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-admin-get-question-sets'
      CodeUri: lambda-functions/admin/
      Handler: get-question-sets.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        AdminGetQuestionSetsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /admin/question-sets
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  AdminGetQuestionSetQuestionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-admin-get-question-set-questions'
      CodeUri: lambda-functions/admin/
      Handler: get-question-set-questions.handler
      Runtime: nodejs22.x
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref GameTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        AdminGetQuestionSetQuestionsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /question-sets/{setId}/questions
            Method: GET
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ## Main Question Sets Function (for game creation)
  GetQuestionSetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-get-question-sets'
      CodeUri: lambda-functions/game/
      Handler: get-question-sets.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        GetQuestionSetsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /question-sets
            Method: GET
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ## Game Flow Functions
  GetGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-get-game'
      CodeUri: lambda-functions/game/
      Handler: get-game.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        GetGameEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}
            Method: GET
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  StartGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-start-game'
      CodeUri: lambda-functions/game/
      Handler: start-game.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        StartGameEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/start
            Method: POST
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  NextQuestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-next-question'
      CodeUri: lambda-functions/game/
      Handler: next-question.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Events:
        NextQuestionEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/next-question
            Method: POST
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ToggleCategoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-toggle-category'
      CodeUri: lambda-functions/game/
      Handler: toggle-category.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        ToggleCategoryEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/toggle-category
            Method: POST
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  GetQuestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-get-question'
      CodeUri: lambda-functions/game/
      Handler: get-question.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        GetQuestionEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/question
            Method: GET
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName


  GetAnswersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-get-answers'
      CodeUri: lambda-functions/game/
      Handler: get-answers.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        GetAnswersEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/answers
            Method: GET
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName


  GetResultsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-get-results'
      CodeUri: lambda-functions/game/
      Handler: get-results.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        GetResultsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/get-results
            Method: POST
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  CreateReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-create-report'
      CodeUri: lambda-functions/game/
      Handler: create-report.handler
      Events:
        CreateReportEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/report
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  GetReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-get-report'
      CodeUri: lambda-functions/game/
      Handler: get-report.handler
      Events:
        GetReportEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/report
            Method: GET
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  SaveReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-save-report'
      CodeUri: lambda-functions/game/
      Handler: save-report.handler
      Timeout: 60
      Events:
        SaveReportEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/save-report
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - S3CrudPolicy:
            BucketName: !Ref ReportsBucket
      Environment:
        Variables:
          REPORTS_BUCKET_NAME: !Ref ReportsBucket
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  GetAISummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-get-ai-summary'
      CodeUri: lambda-functions/game/
      Handler: get-ai-summary.handler
      Runtime: nodejs22.x
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref GameTable
          AI_PROMPTS_BUCKET: !Ref AIPromptsBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - S3ReadPolicy:
            BucketName: !Ref AIPromptsBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6'
                - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0'
                - 'arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-4-6'
                - 'arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-6'
                - 'arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-4-6'
                - 'arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0'
                - 'arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0'
                - 'arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0'
        # Async generation: self-invoke worker (Event) + WebSocket broadcast of aiSummaryReady/aiSummaryError
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackName}-get-ai-summary'
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Events:
        GetAISummaryEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/ai-summary
            Method: GET
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName


  GetPlayersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-get-players'
      CodeUri: lambda-functions/game/
      Handler: get-players.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        GetPlayersEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/players
            Method: GET

  GetGamesListFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-get-games-list'
      CodeUri: lambda-functions/game/
      Handler: get-games-list.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        GetGamesListEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games
            Method: GET
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  GetGameStateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-get-game-state'
      CodeUri: lambda-functions/game/
      Handler: get-game-state.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        GetGameStateEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/state
            Method: GET
        GetGameStateWithPlayerEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/state/{playerId}
            Method: GET
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  GetCategoriesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-get-categories'
      CodeUri: lambda-functions/game/
      Handler: get-categories.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        GetCategoriesEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /question-sets/{setId}/categories
            Method: GET
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  JoinGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-join-game'
      CodeUri: lambda-functions/game/
      Handler: join-game.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Events:
        JoinGameEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/players
            Method: POST
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  SubmitVoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-submit-vote'
      CodeUri: lambda-functions/game/
      Handler: submit-vote.handler
      Runtime: nodejs22.x
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref GameTable
          WEBSOCKET_API_ENDPOINT: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Events:
        SubmitVoteEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/votes
            Method: POST
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  GetVotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-get-votes'
      CodeUri: lambda-functions/game/
      Handler: get-votes.handler
      Runtime: nodejs22.x
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref GameTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        GetVotesEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/votes
            Method: GET
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  AdminAIGenerateQuestionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-admin-ai-generate-questions'
      CodeUri: lambda-functions/admin/
      Handler: ai-generate-questions.handler
      Runtime: nodejs22.x
      Timeout: 900
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6'
                - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0'
                - 'arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-4-6'
                - 'arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-6'
                - 'arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-sonnet-4-6'
