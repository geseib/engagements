  ### WebSocket Integrations
  ConnectInteg:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      Description: Connect Integration
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConnectFunction.Arn}/invocations'

  DisconnectInteg:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      Description: Disconnect Integration
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DisconnectFunction.Arn}/invocations'

  MessageInteg:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      Description: Message Integration
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MessageFunction.Arn}/invocations'

  ### Lambda Permissions
  ConnectPermission:
    Type: AWS::Lambda::Permission
    DependsOn:
      - WebSocketApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ConnectFunction
      Principal: apigateway.amazonaws.com

  DisconnectPermission:
    Type: AWS::Lambda::Permission
    DependsOn:
      - WebSocketApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DisconnectFunction
      Principal: apigateway.amazonaws.com

  MessagePermission:
    Type: AWS::Lambda::Permission
    DependsOn:
      - WebSocketApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MessageFunction
      Principal: apigateway.amazonaws.com

  ### Cognito Resources for Authentication
  UserPoolV2:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${StackName}-users'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: status
          AttributeDataType: String
          Mutable: true
        - Name: role
          AttributeDataType: String
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      # THE EMAIL A PERSON ACTUALLY RECEIVES.
      #
      # Reported: "even in test it is generic and there is nothing reference that
      # it is for engage. it would be nice to use the domain and also a bit of
      # info around what it really is for."
      #
      # There was no VerificationMessageTemplate here at all, so both pools sent
      # Cognito's stock wording: a bare six-digit code, no product name, no
      # domain, and nothing saying what the code unlocks. Someone who requested
      # a reset an hour earlier could not tell it apart from a phishing attempt.
      #
      # ONE TEMPLATE COVERS BOTH JOURNEYS. With DefaultEmailOption
      # CONFIRM_WITH_CODE, Cognito uses EmailMessage/EmailSubject for sign-up
      # verification AND for forgot-password. {####} is the code and is the one
      # token Cognito substitutes — it MUST appear in the body or the stack
      # fails to deploy, which is the guardrail that stops a well-meaning
      # rewrite from shipping an email with no code in it.
      #
      # The domain is interpolated rather than hardcoded so dev, test and prod
      # each name themselves. `DomainName` defaults to "" — the !If keeps the
      # sentence grammatical when it is unset rather than printing "at .".
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: !Sub 'Your Engage verification code (${StackName})'
        EmailMessage: !If
          - HasDomain
          - !Sub |
              <p>Someone asked to verify an email address or reset a password for
              <strong>Engage</strong> at <a href="https://${DomainName}">${DomainName}</a>.</p>
              <p>Your code is <strong>{####}</strong></p>
              <p>Enter it on the sign-in screen to finish. The code expires shortly.</p>
              <p>If this wasn't you, no action is needed — the code is useless on its own
              and nothing has changed on your account.</p>
          - !Sub |
              <p>Someone asked to verify an email address or reset a password for
              <strong>Engage</strong> (${StackName}).</p>
              <p>Your code is <strong>{####}</strong></p>
              <p>Enter it on the sign-in screen to finish. The code expires shortly.</p>
              <p>If this wasn't you, no action is needed — the code is useless on its own
              and nothing has changed on your account.</p>
      # PostConfirmation trigger will be configured after deployment to avoid circular dependency
      UserPoolTags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${StackName}-web-client'
      UserPoolId: !Ref UserPoolV2
      GenerateSecret: false
      # !Ref on a UserPoolIdentityProvider returns its ProviderName ("Google")
      # AND creates the implicit dependency that orders provider creation
      # before this client update (a literal "Google" races and fails).
      SupportedIdentityProviders: !If
        - HasGoogleOAuth
        - [COGNITO, !Ref GoogleIdentityProvider]
        - [COGNITO]
        # Social providers commented out - configure manually in Cognito Console after deployment
        # - Facebook  
        # - LoginWithAmazon
        # - SignInWithApple
      CallbackURLs:
        - !If 
          - HasDomain
          - !Sub 'https://${DomainName}/auth/callback'
          - !Sub 'http://localhost:3000/auth/callback'
        - !If
          - HasSecondaryDomain
          - !Sub 'https://${SecondaryDomainName}/auth/callback'
          - !Ref AWS::NoValue
      LogoutURLs:
        - !If 
          - HasDomain
          - !Sub 'https://${DomainName}'
          - !Sub 'http://localhost:3000'
        - !If
          - HasSecondaryDomain
          - !Sub 'https://${SecondaryDomainName}'
          - !Ref AWS::NoValue
      AllowedOAuthFlows:
        - code
        - implicit
      AllowedOAuthScopes:
        - email
        - openid
        - profile
        - aws.cognito.signin.user.admin
      AllowedOAuthFlowsUserPoolClient: true
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      # Explicit (matches the default) — also forces CloudFormation to
      # re-apply this resource and correct live drift: the deployed client
      # had lost its ExplicitAuthFlows to a manual console edit.
      EnableTokenRevocation: true
      RefreshTokenValidity: 30
      AccessTokenValidity: 1
      IdTokenValidity: 1
      TokenValidityUnits:
        RefreshToken: days
        AccessToken: hours
        IdToken: hours

  UserPoolDomainV2:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${StackName}-auth-v2'
      UserPoolId: !Ref UserPoolV2

  # User Groups
  AdminUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      Description: Administrator users with full access
      UserPoolId: !Ref UserPoolV2
      Precedence: 1

  HostUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: hosts
      Description: Host users who can create and manage games
      UserPoolId: !Ref UserPoolV2
      Precedence: 2

  PendingUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: pending
      Description: Users awaiting approval
      UserPoolId: !Ref UserPoolV2
      Precedence: 3

  # Google Identity Provider
  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogleOAuth
    Properties:
      UserPoolId: !Ref UserPoolV2
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: email openid profile
      AttributeMapping:
        email: email
        name: name
        username: sub

# Temporarily commented out Identity Pool to resolve circular dependency
  # # Identity Pool for authenticated and unauthenticated access
  # IdentityPool:
  #   Type: AWS::Cognito::IdentityPool
  #   Properties:
  #     IdentityPoolName: !Sub '${StackName}-identity-pool'
  #     AllowUnauthenticatedIdentities: true
  #     CognitoIdentityProviders:
  #       - ClientId: !Ref UserPoolClient
