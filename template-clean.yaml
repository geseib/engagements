    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-admin-export-to-archive'
      CodeUri: lambda-functions/admin/
      Handler: export-to-archive.handler
      Runtime: nodejs22.x
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref GameTable
          ARCHIVE_SERVICE_URL: 'https://archive.seibtribe.us'
          # THE REASON EVERY ARCHIVED PROMPT WAS EMPTY.
          #
          # A prompt is a two-store record: the pointer row in DynamoDB, and the
          # BODY in this bucket at `s3Key`. export-to-archive.js reads
          # `process.env.AI_PROMPTS_BUCKET` to fetch that body — and this
          # function had neither the variable nor the S3 read below, so the
          # fetch failed on every prompt, every time. The old code swallowed
          # that into `promptContent = {}` and uploaded a metadata-only shell
          # with a 200, so nine prompts sat in the shared archive with
          # instructions, outputFormat, template and scenario all "" while the
          # console reported nine successful exports.
          AI_PROMPTS_BUCKET: !Ref AIPromptsBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        # Read-only: an export reads bodies, it never writes one.
        - S3ReadPolicy:
            BucketName: !Ref AIPromptsBucket
      Events:
        ExportToArchive:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /admin/export-to-archive
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  AdminImportFromArchiveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-admin-import-from-archive'
      CodeUri: lambda-functions/admin/
      Handler: import-from-archive.handler
      Runtime: nodejs22.x
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref GameTable
          ARCHIVE_SERVICE_URL: 'https://archive.seibtribe.us'
          # The mirror of the export function's variable, and needed for the
          # same structural reason: importing a prompt means WRITING a body into
          # this bucket and pointing the new row's `s3Key` at it. An import that
          # only writes the DynamoDB row produces a prompt every reader treats
          # as bodyless — which is what import-from-archive.js did.
          AI_PROMPTS_BUCKET: !Ref AIPromptsBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - 'arn:aws:s3:::engage2-archive-content/*'
        # Crud, not Read: this one puts the body it just downloaded.
        - S3CrudPolicy:
            BucketName: !Ref AIPromptsBucket
      Events:
        ImportFromArchive:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /admin/import-from-archive
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

