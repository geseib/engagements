AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Clean Engagements Platform with consistent resource naming
  Environment: {Environment}
  Domain: {DomainName}

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
    Description: Environment name (dev, test, prod)

  StackName:
    Type: String
    Description: Stack name for resource naming (e.g., engagedev, engagetest, engageprod)

  DomainName:
    Type: String
    Description: Primary domain name for this environment
    Default: ""

  SecondaryDomainName:
    Type: String
    Description: Secondary domain name (for prod dual domains)
    Default: ""

  HostedZoneId:
    Type: String
    Description: Route53 hosted zone ID
    Default: "ZB9TUA073B5SH"

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasSecondaryDomain: !Not [!Equals [!Ref SecondaryDomainName, ""]]
  IsProd: !Equals [!Ref Environment, "prod"]

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref GameTable
        WEBSOCKET_API_ENDPOINT: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
        ENVIRONMENT: !Ref Environment

Resources:

  ### DynamoDB Table with Simple Naming
  GameTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref StackName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: StackName
          Value: !Ref StackName

  ### WebSocket API with Simple Naming
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${StackName}-api-ws'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ### WebSocket Deployment
  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - ConnectRoute
      - DisconnectRoute
      - MessageRoute
    Properties:
      ApiId: !Ref WebSocketApi

  ### WebSocket Stage
  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: !Ref Environment
      Description: !Sub '${Environment} stage for WebSocket API'
      DeploymentId: !Ref WebSocketDeployment
      ApiId: !Ref WebSocketApi
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ### Lambda Functions with Simple Naming

  ## WebSocket Functions
  ConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-connect'
      CodeUri: lambda-functions/websocket/
      Handler: connect.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  DisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-disconnect'
      CodeUri: lambda-functions/websocket/
      Handler: disconnect.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  MessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-message'
      CodeUri: lambda-functions/websocket/
      Handler: message.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ## Game Management Functions
  CreateGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-create-game'
      CodeUri: lambda-functions/websocket/
      Handler: create-game.handler
      Events:
        CreateGame:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /games
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  StartQuestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-start-question'
      CodeUri: lambda-functions/websocket/
      Handler: start-question.handler
      Events:
        StartQuestion:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /games/{gameId}/start-question
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  StartVoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-start-vote'
      CodeUri: lambda-functions/websocket/
      Handler: start-vote.handler
      Events:
        StartVote:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /games/{gameId}/start-vote
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ### REST API with Simple Naming
  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${StackName}-api-rest'
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ## Admin Functions
  AdminGetQuestionSetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-admin-get-question-sets'
      Handler: index.getQuestionSets
      Runtime: nodejs18.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Environment:
        Variables:
          TABLE_NAME: !Ref GameTable
      InlineCode: |-
        const { DynamoDBClient } = require('@aws-sdk/client-dynamodb');
        const { DynamoDBDocumentClient, QueryCommand } = require('@aws-sdk/lib-dynamodb');

        const client = new DynamoDBClient({});
        const db = DynamoDBDocumentClient.from(client);

        exports.getQuestionSets = async (event) => {
          try {
            console.log('Getting question sets...');

            // Get all question set metadata (both active and inactive)
            const res = await db.send(new QueryCommand({
              TableName: process.env.TABLE_NAME,
              KeyConditionExpression: 'PK = :pk',
              ExpressionAttributeValues: { ':pk': 'SETS' }
            }));

            const questionSets = res.Items.map(item => ({
              id: item.SK.replace('SET#', ''),
              name: item.name,
              description: item.description,
              customInstruction: item.customInstruction,
              aiContextInstruction: item.aiContextInstruction,
              engagementType: item.engagementType,
              questionCount: item.questionCount || 0,
              active: item.active !== false,
              createdAt: item.createdAt,
              updatedAt: item.updatedAt
            }));

            return {
              statusCode: 200,
              body: JSON.stringify({ questionSets }),
              headers: { 'Access-Control-Allow-Origin': '*' }
            };

          } catch (error) {
            console.error('Get question sets error:', error);
            return {
              statusCode: 500,
              body: JSON.stringify({ error: `Failed to get question sets: ${error.message}` }),
              headers: { 'Access-Control-Allow-Origin': '*' }
            };
          }
        };
      Events:
        AdminGetQuestionSetsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /admin/question-sets
            Method: GET
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  AdminAIGenerateQuestionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-admin-ai-generate-questions'
      Handler: index.generateQuestions
      Runtime: nodejs18.x
      Timeout: 900
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-3-5-sonnet-20241022-v2:0'
                - 'arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0'
                - 'arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0'
                - 'arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0'
      Environment:
        Variables:
          TABLE_NAME: !Ref GameTable
      InlineCode: |-
        const { BedrockRuntimeClient, InvokeModelCommand } = require('@aws-sdk/client-bedrock-runtime');

        const bedrockClient = new BedrockRuntimeClient({ region: 'us-east-1' });

        // Function to call Claude via Bedrock
        const invokeClaude = async (prompt) => {
          const modelId = 'us.anthropic.claude-3-5-sonnet-20241022-v2:0';

          console.log(`🤖 Calling Claude for question generation...`);

          const payload = {
            anthropic_version: 'bedrock-2023-05-31',
            max_tokens: 3000,
            messages: [
              {
                role: 'user',
                content: [{ type: 'text', text: prompt }],
              },
            ],
          };

          const command = new InvokeModelCommand({
            contentType: 'application/json',
            body: JSON.stringify(payload),
            modelId,
          });

          const response = await bedrockClient.send(command);
          const responseBody = JSON.parse(new TextDecoder().decode(response.body));

          return responseBody.content[0].text;
        };

        exports.generateQuestions = async (event) => {
          try {
            console.log('🤖 Lambda function started for question generation');
            console.log('Event:', JSON.stringify(event, null, 2));

            // Handle CORS preflight
            if (event.requestContext?.http?.method === 'OPTIONS') {
              return {
                statusCode: 200,
                headers: {
                  'Access-Control-Allow-Origin': '*',
                  'Access-Control-Allow-Headers': 'Content-Type',
                  'Access-Control-Allow-Methods': 'POST, OPTIONS'
                },
                body: ''
              };
            }

            if (!event.body) {
              throw new Error('No request body provided');
            }

            const { engagementType, userInput, questionCount, existingQuestion, context } = JSON.parse(event.body);

            console.log(`🤖 Generating ${questionCount} ${engagementType} questions`);
            console.log(`📝 User input: ${userInput}`);

            // Build the AI prompt based on engagement type
            let prompt = `You are an expert educational content creator. `;

            if (existingQuestion) {
              prompt += `Please improve the following ${engagementType} question based on the user's feedback.\n\n`;
              prompt += `EXISTING QUESTION:\n`;
              prompt += `Title: ${existingQuestion.title}\n`;
              prompt += `Category: ${existingQuestion.category}\n`;
              prompt += `Detail: ${existingQuestion.detail}\n`;
              if (engagementType === 'trivia') {
                prompt += `Correct Answer: ${existingQuestion.correctAnswer}\n`;
                prompt += `Wrong Answers: ${existingQuestion.wrongAnswers.join(', ')}\n`;
              } else if (engagementType === 'poll') {
                prompt += `Options: ${existingQuestion.options.join(', ')}\n`;
              }
              prompt += `\nUSER FEEDBACK: ${userInput}\n\n`;
            } else {
              prompt += `Please create ${questionCount} high-quality ${engagementType} questions based on the following requirements:\n\n`;
              prompt += `REQUIREMENTS: ${userInput}\n\n`;
              if (context.title) prompt += `Question Set Title: ${context.title}\n`;
              if (context.description) prompt += `Description: ${context.description}\n`;
            }

            // Add format instructions based on engagement type
            if (engagementType === 'trivia') {
              prompt += '\\n\\nPlease format your response as a JSON array with this structure:';
              prompt += '\\n[{"title": "Question text", "category": "Category", "detail": "Context", "school": "School", "customInstructions": "Instructions", "correctAnswer": "Answer", "wrongAnswers": ["Wrong1", "Wrong2", "Wrong3"], "difficulty": "medium"}]';
            } else if (engagementType === 'poll') {
              prompt += '\\n\\nPlease format your response as a JSON array with this structure:';
              prompt += '\\n[{"title": "Poll question", "category": "Category", "detail": "Context", "school": "School", "customInstructions": "Instructions", "options": ["Option1", "Option2"], "allowMultiple": false}]';
            } else {
              prompt += '\\n\\nPlease format your response as a JSON array with this structure:';
              prompt += '\\n[{"title": "Question text", "category": "Category", "detail": "Detailed context", "school": "School", "customInstructions": "Instructions"}]';
            }

            prompt += '\\n\\nIMPORTANT: Return ONLY the JSON array, no additional text.';

            console.log('🤖 Sending prompt to Claude...');
            const aiResponse = await invokeClaude(prompt);
            console.log('✅ Received response from Claude');

            // Parse the JSON response with improved error handling
            let questions;
            try {
              console.log('🔍 Parsing AI response...');
              console.log('Raw response length:', aiResponse.length);
              console.log('First 500 chars:', aiResponse.substring(0, 500));

              // Try multiple parsing strategies
              let jsonString = aiResponse.trim();

              // Strategy 1: Direct parse if it looks like JSON
              if (jsonString.startsWith('[') && jsonString.endsWith(']')) {
                console.log('✅ Direct JSON parsing...');
                questions = JSON.parse(jsonString);
              } else {
                // Strategy 2: Extract JSON array with regex
                console.log('🔍 Extracting JSON with regex...');
                const jsonMatch = jsonString.match(/\[[\s\S]*\]/);
                if (jsonMatch) {
                  console.log('✅ Found JSON match, parsing...');
                  questions = JSON.parse(jsonMatch[0]);
                } else {
                  // Strategy 3: Try to find and clean JSON
                  console.log('🔍 Cleaning and extracting JSON...');
                  const startIndex = jsonString.indexOf('[');
                  const endIndex = jsonString.lastIndexOf(']');
                  if (startIndex !== -1 && endIndex !== -1 && endIndex > startIndex) {
                    const extractedJson = jsonString.substring(startIndex, endIndex + 1);
                    console.log('✅ Extracted JSON, parsing...');
                    questions = JSON.parse(extractedJson);
                  } else {
                    throw new Error('No JSON array found in response');
                  }
                }
              }

              console.log('✅ Successfully parsed', questions.length, 'questions');
            } catch (parseError) {
              console.error('❌ Failed to parse AI response:', parseError);
              console.log('Raw response:', aiResponse);
              throw new Error('Failed to parse AI response as JSON: ' + parseError.message);
            }

            // Add IDs and ensure proper structure
            const processedQuestions = questions.map(q => ({
              id: Date.now() + Math.random(),
              active: true,
              ...q
            }));

            console.log(`✅ Successfully generated ${processedQuestions.length} questions`);

            return {
              statusCode: 200,
              body: JSON.stringify({
                questions: processedQuestions,
                message: `Generated ${processedQuestions.length} questions successfully`
              }),
              headers: {
                'Access-Control-Allow-Origin': '*',
                'Access-Control-Allow-Headers': 'Content-Type',
                'Access-Control-Allow-Methods': 'POST, OPTIONS'
              }
            };

          } catch (error) {
            console.error('❌ AI generation error:', error);
            return {
              statusCode: 500,
              body: JSON.stringify({ error: `Failed to generate questions: ${error.message}` }),
              headers: {
                'Access-Control-Allow-Origin': '*',
                'Access-Control-Allow-Headers': 'Content-Type',
                'Access-Control-Allow-Methods': 'POST, OPTIONS'
              }
            };
          }
        };
      Events:
        AdminAIGenerateQuestionsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /admin/ai-generate-questions
            Method: POST
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  AdminUploadQuestionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-admin-upload-questions'
      Handler: index.uploadQuestions
      Runtime: nodejs18.x
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Environment:
        Variables:
          TABLE_NAME: !Ref GameTable
      InlineCode: |-
        const { DynamoDBClient } = require('@aws-sdk/client-dynamodb');
        const { DynamoDBDocumentClient, PutCommand, GetCommand } = require('@aws-sdk/lib-dynamodb');

        const client = new DynamoDBClient({});
        const db = DynamoDBDocumentClient.from(client);

        exports.uploadQuestions = async (event) => {
          try {
            const { fileName, fileContent, customTitle, customDescription, customInstructions, aiContextInstructions, engagementType } = JSON.parse(event.body);

            console.log(`Processing CSV upload: ${fileName}`);
            console.log(`Custom title: ${customTitle}`);
            console.log(`Custom instructions: ${customInstructions}`);
            console.log(`AI context instructions: ${aiContextInstructions}`);

            // Parse CSV content with better CSV parsing
            const lines = fileContent.split('\n').filter(line => line.trim());
            if (lines.length < 2) {
              return {
                statusCode: 400,
                body: JSON.stringify({ error: 'CSV file must have at least a header and one data row' }),
                headers: { 'Access-Control-Allow-Origin': '*' }
              };
            }

            // Extract set name from custom title or filename
            const setName = customTitle?.trim() || fileName.replace(/\.csv$/i, '');
            const setId = setName.toLowerCase().replace(/[^a-z0-9]/g, '');
            const setDescription = customDescription?.trim() || `Imported from ${fileName}`;

            // Enhanced CSV parsing function
            const parseCSVLine = (line) => {
              const result = [];
              let current = '';
              let inQuotes = false;

              for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                  inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                  result.push(current.trim());
                  current = '';
                } else {
                  current += char;
                }
              }
              result.push(current.trim());
              return result;
            };

            // Parse header with flexible mapping
            const headers = parseCSVLine(lines[0]).map(h => h.replace(/"/g, '').trim());
            console.log('🔍 Detected CSV Headers:', headers);

            // Simple and reliable column mapping - support exact greatest-hits.csv format or generic fallback
            const getColumnIndex = (header) => headers.findIndex(h => h.toLowerCase() === header.toLowerCase());

            // Try greatest-hits.csv format first: Category,Question#,Title,Detail_lesson,School,CustomInstruction
            let categoryIndex = getColumnIndex('Category');
            let titleIndex = getColumnIndex('Title');
            let detailIndex = getColumnIndex('Detail_lesson');
            let schoolIndex = getColumnIndex('School');
            let customInstructionIndex = getColumnIndex('CustomInstruction');

            // Engagement-type specific columns
            let correctAnswerIndex = -1;
            let wrongAnswer1Index = -1;
            let wrongAnswer2Index = -1;
            let wrongAnswer3Index = -1;
            let difficultyIndex = -1;
            let optionsIndex = -1;
            let allowMultipleIndex = -1;

            if (engagementType === 'trivia') {
              correctAnswerIndex = getColumnIndex('CorrectAnswer');
              wrongAnswer1Index = getColumnIndex('WrongAnswer1');
              wrongAnswer2Index = getColumnIndex('WrongAnswer2');
              wrongAnswer3Index = getColumnIndex('WrongAnswer3');
              difficultyIndex = getColumnIndex('Difficulty');
            } else if (engagementType === 'poll') {
              optionsIndex = getColumnIndex('Options');
              allowMultipleIndex = getColumnIndex('AllowMultiple');
            }

            // Fallback to generic column names if exact matches not found
            if (categoryIndex === -1) categoryIndex = headers.findIndex(h => h.toLowerCase().includes('category'));
            if (titleIndex === -1) titleIndex = headers.findIndex(h => h.toLowerCase().includes('title') && !h.toLowerCase().includes('#'));
            if (detailIndex === -1) detailIndex = headers.findIndex(h => h.toLowerCase().includes('detail') || h.toLowerCase().includes('lesson'));
            if (schoolIndex === -1) schoolIndex = headers.findIndex(h => h.toLowerCase().includes('school'));
            if (customInstructionIndex === -1) customInstructionIndex = headers.findIndex(h => h.toLowerCase().includes('instruction'));

            console.log('🔍 Detected CSV Headers:', headers);
            console.log('📋 Column Mapping:');
            console.log(`  Category: ${categoryIndex >= 0 ? headers[categoryIndex] : 'NOT FOUND'} (index: ${categoryIndex})`);
            console.log(`  Title: ${titleIndex >= 0 ? headers[titleIndex] : 'NOT FOUND'} (index: ${titleIndex})`);
            console.log(`  Detail: ${detailIndex >= 0 ? headers[detailIndex] : 'NOT FOUND'} (index: ${detailIndex})`);
            console.log(`  School: ${schoolIndex >= 0 ? headers[schoolIndex] : 'NOT FOUND'} (index: ${schoolIndex})`);
            console.log(`  Instructions: ${customInstructionIndex >= 0 ? headers[customInstructionIndex] : 'NOT FOUND'} (index: ${customInstructionIndex})`);

            // Check required columns
            if (categoryIndex === -1 || titleIndex === -1) {
              const missing = [];
              if (categoryIndex === -1) missing.push('Category');
              if (titleIndex === -1) missing.push('Title');

              return {
                statusCode: 400,
                body: JSON.stringify({
                  error: `Missing required columns: ${missing.join(', ')}. \nDetected headers: [${headers.join(', ')}]\nRequired: Category column (category/type/subject) and Title column (title/prompt/question)`
                }),
                headers: { 'Access-Control-Allow-Origin': '*' }
              };
            }

            // Parse questions with mapped columns
            const questions = [];
            const categories = new Set();
            let questionCount = 0;

            for (let i = 1; i < lines.length; i++) {
              try {
                const values = parseCSVLine(lines[i]);
                if (values.length < 2) continue; // Skip empty lines

                // Extract values using mapped indices
                const category = values[categoryIndex]?.replace(/"/g, '')?.trim();
                const title = values[titleIndex]?.replace(/"/g, '')?.trim();
                const detail = detailIndex >= 0 ? values[detailIndex]?.replace(/"/g, '')?.trim() || '' : '';
                const school = schoolIndex >= 0 ? values[schoolIndex]?.replace(/"/g, '')?.trim() || '' : '';
                const questionCustomInstruction = customInstructionIndex >= 0 ? values[customInstructionIndex]?.replace(/"/g, '')?.trim() || '' : '';

                if (title && category) {
                  questionCount++;

                  const baseQuestion = {
                    Title: title,
                    Detail: detail,
                    Category: category,
                    School: school,
                    // Use per-question custom instruction if available, otherwise use set-level custom instructions
                    CustomInstructions: questionCustomInstruction || customInstructions?.trim() || '',
                    Active: true,
                    QuestionNumber: questionCount
                  };

                  // Add engagement-type specific fields
                  if (engagementType === 'trivia') {
                    baseQuestion.CorrectAnswer = correctAnswerIndex >= 0 ? values[correctAnswerIndex]?.replace(/"/g, '')?.trim() || '' : '';
                    baseQuestion.WrongAnswer1 = wrongAnswer1Index >= 0 ? values[wrongAnswer1Index]?.replace(/"/g, '')?.trim() || '' : '';
                    baseQuestion.WrongAnswer2 = wrongAnswer2Index >= 0 ? values[wrongAnswer2Index]?.replace(/"/g, '')?.trim() || '' : '';
                    baseQuestion.WrongAnswer3 = wrongAnswer3Index >= 0 ? values[wrongAnswer3Index]?.replace(/"/g, '')?.trim() || '' : '';
                    baseQuestion.Difficulty = difficultyIndex >= 0 ? values[difficultyIndex]?.replace(/"/g, '')?.trim() || 'medium' : 'medium';
                  } else if (engagementType === 'poll') {
                    const optionsStr = optionsIndex >= 0 ? values[optionsIndex]?.replace(/"/g, '')?.trim() || '' : '';
                    baseQuestion.Options = optionsStr ? optionsStr.split('|').map(opt => opt.trim()) : [];
                    const allowMultipleStr = allowMultipleIndex >= 0 ? values[allowMultipleIndex]?.replace(/"/g, '')?.trim() || 'false' : 'false';
                    baseQuestion.AllowMultiple = allowMultipleStr.toLowerCase() === 'true';
                  }

                  questions.push(baseQuestion);
                  categories.add(category);

                  console.log(`  📝 Question ${questionCount}: ${category} - ${title.substring(0, 50)}...`);
                }
              } catch (e) {
                console.log(`⚠️ Skipping malformed line ${i}: ${lines[i].substring(0, 100)}...`);
              }
            }

            if (questions.length === 0) {
              return {
                statusCode: 400,
                body: JSON.stringify({ error: 'No valid questions found in CSV' }),
                headers: { 'Access-Control-Allow-Origin': '*' }
              };
            }

            console.log(`✅ Successfully parsed ${questions.length} questions in ${categories.size} categories`);

            // Check if set already exists
            const existingSet = await db.send(new GetCommand({
              TableName: process.env.TABLE_NAME,
              Key: { PK: 'SETS', SK: `SET#${setId}` }
            }));

            if (existingSet.Item) {
              return {
                statusCode: 400,
                body: JSON.stringify({ error: `Question set "${setName}" already exists. Please use a different title or delete the existing set first.` }),
                headers: { 'Access-Control-Allow-Origin': '*' }
              };
            }

            // Create set metadata with enhanced information
            await db.send(new PutCommand({
              TableName: process.env.TABLE_NAME,
              Item: {
                PK: 'SETS',
                SK: `SET#${setId}`,
                name: setName,
                description: setDescription,
                customInstruction: customInstructions?.trim() || '',
                aiContextInstruction: aiContextInstructions?.trim() || '',
                questionCount: questions.length,
                categoryCount: categories.size,
                active: true,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
                sourceFile: fileName,
                engagementType: engagementType || 'call-and-answer'
              }
            }));

            // Create categories
            const categoryPromises = Array.from(categories).map((categoryName, idx) => {
              const categoryId = `c${String(idx + 1).padStart(3, '0')}`;
              return db.send(new PutCommand({
                TableName: process.env.TABLE_NAME,
                Item: {
                  PK: `SET#${setId}`,
                  SK: `CATEGORY#${categoryId}`,
                  Name: categoryName,
                  Description: `${categoryName} questions`,
                  QuestionCount: questions.filter(q => q.Category === categoryName).length
                }
              }));
            });

            await Promise.all(categoryPromises);

            // Create questions with enhanced data
            console.log(`💾 Creating ${questions.length} questions in database...`);
            const questionPromises = questions.map((question, idx) => {
              const categoryIndex = Array.from(categories).indexOf(question.Category) + 1;
              const categoryId = `c${String(categoryIndex).padStart(3, '0')}`;
              const questionNumber = String(idx + 1).padStart(3, '0');
              const questionId = `QUESTION#${categoryId}#${questionNumber}`;

              return db.send(new PutCommand({
                TableName: process.env.TABLE_NAME,
                Item: {
                  PK: `SET#${setId}`,
                  SK: questionId,
                  Title: question.Title,
                  Detail: question.Detail || '',
                  Category: question.Category,
                  School: question.School || '',
                  CustomInstructions: question.CustomInstructions || '',
                  OrderInCategory: questionNumber,
                  QuestionNumber: question.QuestionNumber,
                  Active: true
                }
              }));
            });

            await Promise.all(questionPromises);

            console.log(`🎉 Successfully created question set "${setName}"`);
            console.log(`📊 Final stats: ${questions.length} questions, ${categories.size} categories`);

            return {
              statusCode: 200,
              body: JSON.stringify({
                setName: setName,
                setId: setId,
                questionCount: questions.length,
                categoryCount: categories.size,
                message: `Successfully created question set "${setName}" with ${questions.length} questions across ${categories.size} categories`
              }),
              headers: { 'Access-Control-Allow-Origin': '*' }
            };

          } catch (error) {
            console.error('Upload error:', error);
            return {
              statusCode: 500,
              body: JSON.stringify({ error: `Upload failed: ${error.message}` }),
              headers: { 'Access-Control-Allow-Origin': '*' }
            };
          }
        };
      Events:
        AdminUploadQuestionsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /admin/upload-questions
            Method: POST
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ### S3 Buckets with Simple Naming
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${StackName}-web'
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: StackName
          Value: !Ref StackName

  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${StackName}-reports'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldReports
            Status: Enabled
            ExpirationInDays: 90
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: StackName
          Value: !Ref StackName

  ### S3 Bucket Policy
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${FrontendBucket.Arn}/*'

  ### CloudFront Distribution (if domain is provided)
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasDomain
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
        Enabled: true
        DefaultRootObject: index.html
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref SSLCertificate
          SslSupportMethod: sni-only
        PriceClass: PriceClass_100
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: StackName
          Value: !Ref StackName

  ### SSL Certificate (if domain is provided)
  SSLCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: StackName
          Value: !Ref StackName

  ### Route53 Record (if domain is provided)
  DNSRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID

  ### WebSocket Routes
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      OperationName: ConnectRoute
      Target: !Join
        - '/'
        - - 'integrations'
          - !Ref ConnectInteg

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      OperationName: DisconnectRoute
      Target: !Join
        - '/'
        - - 'integrations'
          - !Ref DisconnectInteg

  MessageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      OperationName: MessageRoute
      Target: !Join
        - '/'
        - - 'integrations'
          - !Ref MessageInteg

  ### WebSocket Integrations
  ConnectInteg:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      Description: Connect Integration
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConnectFunction.Arn}/invocations'

  DisconnectInteg:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      Description: Disconnect Integration
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DisconnectFunction.Arn}/invocations'

  MessageInteg:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      Description: Message Integration
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MessageFunction.Arn}/invocations'

  ### Lambda Permissions
  ConnectPermission:
    Type: AWS::Lambda::Permission
    DependsOn:
      - WebSocketApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ConnectFunction
      Principal: apigateway.amazonaws.com

  DisconnectPermission:
    Type: AWS::Lambda::Permission
    DependsOn:
      - WebSocketApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DisconnectFunction
      Principal: apigateway.amazonaws.com

  MessagePermission:
    Type: AWS::Lambda::Permission
    DependsOn:
      - WebSocketApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MessageFunction
      Principal: apigateway.amazonaws.com

Outputs:
  # API Endpoints
  RestApiUrl:
    Description: REST API Gateway endpoint URL
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${StackName}-rest-api-url'

  WebSocketUrl:
    Description: WebSocket API Gateway endpoint URL
    Value: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${StackName}-websocket-url'

  # Frontend
  FrontendBucketName:
    Description: Frontend S3 bucket name
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub '${StackName}-frontend-bucket'

  FrontendUrl:
    Description: Frontend URL
    Value: !If
      - HasDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'http://${FrontendBucket}.s3-website-${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${StackName}-frontend-url'

  # Database
  GameTableName:
    Description: DynamoDB table name
    Value: !Ref GameTable
    Export:
      Name: !Sub '${StackName}-table-name'

  # Environment Info
  Environment:
    Description: Environment name
    Value: !Ref Environment
    Export:
      Name: !Sub '${StackName}-environment'

  StackName:
    Description: CloudFormation stack name
    Value: !Ref AWS::StackName
    Export:
      Name: !Sub '${StackName}-stack-name'
