  #               Action:
  #                 - execute-api:Invoke
  #               Resource:
  #                 # Only allow player endpoints
  #                 - !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/GET/games/*'
  #                 - !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/games/*/join'
  #                 - !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/games/*/answer'
  #                 - !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/games/*/vote'
  #                 - !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*'

  # # Attach roles to Identity Pool
  # IdentityPoolRoleAttachment:
  #   Type: AWS::Cognito::IdentityPoolRoleAttachment
