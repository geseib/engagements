  # Lambda Authorizer for the HTTP API (validates UserPoolV2 JWTs).
  # Payload format 2.0 simple responses — see lambda-functions/auth/authorizer.js.
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-authorizer'
      CodeUri: lambda-functions/auth/
      Handler: authorizer.handler
      Runtime: nodejs22.x
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPoolV2
          CLIENT_ID: !Ref UserPoolClient
          REGION: !Ref AWS::Region
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:AdminGetUser
              Resource: !GetAtt UserPoolV2.Arn
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  # SAM does NOT auto-create the invoke permission for HttpApi Lambda
  # authorizers — without this, API Gateway gets AccessDenied and every
  # authorized route returns 500. (This was likely the original "circular
  # dependency" mystery; the permission is a leaf resource, so no cycle.)
  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/authorizers/*'

  # User Management Lambda
  UserManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-user-management'
      CodeUri: lambda-functions/admin/
      Handler: manage-users.handler
      Runtime: nodejs22.x
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref GameTable
          USER_POOL_ID: !Ref UserPoolV2
          REGION: !Ref AWS::Region
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
              Resource: !GetAtt UserPoolV2.Arn
      Events:
        ListUsers:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /admin/users/list
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        ChangeUserState:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /admin/users/{username}/state
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  # Post-confirmation Lambda for user registration workflow
  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-post-confirmation'
      CodeUri: lambda-functions/auth/
      Handler: post-confirmation.handler
      Runtime: nodejs22.x
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref GameTable
          USER_POOL_ID: !Ref UserPoolV2
          REGION: !Ref AWS::Region
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminUpdateUserAttributes
              Resource: !GetAtt UserPoolV2.Arn
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  # Lambda permission for the post-confirmation trigger. The trigger itself
  # (UserPoolV2 LambdaConfig -> PostConfirmationFunction) cannot live in the
  # template without a circular dependency, so it is attached post-deploy by
  # scripts/setup-post-confirmation.sh; this permission is safe to keep here.
  PostConfirmationLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PostConfirmationFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPoolV2.Arn

Outputs:
  # API Endpoints
  RestApiUrl:
    Description: REST API Gateway endpoint URL
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${StackName}-rest-api-url'

  WebSocketUrl:
    Description: WebSocket API Gateway endpoint URL
    Value: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${StackName}-websocket-url'

  # Frontend
  FrontendBucketName:
    Description: Frontend S3 bucket name
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub '${StackName}-frontend-bucket'

  FrontendUrl:
    Description: Frontend URL
    Value: !If
      - HasDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'http://${FrontendBucket}.s3-website-${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${StackName}-frontend-url'

  # Database
  GameTableName:
    Description: DynamoDB table name
    Value: !Ref GameTable
    Export:
      Name: !Sub '${StackName}-table-name'

  # Storage
  AIPromptsBucketName:
    Description: AI Prompts S3 bucket name
    Value: !Ref AIPromptsBucket
    Export:
      Name: !Sub '${StackName}-ai-prompts-bucket'

  # Environment Info
  Environment:
    Description: Environment name
    Value: !Ref Environment
    Export:
      Name: !Sub '${StackName}-environment'

  StackName:
    Description: CloudFormation stack name
    Value: !Ref AWS::StackName
    Export:
      Name: !Sub '${StackName}-stack-name'

  # Cognito Outputs
  UserPoolId:
    Description: Cognito User Pool ID (copy to src/.env as REACT_APP_USER_POOL_ID)
    Value: !Ref UserPoolV2
    Export:
      Name: !Sub '${StackName}-user-pool-id'

  UserPoolClientId:
    Description: Cognito User Pool Client ID (copy to src/.env as REACT_APP_CLIENT_ID)
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub '${StackName}-user-pool-client-id'

  UserPoolDomain:
    Description: Cognito User Pool Domain
    Value: !Sub '${StackName}-auth-v2'
    Export:
      Name: !Sub '${StackName}-user-pool-domain'

  # IdentityPoolId:
  #   Description: Cognito Identity Pool ID
  #   Value: !Ref IdentityPool
  #   Export:
  #     Name: !Sub '${StackName}-identity-pool-id'
