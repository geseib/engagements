        StackName: !Ref StackName


  GetResultsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-get-results'
      CodeUri: lambda-functions/game/
      Handler: get-results.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        # get-results moves the game into RESULTS# and now announces it over the
        # WebSocket, the way next-question and start-vote already announce their
        # transitions. Without this the announcement is a silent AccessDenied and
        # the room stays on the voting screen while the database says RESULTS.
        # (WEBSOCKET_API_ENDPOINT comes from Globals, so only IAM was missing.)
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Events:
        # THE READ. Public, and it has to be: PlayerPage calls this with a
        # plain fetch the moment the room enters RESULTS, so an authorizer
        # here would break every player client. The handler refuses to perform
        # the transition on this route — it will only report a round that is
        # already resolved (get-results.js: isHostTransitionRoute).
        GetResultsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/get-results
            Method: POST
        # THE TRANSITION. Host only.
        #
        # Same handler, second route — HTTP API authorizers are per-route and
        # not optional, so "public to read, authenticated to write" cannot be
        # expressed on one route. Closing a round writes RESULTS#nnn, flips
        # AuthorsRevealed (ending the room's anonymity), awards scores and
        # announces the move to everyone. A participant knows the four-digit
        # game id, so on a public route that was a button any phone in the room
        # could press mid-vote. Same reasoning as /reveal-authors above.
        CloseRoundEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/close-round
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

