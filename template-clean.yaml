            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  AdminPromoteSetVersionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-admin-promote-set-version'
      CodeUri: lambda-functions/admin/
      Handler: promote-set-version.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        AdminPromoteSetVersionEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /admin/question-sets/{setId}/versions/{version}/promote
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  AdminDeleteSetVersionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-admin-delete-set-version'
      CodeUri: lambda-functions/admin/
      Handler: delete-set-version.handler
      Runtime: nodejs22.x
      # A version is one partition (up to ~160 question rows plus categories),
      # deleted in retried batches of 25 — the same budget the whole-set delete
      # gets, for a strictly smaller job.
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        AdminDeleteSetVersionEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
