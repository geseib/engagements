AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Clean Engagements Platform with consistent resource naming
  Environment: {Environment}
  Domain: {DomainName}

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
    Description: Environment name (dev, test, prod)

  StackName:
    Type: String
    Description: Stack name for resource naming (e.g., engagedev, engagetest, engageprod)

  DomainName:
    Type: String
    Description: Primary domain name for this environment
    Default: ""

  SecondaryDomainName:
    Type: String
    Description: Secondary domain name (for prod dual domains)
    Default: ""

  HostedZoneId:
    Type: String
    Description: Route53 hosted zone ID
    Default: "ZB9TUA073B5SH"

  GitHubToken:
    Type: String
    Description: GitHub Personal Access Token for creating issues
    NoEcho: true
    Default: ""

  GitHubRepo:
    Type: String
    Description: GitHub repository in format owner/repo-name
    Default: "geseib/engagements"

  # Google OAuth credentials are passed as values (not SSM references)
  # because CloudFormation does not support ssm-secure dynamic references
  # in Cognito UserPoolIdentityProvider properties. The deploy script
  # (scripts/deploy-clean.sh) fetches them from SSM (/engdev/google/*) and
  # passes them through; when empty, Google OAuth resources are skipped.
  GoogleClientId:
    Type: String
    Description: Google OAuth Client ID (empty disables Google sign-in resources)
    Default: ""

  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: Google OAuth Client Secret (empty disables Google sign-in resources)
    Default: ""

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasSecondaryDomain: !Not [!Equals [!Ref SecondaryDomainName, ""]]
  IsProd: !Equals [!Ref Environment, "prod"]
  # True when the deploy passes Google credentials, fetched from
  # /<stack>/google/* SSM parameters by all three buildspecs.
  #
  # ⚠️ WHEN THIS IS FALSE, GOOGLE SIGN-IN IS REMOVED. Not "left alone" —
  # REMOVED. :2520 writes `SupportedIdentityProviders: [COGNITO]` on every
  # deploy, so a provider configured by hand in the Cognito console survives
  # only until the next deploy of that tier.
  #
  # This comment used to say test and prod "stay on console-configured
  # providers", and that sentence was false in a way that cost a production
  # outage on 2026-08-15: buildspec-prod.yml passed a hardcoded override list
  # with no Google parameters, the secret fell to its "" default, and the first
  # prod deploy in 197 commits stripped Google from the app client. Cognito
  # answers such a sign-in with "An error was encountered. Login option is not
  # available. Please try another one."
  #
  # All three buildspecs now fetch the credentials and CONDITIONALLY APPEND
  # them, because passing GoogleClientSecret="" is an explicit override to
  # empty and is not the same as omitting the parameter.
  HasGoogleOAuth: !Not [!Equals [!Ref GoogleClientSecret, ""]]

Globals:
  Function:
    # Lambda runtime for all functions. Bumped nodejs18.x (EOL) -> nodejs22.x on 2026-08-04.
    # Single change point; smoke-test AI + WebSocket functions after any runtime change.
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref GameTable
        WEBSOCKET_API_ENDPOINT: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
        ENVIRONMENT: !Ref Environment
        # Account ID for constructing Bedrock inference-profile ARNs at runtime
        # (replaces hardcoded account IDs that used to live in Lambda source).
        ACCOUNT_ID: !Ref AWS::AccountId

Resources:

  ### DynamoDB Table with Simple Naming
  GameTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref StackName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # TTL stays ENABLED — GAME#/PLAYER#/CONNECTION# session records rely on it
      # (90 days creation, 7 days active) and disabling it would retain game data
      # forever.
      #
      # It is a per-ITEM opt-in: only records that carry a `ttl` attribute expire.
      # AI prompts and personas (PK=AIPROMPTS) are CONFIGURATION and must never
      # be stamped with one. Every prompt writer used to set now+365d, so prompts
      # authored in Aug 2025 began silently disappearing in Aug 2026. Those
      # stamps are gone from create-ai-prompt.js, update-ai-prompt.js and
      # migrate-ai-prompts.js; update-ai-prompt.js additionally REMOVEs a stale
      # `ttl` on every save. Do not reintroduce one on an AIPROMPT#/PERSONA# item.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: StackName
          Value: !Ref StackName

  ### WebSocket API with Simple Naming
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${StackName}-api-ws'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ### WebSocket Deployment
  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - ConnectRoute
      - DisconnectRoute
      - MessageRoute
    Properties:
      ApiId: !Ref WebSocketApi

  ### WebSocket Stage
  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: !Ref Environment
      Description: !Sub '${Environment} stage for WebSocket API'
      DeploymentId: !Ref WebSocketDeployment
      ApiId: !Ref WebSocketApi
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ### Lambda Functions with Simple Naming

  ## WebSocket Functions
  ConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-connect'
      CodeUri: lambda-functions/websocket/
      Handler: connect.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  DisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-disconnect'
      CodeUri: lambda-functions/websocket/
      Handler: disconnect.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  MessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-message'
      CodeUri: lambda-functions/websocket/
      Handler: message.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ## Game Management Functions
  CreateGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-create-game'
      CodeUri: lambda-functions/websocket/
      Handler: create-game.handler
      Events:
        CreateGame:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  StartQuestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-start-question'
      CodeUri: lambda-functions/websocket/
      Handler: start-question.handler
      Events:
        StartQuestion:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/start-question
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  StartVoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-start-vote'
      CodeUri: lambda-functions/websocket/
      Handler: start-vote.handler
      Events:
        StartVote:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/start-vote
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  RevealAuthorsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-reveal-authors'
      CodeUri: lambda-functions/game/
      Handler: reveal-authors.handler
      Events:
        RevealAuthors:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/reveal-authors
            Method: post
            # HOST ONLY. This ends the anonymity of a round for the whole room
            # and answers with every author's name. A participant knows the
            # four-digit game id, so without this any player could have flipped
            # it from a phone. Players never call it — the reveal they see
            # arrives over the WebSocket.
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  StageBeatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-stage-beat'
      CodeUri: lambda-functions/game/
      Handler: stage-beat.handler
      Runtime: nodejs22.x
      Timeout: 30
      Events:
        StageBeatEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/stage-beat
            Method: post
            # HOST ONLY, exactly like /close-round and /reveal-authors above.
            # This moves what the whole room is looking at — from the round's
            # tally to the AI's read-back and back — and a participant knows the
            # four-digit game id, so on a public route it would be a button any
            # phone in the room could press mid-discussion.
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        # The beat is only useful if the OTHER surface hears it: the projector
        # when the host taps the phone, the phone when the host taps the
        # projector. Without this the broadcast is a silent AccessDenied and the
        # two devices disagree about what the room is reading.
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  UpNextFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-up-next'
      CodeUri: lambda-functions/game/
      Handler: up-next.handler
      Runtime: nodejs22.x
      Timeout: 30
      Events:
        UpNextEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/up-next
            Method: get
            # HOST ONLY, and this one is not a judgement call. The response
            # ENUMERATES QUESTIONS THAT HAVE NOT BEEN ASKED YET. On a trivia
            # round, knowing the next three questions is most of the way to
            # knowing the next three answers, and a participant already holds
            # the four-digit game id.
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        # Read-only by design — see the handler's header. Peeking at the running
        # order must not spend a question, or checking what is coming would
        # change what is coming.
        - DynamoDBReadPolicy:
            TableName: !Ref GameTable
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  StageFocusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-stage-focus'
      CodeUri: lambda-functions/game/
      Handler: stage-focus.handler
      Runtime: nodejs22.x
      Timeout: 30
      Events:
        StageFocusEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/stage-focus
            Method: post
            # HOST ONLY, exactly like /stage-beat above and for a sharper
            # version of its reason. This does not merely move the room between
            # two beats of one round — it puts ONE NAMED PERSON'S RESPONSE
            # full-screen on a wall. On a public route that is a button any
            # phone holding the four-digit game id could press, about somebody
            # else's answer.
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        # Crud, NOT Write: the 410-Gone reaping in this handler's broadcast
        # deletes dead CONNECTION# rows, and SAM's DynamoDBWritePolicy grants
        # Put/Update/BatchWrite but NOT DeleteItem. With Write only, every stale
        # connection survives forever and is retried on every future broadcast —
        # and the failure is an AccessDenied inside a catch that never throws,
        # so nothing surfaces anywhere.
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  QuestionQueueFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-question-queue'
      CodeUri: lambda-functions/game/
      Handler: question-queue.handler
      Runtime: nodejs22.x
      Timeout: 30
      Events:
        # Two events, one function, because they are two halves of one fact:
        # the panel reads the running order and then edits it, and a split
        # across two handlers would be two copies of the projection shape.
        ReadQueue:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/queue
            Method: get
            # HOST ONLY, exactly like /stage-beat and /reveal-authors above.
            # The queue names the questions the room has NOT been asked yet, so
            # on a public route it is a spoiler served to any phone holding the
            # four-digit game id — and players have that id by definition.
            Auth:
              Authorizer: CognitoAuthorizer
        ChangeQueue:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/queue
            Method: post
            # HOST ONLY, and here it decides what the whole room is asked next.
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        # CRUD, NOT Read+Write, and the difference is not cosmetic: SAM's
        # DynamoDBWritePolicy grants PutItem/UpdateItem/BatchWrite but NOT
        # DeleteItem, and this handler deletes — the 410-Gone connection reaping
        # in its broadcast drops dead CONNECTION# rows inline, the same cleanup
        # stage-beat.js and next-question.js do. With Write only, every stale
        # connection survives forever and is retried on every future broadcast,
        # and the failure is an AccessDenied inside a catch that deliberately
        # never throws, so nothing surfaces anywhere.
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        # The OTHER host surface has to hear about the change. Queue on the
        # phone, watch the stage follow; reorder on the stage, watch the phone
        # follow. Without this the broadcast is a silent AccessDenied and the
        # two devices disagree about what is queued.
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  QuestionExclusionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-question-exclusions'
      CodeUri: lambda-functions/game/
      Handler: question-exclusions.handler
      Runtime: nodejs22.x
      Timeout: 30
      Events:
        # The queue's sibling: the questions the host has DISABLED for this
        # session ("move up/move down/disable/move back out" — the third verb).
        # Same one-function read+write shape as /queue, same reason.
        ReadExclusions:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/exclusions
            Method: get
            # HOST ONLY, exactly like /queue: the list names unasked questions,
            # which is a spoiler on any public route.
            Auth:
              Authorizer: CognitoAuthorizer
        ChangeExclusions:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/exclusions
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        # Read the row, write the row. No DeleteItem, no broadcast: unlike the
        # queue this endpoint reaps no connections and tells no other surface —
        # the panel that changed it reloads itself, and the drain reads the row
        # fresh every round.
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ### HTTP API with Simple Naming (like original GameApi)
  RestApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["OPTIONS","GET","POST","PUT","DELETE"]
        AllowHeaders: ["Content-Type", "Authorization"]
        ExposeHeaders: ["Content-Length", "X-Request-Id"]
      # Lambda authorizer (UserPoolV2 JWTs). No DefaultAuthorizer on purpose:
      # player and host game routes stay public; admin routes opt in per-event
      # with "Auth: Authorizer: CognitoAuthorizer". Exception: the
      # /admin/create-github-issue feedback route stays public because the
      # player page's IssueFab uses it anonymously.
      Auth:
        Authorizers:
          CognitoAuthorizer:
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            Identity:
              Headers:
                - Authorization
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ## Admin Functions
  AdminGetQuestionSetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-admin-get-question-sets'
      CodeUri: lambda-functions/admin/
      Handler: get-question-sets.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        AdminGetQuestionSetsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /admin/question-sets
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  AdminGetQuestionSetQuestionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-admin-get-question-set-questions'
      CodeUri: lambda-functions/admin/
      Handler: get-question-set-questions.handler
      Runtime: nodejs22.x
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref GameTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        AdminGetQuestionSetQuestionsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /question-sets/{setId}/questions
            Method: GET
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ## Main Question Sets Function (for game creation)
  GetQuestionSetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-get-question-sets'
      CodeUri: lambda-functions/game/
      Handler: get-question-sets.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        GetQuestionSetsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /question-sets
            Method: GET
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ## Game Flow Functions
  GetGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-get-game'
      CodeUri: lambda-functions/game/
      Handler: get-game.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        GetGameEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}
            Method: GET
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  StartGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-start-game'
      CodeUri: lambda-functions/game/
      Handler: start-game.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        StartGameEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/start
            Method: POST
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  # Edit a session BEFORE it starts — narrow UpdateCommands on the whitelisted
  # METADATA attributes, mirrored onto the GAMES index row for Title/Visibility.
  # Refuses any session whose STATE is not CREATED (start-game's predicate).
  # Carries the Cognito authorizer: authorizer.js requires hosts/admins for a
  # PUT on a games path, and this route must not repeat CreateGameFunction's
  # missing-Auth omission.
  UpdateGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-update-game'
      CodeUri: lambda-functions/game/
      Handler: update-game.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        UpdateGameEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  NextQuestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-next-question'
      CodeUri: lambda-functions/game/
      Handler: next-question.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Events:
        NextQuestionEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/next-question
            Method: POST
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ToggleCategoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-toggle-category'
      CodeUri: lambda-functions/game/
      Handler: toggle-category.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        ToggleCategoryEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/toggle-category
            Method: POST
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  # Mid-game voice switch. Deliberately a narrow UpdateCommand on one attribute
  # — see the header of update-game-persona.js for why reviving
  # websocket/save-game-context.js would have destroyed the METADATA item.
  UpdateGamePersonaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-update-game-persona'
      CodeUri: lambda-functions/game/
      Handler: update-game-persona.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        UpdateGamePersonaEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/persona
            Method: PUT
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  GetQuestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-get-question'
      CodeUri: lambda-functions/game/
      Handler: get-question.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        GetQuestionEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /games/{gameId}/question
            Method: GET
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName


  GetAnswersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-get-answers'
      CodeUri: lambda-functions/game/
      Handler: get-answers.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
