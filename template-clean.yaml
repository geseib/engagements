AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Clean Engagements Platform with consistent resource naming
  Environment: {Environment}
  Domain: {DomainName}

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
    Description: Environment name (dev, test, prod)

  StackName:
    Type: String
    Description: Stack name for resource naming (e.g., engagedev, engagetest, engageprod)

  DomainName:
    Type: String
    Description: Primary domain name for this environment
    Default: ""

  SecondaryDomainName:
    Type: String
    Description: Secondary domain name (for prod dual domains)
    Default: ""

  HostedZoneId:
    Type: String
    Description: Route53 hosted zone ID
    Default: "ZB9TUA073B5SH"

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasSecondaryDomain: !Not [!Equals [!Ref SecondaryDomainName, ""]]
  IsProd: !Equals [!Ref Environment, "prod"]

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref GameTable
        WEBSOCKET_API_ENDPOINT: !Sub 'https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
        ENVIRONMENT: !Ref Environment

Resources:

  ### DynamoDB Table with Simple Naming
  GameTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref StackName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: StackName
          Value: !Ref StackName

  ### WebSocket API with Simple Naming
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${StackName}-api-ws'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ### WebSocket Deployment
  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - ConnectRoute
      - DisconnectRoute
      - MessageRoute
    Properties:
      ApiId: !Ref WebSocketApi

  ### WebSocket Stage
  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: !Ref Environment
      Description: !Sub '${Environment} stage for WebSocket API'
      DeploymentId: !Ref WebSocketDeployment
      ApiId: !Ref WebSocketApi
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ### Lambda Functions with Simple Naming

  ## WebSocket Functions
  ConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-connect'
      CodeUri: lambda-functions/websocket/
      Handler: connect.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  DisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-disconnect'
      CodeUri: lambda-functions/websocket/
      Handler: disconnect.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  MessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-message'
      CodeUri: lambda-functions/websocket/
      Handler: message.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ## Game Management Functions
  CreateGameFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-create-game'
      CodeUri: lambda-functions/websocket/
      Handler: create-game.handler
      Events:
        CreateGame:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /games
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  StartQuestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-start-question'
      CodeUri: lambda-functions/websocket/
      Handler: start-question.handler
      Events:
        StartQuestion:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /games/{gameId}/start-question
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  StartVoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-start-vote'
      CodeUri: lambda-functions/websocket/
      Handler: start-vote.handler
      Events:
        StartVote:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /games/{gameId}/start-vote
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*'
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ### REST API with Simple Naming
  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${StackName}-api-rest'
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ## Admin Functions
  AdminGetQuestionSetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-admin-get-question-sets'
      Runtime: nodejs18.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Environment:
        Variables:
          TABLE_NAME: !Ref GameTable
      InlineCode: |-
        const { DynamoDBClient } = require('@aws-sdk/client-dynamodb');
        const { DynamoDBDocumentClient, QueryCommand } = require('@aws-sdk/lib-dynamodb');

        const client = new DynamoDBClient({});
        const db = DynamoDBDocumentClient.from(client);

        exports.handler = async (event) => {
          try {
            console.log('Getting question sets...');

            // Get all question set metadata (both active and inactive)
            const res = await db.send(new QueryCommand({
              TableName: process.env.TABLE_NAME,
              KeyConditionExpression: 'PK = :pk',
              ExpressionAttributeValues: { ':pk': 'SETS' }
            }));

            const questionSets = res.Items.map(item => ({
              id: item.SK.replace('SET#', ''),
              name: item.name,
              description: item.description,
              customInstruction: item.customInstruction,
              aiContextInstruction: item.aiContextInstruction,
              engagementType: item.engagementType,
              questionCount: item.questionCount || 0,
              active: item.active !== false,
              createdAt: item.createdAt,
              updatedAt: item.updatedAt
            }));

            return {
              statusCode: 200,
              body: JSON.stringify({ questionSets }),
              headers: { 'Access-Control-Allow-Origin': '*' }
            };

          } catch (error) {
            console.error('Get question sets error:', error);
            return {
              statusCode: 500,
              body: JSON.stringify({ error: `Failed to get question sets: ${error.message}` }),
              headers: { 'Access-Control-Allow-Origin': '*' }
            };
          }
        };
      Events:
        AdminGetQuestionSetsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /admin/question-sets
            Method: GET
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  AdminAIGenerateQuestionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-admin-ai-generate-questions'
      Runtime: nodejs18.x
      Timeout: 900
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - 'arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0'
                - 'arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0'
                - 'arn:aws:bedrock:us-west-2::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0'
      Environment:
        Variables:
          TABLE_NAME: !Ref GameTable
      InlineCode: |-
        const { DynamoDBClient } = require('@aws-sdk/client-dynamodb');
        const { DynamoDBDocumentClient, PutCommand } = require('@aws-sdk/lib-dynamodb');
        const { BedrockRuntimeClient, InvokeModelCommand } = require('@aws-sdk/client-bedrock-runtime');

        const dbClient = new DynamoDBClient({});
        const db = DynamoDBDocumentClient.from(dbClient);
        const bedrock = new BedrockRuntimeClient({ region: 'us-east-1' });

        exports.handler = async (event) => {
          try {
            const { topic, questionCount = 10, customInstructions = '', aiContextInstructions = '' } = JSON.parse(event.body);

            if (!topic || !topic.trim()) {
              return {
                statusCode: 400,
                body: JSON.stringify({ error: 'Topic is required' }),
                headers: { 'Access-Control-Allow-Origin': '*' }
              };
            }

            console.log(`Generating ${questionCount} questions for topic: ${topic}`);

            const prompt = `Generate ${questionCount} engaging call-and-answer questions about "${topic}".

${customInstructions ? `Additional Instructions: ${customInstructions}` : ''}
${aiContextInstructions ? `Context: ${aiContextInstructions}` : ''}

Format as CSV with columns: question,answer
- Questions should be clear and engaging
- Answers should be concise but complete
- Include the CSV header row
- Escape any commas in content with quotes
- No extra formatting or explanations

Example:
question,answer
"What is the capital of France?","Paris"`;

            const response = await bedrock.send(new InvokeModelCommand({
              modelId: 'anthropic.claude-3-sonnet-20240229-v1:0',
              body: JSON.stringify({
                anthropic_version: 'bedrock-2023-05-31',
                max_tokens: 4000,
                messages: [{ role: 'user', content: prompt }]
              }),
              contentType: 'application/json'
            }));

            const responseBody = JSON.parse(new TextDecoder().decode(response.body));
            const csvContent = responseBody.content[0].text;

            return {
              statusCode: 200,
              body: JSON.stringify({
                csvContent,
                topic,
                questionCount: parseInt(questionCount)
              }),
              headers: { 'Access-Control-Allow-Origin': '*' }
            };

          } catch (error) {
            console.error('AI generation error:', error);
            return {
              statusCode: 500,
              body: JSON.stringify({ error: `AI generation failed: ${error.message}` }),
              headers: { 'Access-Control-Allow-Origin': '*' }
            };
          }
        };
      Events:
        AdminAIGenerateQuestionsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /admin/ai-generate-questions
            Method: POST
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ### S3 Buckets with Simple Naming
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${StackName}-web'
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: StackName
          Value: !Ref StackName

  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${StackName}-reports'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldReports
            Status: Enabled
            ExpirationInDays: 90
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: StackName
          Value: !Ref StackName

  ### S3 Bucket Policy
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${FrontendBucket.Arn}/*'

  ### CloudFront Distribution (if domain is provided)
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasDomain
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
        Enabled: true
        DefaultRootObject: index.html
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref SSLCertificate
          SslSupportMethod: sni-only
        PriceClass: PriceClass_100
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: StackName
          Value: !Ref StackName

  ### SSL Certificate (if domain is provided)
  SSLCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: StackName
          Value: !Ref StackName

  ### Route53 Record (if domain is provided)
  DNSRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID

  ### WebSocket Routes
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      OperationName: ConnectRoute
      Target: !Join
        - '/'
        - - 'integrations'
          - !Ref ConnectInteg

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      OperationName: DisconnectRoute
      Target: !Join
        - '/'
        - - 'integrations'
          - !Ref DisconnectInteg

  MessageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      OperationName: MessageRoute
      Target: !Join
        - '/'
        - - 'integrations'
          - !Ref MessageInteg

  ### WebSocket Integrations
  ConnectInteg:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      Description: Connect Integration
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConnectFunction.Arn}/invocations'

  DisconnectInteg:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      Description: Disconnect Integration
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DisconnectFunction.Arn}/invocations'

  MessageInteg:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      Description: Message Integration
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MessageFunction.Arn}/invocations'

  ### Lambda Permissions
  ConnectPermission:
    Type: AWS::Lambda::Permission
    DependsOn:
      - WebSocketApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ConnectFunction
      Principal: apigateway.amazonaws.com

  DisconnectPermission:
    Type: AWS::Lambda::Permission
    DependsOn:
      - WebSocketApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DisconnectFunction
      Principal: apigateway.amazonaws.com

  MessagePermission:
    Type: AWS::Lambda::Permission
    DependsOn:
      - WebSocketApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MessageFunction
      Principal: apigateway.amazonaws.com

Outputs:
  # API Endpoints
  RestApiUrl:
    Description: REST API Gateway endpoint URL
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${StackName}-rest-api-url'

  WebSocketUrl:
    Description: WebSocket API Gateway endpoint URL
    Value: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${StackName}-websocket-url'

  # Frontend
  FrontendBucketName:
    Description: Frontend S3 bucket name
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub '${StackName}-frontend-bucket'

  FrontendUrl:
    Description: Frontend URL
    Value: !If
      - HasDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'http://${FrontendBucket}.s3-website-${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${StackName}-frontend-url'

  # Database
  GameTableName:
    Description: DynamoDB table name
    Value: !Ref GameTable
    Export:
      Name: !Sub '${StackName}-table-name'

  # Environment Info
  Environment:
    Description: Environment name
    Value: !Ref Environment
    Export:
      Name: !Sub '${StackName}-environment'

  StackName:
    Description: CloudFormation stack name
    Value: !Ref AWS::StackName
    Export:
      Name: !Sub '${StackName}-stack-name'
