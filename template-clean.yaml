  ## Export a question set as CSV/JSON.
  ##
  ## The lambda has existed for a long time but had NO route, so
  ## QuestionSetEditor.jsx's "Download CSV" has been calling a 404. The route is
  ## added here because a lossless download is half of the replace round trip:
  ## download the current version, edit it, upload it back as a new one.
  AdminDownloadQuestionSetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-admin-download-question-set'
      CodeUri: lambda-functions/admin/
      Handler: download-question-set.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
      Events:
        AdminDownloadQuestionSetEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /admin/download-question-set/{setId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ## Question-set MEDIA
  ##
  ## Two routes, one bucket. The browser uploads STRAIGHT TO S3 with a
  ## presigned PUT — a folder of artwork never passes through API Gateway,
  ## whose payload ceiling is 10 MB and whose per-request cost would be paid to
  ## move bytes nothing here looks at.
  ##
  ## Both are Cognito-authorised like every other /admin/* route, and both call
  ## requireSetManager on top of that: an admin may touch any set's media, a
  ## host only the sets they created. See lambda-functions/auth/authorizer.js —
  ## these two are on HOST_ADMIN_ROUTES for that reason.

  AdminMediaUploadUrlsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-admin-media-upload-urls'
      CodeUri: lambda-functions/admin/
      Handler: media-upload-urls.handler
      Runtime: nodejs22.x
      Timeout: 30
      Environment:
        Variables:
          MEDIA_BUCKET: !Ref MediaBucket
      Policies:
        # READ on the table, not Crud. This function reads one SETS row to
        # answer "does it exist and who owns it" and writes nothing anywhere.
        - DynamoDBReadPolicy:
            TableName: !Ref GameTable
        # THE WHOLE SECURITY ARGUMENT FOR THE PRESIGNED URL IS THIS STATEMENT.
        # A presigned URL grants the intersection of the signer's permissions
        # and the signed request, so a URL minted by this role can only ever
        # write an object under sets/ in the media bucket — not the website
        # bucket, not the reports bucket, not a key outside the prefix, however
        # the handler is called and whatever it is asked to sign.
        - Statement:
            - Effect: Allow
              Action: ['s3:PutObject']
              Resource: !Sub '${MediaBucket.Arn}/sets/*'
      Events:
        AdminMediaUploadUrlsEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /admin/question-sets/{setId}/media/uploads
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  AdminMediaStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-admin-media-status'
      CodeUri: lambda-functions/admin/
      Handler: media-status.handler
      Runtime: nodejs22.x
      Timeout: 30
      Environment:
        Variables:
          MEDIA_BUCKET: !Ref MediaBucket
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GameTable
        # LIST ONLY, AND ONLY UNDER sets/. Verification never reads an object's
        # bytes — "is the image in the right place", not "is it a valid image"
        # — so s3:GetObject is not granted and could not be used if the handler
        # were changed to try.
        - Statement:
            - Effect: Allow
              Action: ['s3:ListBucket']
              Resource: !GetAtt MediaBucket.Arn
              Condition:
                StringLike:
                  's3:prefix': ['sets/*']
      Events:
        AdminMediaStatusEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref RestApi
            Path: /admin/question-sets/{setId}/media
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Tags:
        Environment: !Ref Environment
        StackName: !Ref StackName

  ## Question-set VERSIONING
  ##
  ## A set's questions live at PK=SET#<id>#v<n>; the SETS metadata row carries
  ## activeVersion and versions[]. These three routes list, promote and delete
  ## versions. See docs/superpowers/specs/2026-08-08-question-set-versioning-design.md.
  ##
  ## Cognito-authorised, mirroring every other /admin/* route.

  AdminGetSetVersionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${StackName}-admin-get-set-versions'
      CodeUri: lambda-functions/admin/
      Handler: get-set-versions.handler
      Runtime: nodejs22.x
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GameTable
