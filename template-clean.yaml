  ### QUESTION-SET MEDIA — AND WHY IT IS NOT THE WEBSITE BUCKET
  ###
  ### Every buildspec publishes the frontend with
  ###
  ###     aws s3 sync dist/ s3://$BUCKET_NAME/ --delete
  ###
  ### (buildspec-dev.yml:104, buildspec-test.yml:110, buildspec-prod.yml:116).
  ### `--delete` removes every object in the destination that is not in dist/.
  ### Uploaded question artwork under `sets/<setId>/` is never in dist/ — the
  ### committed repo assets under /assets/art/ survive precisely because they
  ### ARE — so images kept in FrontendBucket would live until the next deploy
  ### of that tier and then disappear, mid-season, with no error anywhere.
  ###
  ### `--exclude "sets/*"` on the sync would also work (the filter is applied
  ### to the destination listing, so excluded keys are not deletion
  ### candidates). It was rejected: it is an unremarkable flag in three files
  ### that a copy-paste loses, it does nothing for a hand-run sync, and its
  ### absence is invisible until a room is looking at a broken image. A
  ### SEPARATE BUCKET cannot be reached by a sync aimed at the website bucket
  ### whatever flags that sync carries.
  ###
  ### The images stay SAME-ORIGIN anyway: the CloudFront distribution below
  ### serves `sets/*` from this bucket under the site's own hostname. That is
  ### what lets the stored value keep going straight into <img src> —
  ### PlayerPage.jsx:1961,2196 and GameHostPage.jsx:4571,4614,5213 — with no
  ### resolver and no change to any of those call sites.
  ###
  ### It is deliberately NOT conditional on HasDomain: the presign and
  ### verification Lambdas need a bucket in every stack, domain or not.
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${StackName}-media'
      # Public read, exactly like FrontendBucket, because the same CloudFront
      # origin configuration is used (S3OriginConfig with an empty
      # OriginAccessIdentity) and because these images are shown to players who
      # never sign in. WRITE is not public: it needs a presigned PUT, which
      # only the admin Lambda's role can mint.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          # The browser PUTs straight to S3, so the bucket must answer the
          # preflight. This grants no access — the presigned URL does that.
          - AllowedMethods: [GET, HEAD, PUT]
            AllowedOrigins: !If
              - HasDomain
              - [!Sub 'https://${DomainName}']
              - ['*']
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          # A failed multipart upload otherwise bills forever and is invisible
          # in the console's object list.
          - Id: AbandonAbortedUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: StackName
          Value: !Ref StackName

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${MediaBucket.Arn}/*'

  AIPromptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${StackName}-ai-prompts'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: StackName
          Value: !Ref StackName

  ### S3 Bucket Policy
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${FrontendBucket.Arn}/*'

  ### CloudFront Distribution (if domain is provided)
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasDomain
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
          # Question-set artwork. A SECOND ORIGIN rather than a second hostname,
          # so `sets/<setId>/x.jpg` stored on a question stays a same-origin
          # relative URL and <img src={question.image}> keeps working unchanged.
          - Id: MediaOrigin
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
        CacheBehaviors:
          # THE PATH THAT KEEPS THE IMAGES OUT OF THE DEPLOY'S REACH. Everything
          # under sets/ comes from MediaBucket, which no `aws s3 sync dist/
          # s3://${StackName}-web --delete` can touch. Removing this behaviour
          # does not break the site quietly — it 404s every uploaded image at
          # once — and __tests__/setMediaStorage.test.js fails if it is removed.
          - PathPattern: 'sets/*'
            TargetOriginId: MediaOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            # CachingOptimized, unlike the default behaviour's CachingDisabled:
            # the app bundle changes on every deploy and must not be cached, an
            # image at a given key does not change at all. A replace writes the
            # same key, so a replace is followed by the deploy-time
            # invalidation or by a hard refresh — stated in the media panel.
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        Enabled: true
        DefaultRootObject: index.html
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref SSLCertificate
          SslSupportMethod: sni-only
        PriceClass: PriceClass_100
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: StackName
          Value: !Ref StackName



  ### SSL Certificate (if domain is provided)
  SSLCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: StackName
          Value: !Ref StackName

  ### Route53 Record (if domain is provided)
  DNSRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID

