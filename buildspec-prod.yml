version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing SAM CLI..."
      - pip3 install aws-sam-cli
      - echo "Installing Node.js dependencies..."
      - cd src && npm ci && cd ..

  pre_build:
    commands:
      - echo "Pre-build phase for $ENVIRONMENT environment"
      - 'echo "Domain: $DOMAIN_NAME"'
      - echo "Retrieving GitHub token from Secrets Manager..."
      - export GITHUB_TOKEN=$(aws secretsmanager get-secret-value --secret-id engage/prod/github-token --query SecretString --output text | jq -r .GITHUB_TOKEN)
      - '[ -n "$GITHUB_TOKEN" ] && echo "Successfully retrieved GitHub token" || (echo "ERROR: Failed to retrieve GitHub token" && exit 1)'
      - export GITHUB_REPO="${GITHUB_REPO:-geseib/engagements}"

  build:
    commands:
      - echo "Building and deploying backend..."
      - echo "Building SAM application..."
      - sam build -t template-clean.yaml
      - echo "Deploying to AWS..."
      - sam deploy --template-file .aws-sam/build/template.yaml --stack-name $STACK_NAME --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM --parameter-overrides "Environment=$ENVIRONMENT" "StackName=$STACK_NAME" "DomainName=$DOMAIN_NAME" "HostedZoneId=$HOSTED_ZONE_ID" "GitHubToken=$GITHUB_TOKEN" "GitHubRepo=$GITHUB_REPO" --resolve-s3 --no-confirm-changeset --no-fail-on-empty-changeset

      - echo "Building frontend..."
      - cd src

      - echo "Getting API endpoints from CloudFormation..."
      - API_URL=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`RestApiUrl`].OutputValue' --output text)
      - WS_URL=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`WebSocketUrl`].OutputValue' --output text)
      - USER_POOL_ID=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`UserPoolId`].OutputValue' --output text)
      - USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`UserPoolClientId`].OutputValue' --output text)
      - COGNITO_DOMAIN=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`UserPoolDomain`].OutputValue' --output text)

      - echo "Creating config.js with API endpoints and Cognito configuration..."
      - echo "Values retrieved from CloudFormation:"
      - echo "  API_URL=$API_URL"
      - echo "  WS_URL=$WS_URL"
      - echo "  USER_POOL_ID=$USER_POOL_ID"
      - echo "  USER_POOL_CLIENT_ID=$USER_POOL_CLIENT_ID"
      - echo "  COGNITO_DOMAIN=$COGNITO_DOMAIN"
      - printf 'window.API_BASE = "%s/";\n' "$API_URL" > public/config.js
      - printf 'window.WS_URL = "%s";\n' "$WS_URL" >> public/config.js
      - printf 'window.USER_POOL_ID = "%s";\n' "$USER_POOL_ID" >> public/config.js
      - printf 'window.USER_POOL_CLIENT_ID = "%s";\n' "$USER_POOL_CLIENT_ID" >> public/config.js
      - printf 'window.COGNITO_DOMAIN = "%s";\n' "$COGNITO_DOMAIN" >> public/config.js
      - printf 'window.ENV = "production";\n' >> public/config.js
      - printf 'console.log("PRODUCTION Environment loaded");\n' >> public/config.js
      - echo "Generated config.js contents:"
      - cat public/config.js

      # ── THE GATE THAT DID NOT EXIST ──────────────────────────────────
      # This pipeline ran `npm ci` and `npm run build` and nothing else. No
      # lint, no tests. Three product-down bugs shipped through it in two days
      # — four calls to deleted setters, a hook depending on a later const, and
      # a useState below five early returns — every one a clean webpack build,
      # because babel transpiles without resolving identifiers or understanding
      # React.
      #
      # `lint` is what catches that class at all: react-hooks/rules-of-hooks
      # and no-undef, and nothing else, so it stays readable (see
      # src/.eslintrc.js for why the rule set is deliberately tiny).
      #
      # `test` runs 111 suites. Five of them had never run since the day they
      # were written, which is how the largest file in the product came to have
      # no runtime coverage at all.
      - echo "Linting..."
      - npm run lint
      - echo "Running frontend tests..."
      - npm test
      - echo "Building..."
      - npm run build

      - echo "Verifying config.js in dist folder..."
      - ls -la dist/config.js
      - echo "Contents of dist/config.js:"
      - cat dist/config.js
      - echo "Deploying frontend to S3..."
      - BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`FrontendBucketName`].OutputValue' --output text)
      - echo "Frontend bucket name is $BUCKET_NAME"
      - aws s3 sync dist/ s3://$BUCKET_NAME/ --delete

      - echo "Invalidating CloudFront cache..."
      - DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' --output text)
      - echo "CloudFront distribution ID is $DISTRIBUTION_ID"
      - 'if [ -n "$DISTRIBUTION_ID" ] && [ "$DISTRIBUTION_ID" != "None" ]; then aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"; else echo "Skipping CloudFront invalidation - distribution ID not found"; fi'

      - echo "Deployment complete!"

  post_build:
    commands:
      - echo "Deployment completed for $ENVIRONMENT environment"
      - 'echo "Website URL: https://$DOMAIN_NAME"'
