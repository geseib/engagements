<!DOCTYPE html>
<html>
<head>
    <title>OAuth Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; cursor: pointer; }
        .logs { margin-top: 20px; padding: 10px; background: #f0f0f0; white-space: pre-wrap; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>OAuth Test Page</h1>
    
    <button onclick="testGoogleSignIn()">Test Google Sign In</button>
    <button onclick="testGoogleSignUp()">Test Google Sign Up</button>
    <button onclick="checkUrlParams()">Check URL Parameters</button>
    
    <div id="logs" class="logs"></div>
    
    <script>
        const log = (msg, type = '') => {
            const logs = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = type;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logs.appendChild(entry);
            console.log(msg);
        };
        
        const testGoogleSignIn = () => {
            log('Testing Google Sign In...');
            const userPoolId = 'us-east-1_bKTK5F5Jm';
            const clientId = '5brt6hub6e2gmi7hmuuidfi3nc';
            const region = 'us-east-1';
            const cognitoDomain = `engdev-auth.auth.${region}.amazoncognito.com`;
            const redirectUri = encodeURIComponent(window.location.origin + '/test-oauth.html');
            
            const url = `https://${cognitoDomain}/oauth2/authorize?` +
                `identity_provider=Google&` +
                `redirect_uri=${redirectUri}&` +
                `response_type=CODE&` +
                `client_id=${clientId}&` +
                `scope=email+openid+profile`;
            
            log('Built URL: ' + url);
            log('Redirecting in 2 seconds...');
            
            setTimeout(() => {
                window.location.href = url;
            }, 2000);
        };
        
        const testGoogleSignUp = () => {
            log('Testing Google Sign Up (same URL as sign in)...');
            testGoogleSignIn();
        };
        
        const checkUrlParams = () => {
            log('Current URL: ' + window.location.href);
            const params = new URLSearchParams(window.location.search);
            
            if (params.has('code')) {
                log('✅ Authorization code received: ' + params.get('code').substring(0, 20) + '...', 'success');
            }
            
            if (params.has('error')) {
                log('❌ Error: ' + params.get('error'), 'error');
                if (params.has('error_description')) {
                    log('❌ Error Description: ' + params.get('error_description'), 'error');
                }
            }
            
            if (!params.has('code') && !params.has('error')) {
                log('No OAuth parameters found in URL');
            }
        };
        
        // Check on page load
        window.onload = () => {
            checkUrlParams();
        };
    </script>
</body>
</html>
