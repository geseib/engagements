<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- favicon.svg with a "D" badge, so a dev tab can be told from prod at a
       glance. tier-favicon.js swaps it in from window.ENV; prod keeps
       favicon.svg. The letter is drawn, not typeset: no font to fall back. -->
  <defs><clipPath id="tile"><rect width="32" height="32" rx="7"/></clipPath></defs>
  <g clip-path="url(#tile)">
    <rect width="32" height="32" fill="#0F1A2E"/>
    <g transform="translate(0.6 0.2) scale(0.62)">
      <path d="M2 27 L11 13 L16 20 L22 6 L30 27 Z" fill="#F6A94C"/>
    </g>
    <rect x="10" y="10" width="26" height="26" rx="7" fill="#0F1A2E"/>
    <rect x="12" y="12" width="24" height="24" rx="5.5" fill="#4FB286"/>
    <path d="M17.6 16.6 V27.4 H20.9 A5.4 5.4 0 0 0 20.9 16.6 Z" fill="none" stroke="#0F1A2E" stroke-width="3.2" stroke-linejoin="round"/>
  </g>
</svg>
