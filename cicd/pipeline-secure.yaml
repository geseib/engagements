AWSTemplateFormatVersion: '2010-09-09'
Description: 'Secure CI/CD Pipeline for Engagements Platform with Secrets Manager Integration'

Parameters:
  ProjectName:
    Type: String
    Default: engage
    Description: Project name for resource naming

  GitHubOwner:
    Type: String
    Default: georgeseib
    Description: GitHub repository owner

  GitHubRepo:
    Type: String
    Default: engage2
    Description: GitHub repository name

  # NO GitHub token parameter - will be retrieved from Secrets Manager

  # Domain Configuration
  TestDomain:
    Type: String
    Default: eng.test.seibtribe.us
    Description: Test environment domain

  ProdDomain:
    Type: String
    Default: eng.seibtribe.us
    Description: Production environment domain

  HostedZoneId:
    Type: String
    Default: ZB9TUA073B5SH
    Description: Route53 hosted zone ID for all environments

Resources:

  ### S3 Bucket for Pipeline Artifacts
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}cicd-artifacts-secure'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: CICD-Artifacts

  ### CodeBuild Service Role with Secrets Manager Access
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}cicd-codebuild-secure'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:aws:s3:::${ArtifactsBucket}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${ArtifactsBucket}'
              # Secrets Manager permissions
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:engage/test/*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:engage/prod/*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: '*'
              # CloudFormation permissions for deployment
              - Effect: Allow
                Action:
                  - cloudformation:*
                  - iam:*
                Resource: '*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ### CodePipeline Service Role
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}cicd-codepipeline-secure'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetBucketVersioning
                Resource:
                  - !Sub 'arn:aws:s3:::${ArtifactsBucket}/*'
                  - !Sub 'arn:aws:s3:::${ArtifactsBucket}'
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource:
                  - !GetAtt TestBuildProject.Arn
                  - !GetAtt ProdBuildProject.Arn
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref GitHubConnection
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ### GitHub Connection (v2 - more secure than webhooks)
  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: !Sub '${ProjectName}-github-connection'
      ProviderType: GitHub

  ### CodeBuild Projects
  ## Test Build Project
  TestBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}cicd-build-test-secure'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Value: test
          - Name: STACK_NAME
            Value: engtest
          - Name: DOMAIN_NAME
            Value: !Ref TestDomain
          - Name: HOSTED_ZONE_ID
            Value: !Ref HostedZoneId
          # GitHub repo can be configured but token comes from Secrets Manager
          - Name: GITHUB_REPO
            Value: !Sub '${GitHubOwner}/${GitHubRepo}'
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-secure.yml
      TimeoutInMinutes: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: test

  ## Prod Build Project
  ProdBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}cicd-build-prod-secure'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Value: prod
          - Name: STACK_NAME
            Value: engprod
          - Name: DOMAIN_NAME
            Value: !Ref ProdDomain
          - Name: HOSTED_ZONE_ID
            Value: !Ref HostedZoneId
          # GitHub repo can be configured but token comes from Secrets Manager
          - Name: GITHUB_REPO
            Value: !Sub '${GitHubOwner}/${GitHubRepo}'
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-secure.yml
      TimeoutInMinutes: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: prod

  ### CodePipeline Pipelines
  ## Test Pipeline (test branch)
  TestPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${ProjectName}cicd-pipeline-test-secure'
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsBucket
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: !Sub '${GitHubOwner}/${GitHubRepo}'
                BranchName: test
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build
          Actions:
            - Name: BuildAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref TestBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: TestOutput
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: test

  ## Prod Pipeline (prod branch)
  ProdPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${ProjectName}cicd-pipeline-prod-secure'
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsBucket
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: !Sub '${GitHubOwner}/${GitHubRepo}'
                BranchName: prod
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build
          Actions:
            - Name: BuildAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref ProdBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: ProdOutput
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: prod

Outputs:
  TestPipelineName:
    Description: Test pipeline name
    Value: !Ref TestPipeline
  ProdPipelineName:
    Description: Production pipeline name
    Value: !Ref ProdPipeline
  TestBuildProject:
    Description: Test build project name
    Value: !Ref TestBuildProject
  ProdBuildProject:
    Description: Production build project name
    Value: !Ref ProdBuildProject
  GitHubConnectionArn:
    Description: GitHub connection ARN (needs to be activated in console)
    Value: !Ref GitHubConnection
  SetupInstructions:
    Description: Instructions to complete setup
    Value: |
      IMPORTANT: Complete these steps to finish secure CI/CD setup:
      
      1. Store GitHub PAT in Secrets Manager:
         ./scripts/setup-secure-github-token.sh test
         ./scripts/setup-secure-github-token.sh prod
      
      2. Activate GitHub Connection:
         - Go to CodePipeline Console > Settings > Connections
         - Click on the pending connection
         - Click "Update pending connection"
         - Authorize with GitHub
      
      3. The pipelines will automatically trigger on push to test/prod branches
      4. GitHub tokens are securely retrieved from Secrets Manager during build