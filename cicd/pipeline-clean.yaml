AWSTemplateFormatVersion: '2010-09-09'
Description: 'Clean CI/CD Pipeline for Engagements Platform'

Parameters:
  ProjectName:
    Type: String
    Default: engagements
    Description: Project name for resource naming

  GitHubOwner:
    Type: String
    Default: geseib
    Description: GitHub repository owner

  GitHubRepo:
    Type: String
    Default: engagements
    Description: GitHub repository name

  GitHubToken:
    Type: String
    NoEcho: true
    Description: GitHub personal access token

  # Domain Configuration
  DevDomain:
    Type: String
    Default: dev.engagements.example.com
    Description: Development environment domain

  TestDomain:
    Type: String
    Default: test.engagements.example.com
    Description: Test environment domain

  ProdDomain:
    Type: String
    Default: engagements.example.com
    Description: Production environment domain

  HostedZoneId:
    Type: String
    Description: Route53 hosted zone ID for all environments

Resources:

  ### S3 Bucket for Pipeline Artifacts
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-cicd-bucket-artifacts'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: CICD-Artifacts

  ### CodeBuild Service Role
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-cicd-role-codebuild'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${ArtifactsBucket}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Ref ArtifactsBucket
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: '*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ### CodePipeline Service Role
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-cicd-role-codepipeline'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetBucketVersioning
                Resource:
                  - !Sub '${ArtifactsBucket}/*'
                  - !Ref ArtifactsBucket
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource:
                  - !GetAtt DevBuildProject.Arn
                  - !GetAtt TestBuildProject.Arn
                  - !GetAtt ProdBuildProject.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ### CodeBuild Projects

  ## Development Build Project
  DevBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-cicd-build-dev'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Value: dev
          - Name: DOMAIN_NAME
            Value: !Ref DevDomain
          - Name: HOSTED_ZONE_ID
            Value: !Ref HostedZoneId
          - Name: PROJECT_NAME
            Value: !Ref ProjectName
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                nodejs: 18
              commands:
                - echo "Installing SAM CLI..."
                - pip3 install aws-sam-cli
                - sam --version
            pre_build:
              commands:
                - echo "Pre-build phase started on `date`"
                - echo "Environment: $ENVIRONMENT"
                - echo "Domain: $DOMAIN_NAME"
            build:
              commands:
                - echo "Build phase started on `date`"
                - echo "Building and deploying to $ENVIRONMENT environment..."
                - ./scripts/deploy-clean.sh $ENVIRONMENT $DOMAIN_NAME $HOSTED_ZONE_ID
            post_build:
              commands:
                - echo "Post-build phase completed on `date`"
                - echo "Deployment to $ENVIRONMENT completed successfully"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: dev

  ## Test Build Project
  TestBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-cicd-build-test'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Value: test
          - Name: DOMAIN_NAME
            Value: !Ref TestDomain
          - Name: HOSTED_ZONE_ID
            Value: !Ref HostedZoneId
          - Name: PROJECT_NAME
            Value: !Ref ProjectName
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                nodejs: 18
              commands:
                - echo "Installing SAM CLI..."
                - pip3 install aws-sam-cli
                - sam --version
            pre_build:
              commands:
                - echo "Pre-build phase started on `date`"
                - echo "Environment: $ENVIRONMENT"
                - echo "Domain: $DOMAIN_NAME"
            build:
              commands:
                - echo "Build phase started on `date`"
                - echo "Building and deploying to $ENVIRONMENT environment..."
                - ./scripts/deploy-clean.sh $ENVIRONMENT $DOMAIN_NAME $HOSTED_ZONE_ID
            post_build:
              commands:
                - echo "Post-build phase completed on `date`"
                - echo "Deployment to $ENVIRONMENT completed successfully"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: test

  ## Production Build Project
  ProdBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-cicd-build-prod'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Value: prod
          - Name: DOMAIN_NAME
            Value: !Ref ProdDomain
          - Name: HOSTED_ZONE_ID
            Value: !Ref HostedZoneId
          - Name: PROJECT_NAME
            Value: !Ref ProjectName
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                nodejs: 18
              commands:
                - echo "Installing SAM CLI..."
                - pip3 install aws-sam-cli
                - sam --version
            pre_build:
              commands:
                - echo "Pre-build phase started on `date`"
                - echo "Environment: $ENVIRONMENT"
                - echo "Domain: $DOMAIN_NAME"
            build:
              commands:
                - echo "Build phase started on `date`"
                - echo "Building and deploying to $ENVIRONMENT environment..."
                - ./scripts/deploy-clean.sh $ENVIRONMENT $DOMAIN_NAME $HOSTED_ZONE_ID
            post_build:
              commands:
                - echo "Post-build phase completed on `date`"
                - echo "Deployment to $ENVIRONMENT completed successfully"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: prod

  ### CodePipeline
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${ProjectName}-cicd-pipeline'
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsBucket
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Provider: GitHub
                Version: '1'
              Configuration:
                Owner: !Ref GitHubOwner
                Repo: !Ref GitHubRepo
                Branch: dev
                OAuthToken: !Ref GitHubToken
                PollForSourceChanges: false
              OutputArtifacts:
                - Name: SourceOutput

        - Name: DeployDev
          Actions:
            - Name: DeployToDev
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref DevBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: DevOutput

        - Name: DeployTest
          Actions:
            - Name: DeployToTest
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref TestBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: TestOutput
              RunOrder: 1

        - Name: ApprovalForProd
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                CustomData: 'Please review the test environment and approve deployment to production'

        - Name: DeployProd
          Actions:
            - Name: DeployToProd
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref ProdBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: ProdOutput

      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ### GitHub Webhook
  GitHubWebhook:
    Type: AWS::CodePipeline::Webhook
    Properties:
      Authentication: GITHUB_HMAC
      AuthenticationConfiguration:
        SecretToken: !Ref GitHubToken
      Filters:
        - JsonPath: $.ref
          MatchEquals: refs/heads/dev
      TargetPipeline: !Ref Pipeline
      TargetAction: SourceAction
      TargetPipelineVersion: !GetAtt Pipeline.Version
      RegisterWithThirdParty: true

Outputs:
  PipelineName:
    Description: Name of the CodePipeline
    Value: !Ref Pipeline
    Export:
      Name: !Sub '${ProjectName}-cicd-pipeline-name'

  ArtifactsBucketName:
    Description: Name of the artifacts S3 bucket
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub '${ProjectName}-cicd-artifacts-bucket'

  PipelineUrl:
    Description: URL of the CodePipeline
    Value: !Sub 'https://console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view'

  DevBuildProject:
    Description: Development build project name
    Value: !Ref DevBuildProject

  TestBuildProject:
    Description: Test build project name
    Value: !Ref TestBuildProject

  ProdBuildProject:
    Description: Production build project name
    Value: !Ref ProdBuildProject
