AWSTemplateFormatVersion: '2010-09-09'
Description: 'Clean CI/CD Pipeline for Engagements Platform'

Parameters:
  ProjectName:
    Type: String
    Default: engage
    Description: Project name for resource naming

  GitHubOwner:
    Type: String
    Default: geseib
    Description: GitHub repository owner

  GitHubRepo:
    Type: String
    Default: engagements
    Description: GitHub repository name


  # Domain Configuration
  DevDomain:
    Type: String
    Default: engage.dev.seibtribe.us
    Description: Development environment domain

  TestDomain:
    Type: String
    Default: engage.test.seibtribe.us
    Description: Test environment domain

  ProdDomain:
    Type: String
    Default: engage.seibtribe.us
    Description: Production environment domain

  HostedZoneId:
    Type: String
    Default: ZB9TUA073B5SH
    Description: Route53 hosted zone ID for all environments


Resources:

  ### S3 Bucket for Pipeline Artifacts
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}cicd-artifacts'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: CICD-Artifacts

  ### GitHub Connection (CodeStar Connection)
  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: !Sub '${ProjectName}-github-connection'
      ProviderType: GitHub

  ### CodeBuild Service Role
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}cicd-codebuild'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
        - arn:aws:iam::aws:policy/IAMFullAccess
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:aws:s3:::${ArtifactsBucket}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${ArtifactsBucket}'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: '*'
              # Secrets Manager permissions for secure GitHub token retrieval
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:engage/test/*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:engage/prod/*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ### CodePipeline Service Role
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}cicd-codepipeline'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetBucketVersioning
                Resource:
                  - !Sub 'arn:aws:s3:::${ArtifactsBucket}/*'
                  - !Sub 'arn:aws:s3:::${ArtifactsBucket}'
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource:
                  - !GetAtt DevBuildProject.Arn
                  - !GetAtt TestBuildProject.Arn
                  - !GetAtt ProdBuildProject.Arn
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref GitHubConnection
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ### CodeBuild Projects

  ## Development Build Project
  DevBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}cicd-build-dev'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Value: dev
          - Name: STACK_NAME
            Value: engagedev
          - Name: DOMAIN_NAME
            Value: !Ref DevDomain
          - Name: HOSTED_ZONE_ID
            Value: !Ref HostedZoneId
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-dev.yml
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: dev

  ## Test Build Project
  TestBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}cicd-build-test'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Value: test
          - Name: STACK_NAME
            Value: engagetest
          - Name: DOMAIN_NAME
            Value: !Ref TestDomain
          - Name: HOSTED_ZONE_ID
            Value: !Ref HostedZoneId
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-test.yml
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: test

  ## Production Build Project
  ProdBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}cicd-build-prod'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: ENVIRONMENT
            Value: prod
          - Name: STACK_NAME
            Value: engageprod
          - Name: DOMAIN_NAME
            Value: !Ref ProdDomain
          - Name: HOSTED_ZONE_ID
            Value: !Ref HostedZoneId
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec-prod.yml
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: prod

  ### CodePipelines - One per Environment/Branch

  ## Dev Pipeline (dev branch)
  DevPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${ProjectName}cicd-pipeline-dev'
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsBucket
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: !Sub '${GitHubOwner}/${GitHubRepo}'
                BranchName: dev
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput

        - Name: DeployDev
          Actions:
            - Name: DeployToDev
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref DevBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: DevOutput

  ## Test Pipeline (test branch)
  TestPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${ProjectName}cicd-pipeline-test'
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsBucket
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: !Sub '${GitHubOwner}/${GitHubRepo}'
                BranchName: test
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput

        - Name: DeployTest
          Actions:
            - Name: DeployToTest
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref TestBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: TestOutput

  ## Prod Pipeline (prod branch)
  ProdPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${ProjectName}cicd-pipeline-prod'
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsBucket
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: !Sub '${GitHubOwner}/${GitHubRepo}'
                BranchName: prod
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput

        - Name: ApprovalForProd
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                CustomData: 'Please review and approve deployment to production'

        - Name: DeployProd
          Actions:
            - Name: DeployToProd
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref ProdBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: ProdOutput

      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ### GitHub Webhooks - One per Branch/Pipeline


Outputs:
  # Pipeline Names
  DevPipelineName:
    Description: Name of the Dev CodePipeline
    Value: !Ref DevPipeline
    Export:
      Name: !Sub '${ProjectName}-cicd-dev-pipeline-name'

  TestPipelineName:
    Description: Name of the Test CodePipeline
    Value: !Ref TestPipeline
    Export:
      Name: !Sub '${ProjectName}-cicd-test-pipeline-name'

  ProdPipelineName:
    Description: Name of the Prod CodePipeline
    Value: !Ref ProdPipeline
    Export:
      Name: !Sub '${ProjectName}-cicd-prod-pipeline-name'

  # Pipeline URLs
  DevPipelineUrl:
    Description: URL of the Dev CodePipeline
    Value: !Sub 'https://console.aws.amazon.com/codesuite/codepipeline/pipelines/${DevPipeline}/view'

  TestPipelineUrl:
    Description: URL of the Test CodePipeline
    Value: !Sub 'https://console.aws.amazon.com/codesuite/codepipeline/pipelines/${TestPipeline}/view'

  ProdPipelineUrl:
    Description: URL of the Prod CodePipeline
    Value: !Sub 'https://console.aws.amazon.com/codesuite/codepipeline/pipelines/${ProdPipeline}/view'

  # Shared Resources
  ArtifactsBucketName:
    Description: Name of the artifacts S3 bucket
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub '${ProjectName}-cicd-artifacts-bucket'

  # Build Projects
  DevBuildProject:
    Description: Development build project name
    Value: !Ref DevBuildProject

  TestBuildProject:
    Description: Test build project name
    Value: !Ref TestBuildProject

  ProdBuildProject:
    Description: Production build project name
    Value: !Ref ProdBuildProject
