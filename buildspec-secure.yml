version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
      python: 3.11
    commands:
      - echo Installing dependencies...
      - npm install -g aws-cdk
      - pip install aws-sam-cli

  pre_build:
    commands:
      - echo Pre-build phase started on `date`
      - echo Environment is $ENVIRONMENT
      - echo Stack name is $STACK_NAME
      
      # Retrieve GitHub token from Secrets Manager
      - |
        if [ "$ENVIRONMENT" == "test" ]; then
          echo Retrieving GitHub token from Secrets Manager for test environment...
          export GITHUB_TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id engage/test/github-token \
            --query SecretString \
            --output text | jq -r .GITHUB_TOKEN)
        elif [ "$ENVIRONMENT" == "prod" ]; then
          echo Retrieving GitHub token from Secrets Manager for prod environment...
          export GITHUB_TOKEN=$(aws secretsmanager get-secret-value \
            --secret-id engage/prod/github-token \
            --query SecretString \
            --output text | jq -r .GITHUB_TOKEN)
        fi
      
      # Verify token was retrieved (without exposing it)
      - |
        if [ -z "$GITHUB_TOKEN" ]; then
          echo "ERROR: Failed to retrieve GitHub token from Secrets Manager"
          exit 1
        else
          echo "Successfully retrieved GitHub token from Secrets Manager"
        fi
      
      # Set other environment variables
      - export GITHUB_REPO="${GITHUB_REPO:-georgeseib/engage2}"
      - echo "GitHub repo set to $GITHUB_REPO"

  build:
    commands:
      - echo Build phase started on `date`
      
      # Build backend with SAM
      - echo Building SAM application...
      - sam build --template-file template-clean.yaml
      
      # Deploy backend with GitHub token
      - echo Deploying SAM application...
      - |
        sam deploy \
          --stack-name $STACK_NAME \
          --s3-bucket ${STACK_NAME}-sam-deployments \
          --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
          --no-confirm-changeset \
          --no-fail-on-empty-changeset \
          --parameter-overrides \
            Environment=$ENVIRONMENT \
            DomainName=$DOMAIN_NAME \
            HostedZoneId=$HOSTED_ZONE_ID \
            GitHubToken=$GITHUB_TOKEN \
            GitHubRepo=$GITHUB_REPO \
          --tags \
            Environment=$ENVIRONMENT \
            Project=engage2 \
            ManagedBy=CodeBuild
      
      # Update frontend configuration
      - echo Updating frontend configuration...
      - |
        cd src
        npm install
        
        # Get outputs from CloudFormation
        export REACT_APP_API_URL=$(aws cloudformation describe-stacks \
          --stack-name $STACK_NAME \
          --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
          --output text)
        
        export REACT_APP_WEBSOCKET_URL=$(aws cloudformation describe-stacks \
          --stack-name $STACK_NAME \
          --query 'Stacks[0].Outputs[?OutputKey==`WebSocketUrl`].OutputValue' \
          --output text)
        
        export REACT_APP_USER_POOL_ID=$(aws cloudformation describe-stacks \
          --stack-name $STACK_NAME \
          --query 'Stacks[0].Outputs[?OutputKey==`UserPoolId`].OutputValue' \
          --output text)
        
        export REACT_APP_USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks \
          --stack-name $STACK_NAME \
          --query 'Stacks[0].Outputs[?OutputKey==`UserPoolClientId`].OutputValue' \
          --output text)
        
        export REACT_APP_COGNITO_DOMAIN=$(aws cloudformation describe-stacks \
          --stack-name $STACK_NAME \
          --query 'Stacks[0].Outputs[?OutputKey==`CognitoDomain`].OutputValue' \
          --output text)
        
        # Build frontend
        npm run build
        
        # Deploy frontend to S3
        aws s3 sync build/ s3://${STACK_NAME}-frontend --delete
        
        # Invalidate CloudFront cache
        DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
          --stack-name $STACK_NAME \
          --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' \
          --output text)
        
        if [ ! -z "$DISTRIBUTION_ID" ]; then
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"
        fi

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Deployment to $ENVIRONMENT environment complete
      - |
        echo "Deployment Summary:"
        echo "  Environment: $ENVIRONMENT"
        echo "  Stack: $STACK_NAME"
        echo "  Domain: $DOMAIN_NAME"
        echo "  GitHub Integration: Enabled (token from Secrets Manager)"

artifacts:
  files:
    - '**/*'
  name: engage-$ENVIRONMENT-$(date +%Y%m%d%H%M%S)