 End-to-End Testing Plan: Engagements Platform

  Overview

  Complete testing workflow for both Call & Answer and Trivia game types from AI prompt creation through final reporting.

  Prerequisites

  - Dev environment deployed and accessible
  - Admin access to create prompts and question sets
  - Multiple test devices/browsers for player simulation

  ---
  Phase 1: AI Prompt Setup

  Step 1.1: Create/Verify AI Prompts

  Purpose: Ensure AI prompts exist for both game types

  Actions:
  1. Navigate to Admin → AI Prompt Manager
  2. Call & Answer Prompt:
    - Check for existing "lessons-learned" or similar prompt
    - If missing, create new prompt with category "callandanswer"
    - Test template variables: {questionTitle}, {responsesText}, {sessionContext}
  3. Trivia Prompt:
    - Check for trivia-specific AI prompt
    - If missing, create new prompt with category "trivia"
    - Test template variables: {triviaChoices}, {correctAnswer}, {triviaCorrectness}

  Validation:
  - Prompts save successfully
  - Template variables display correctly
  - Default prompts are marked appropriately

  ---
  Phase 2: Question Set Creation

  Step 2.1: Call & Answer Question Set

  Purpose: Create working question set for open-ended responses

  Actions:
  1. Navigate to Admin → Question Sets
  2. Create new set:
    - Name: "E2E Test Call & Answer"
    - Type: Call & Answer
    - AI Context: "Strategic thinking session for testing"
    - Custom Instruction: "Consider business impact and implementation feasibility"
    - Prompt ID: Select the call & answer prompt from Step 1.1
  3. Add 3-5 questions with:
    - Clear titles and detailed context
    - Different categories (Strategy, Innovation, Leadership)
    - Varied complexity levels

  Sample Questions:
  Q1: Strategic Priority
  Title: "What should be our top strategic priority for next quarter?"
  Detail: "Consider market conditions, resource constraints, and competitive landscape"
  Category: Strategy

  Q2: Innovation Challenge
  Title: "What's the biggest barrier to innovation in our organization?"
  Detail: "Think about processes, culture, technology, and leadership factors"
  Category: Innovation

  Validation:
  - Question set saves with correct metadata
  - AI prompt is properly linked
  - Questions display correctly in preview

  Step 2.2: Trivia Question Set

  Purpose: Create working trivia set with multiple choice questions

  Actions:
  1. Create new set:
    - Name: "E2E Test Trivia"
    - Type: Trivia
    - AI Context: "Knowledge assessment and team building"
    - Prompt ID: Select the trivia prompt from Step 1.1
  2. Add 3-5 trivia questions with:
    - Multiple choice options (A, B, C, D)
    - Clear correct answers
    - Point values (10 pts default)
    - Mix of difficulty levels

  Sample Questions:
  Q1: Business Knowledge
  Title: "What does ROI stand for?"
  A) Return on Investment
  B) Rate of Interest
  C) Revenue over Income
  D) Risk of Investment
  Correct: A
  Points: 10

  Q2: Technology
  Title: "Which programming language is known for 'write once, run anywhere'?"
  A) Python
  B) Java
  C) C++
  D) JavaScript
  Correct: B
  Points: 15

  Validation:
  - Trivia options save correctly
  - Correct answers are properly marked
  - Point values are assigned
  - AI prompt links properly

  ---
  Phase 3: Game Creation & Setup

  Step 3.1: Call & Answer Game

  Purpose: Test complete game creation and configuration

  Actions:
  1. Navigate to Host → Create Game
  2. Configure game:
    - Event Title: "E2E Test Call & Answer Session"
    - Game Type: Call & Answer
    - Question Set: Select "E2E Test Call & Answer"
    - AI Context: "Testing comprehensive workflow"
    - Access: Public for easy testing
  3. Category Selection:
    - Select 2-3 categories from your question set
    - Verify bitmask generation
    - Check active category display
  4. Start Game (make it playable)

  Validation:
  - Game creates successfully
  - QR code generates for player joining
  - Game ID is valid and accessible
  - Categories display correctly
  - Game state shows "STARTED"

  Step 3.2: Trivia Game

  Purpose: Test trivia-specific game setup

  Actions:
  1. Create second game:
    - Event Title: "E2E Test Trivia Challenge"
    - Game Type: Trivia
    - Question Set: Select "E2E Test Trivia"
    - Access: Public
  2. Configure and start game
  3. Note any differences in UI/behavior

  Validation:
  - Trivia game creates successfully
  - Trivia-specific UI elements appear
  - Multiple choice format is preserved
  - Scoring system reflects trivia rules

  ---
  Phase 4: Gameplay Testing

  Step 4.1: Call & Answer Gameplay

  Purpose: Test complete player interaction flow

  Setup: Use 3-4 different devices/browsers as players

  Player Actions:
  1. Join Game:
    - Scan QR code or enter game ID
    - Enter player names: "Alice", "Bob", "Charlie", "Diana"
    - Verify all players appear in host view
  2. Question Flow (repeat for 2-3 questions):
    - Host advances to question
    - Players see question and can submit answers
    - Collect varied responses (serious and creative)
    - Host advances to voting phase
    - Players rank answers (1st, 2nd, 3rd choice)
    - Host shows results with scores
  3. Answer Examples:
  Q: "Top strategic priority?"
  Alice: "Customer retention and satisfaction"
  Bob: "Digital transformation acceleration"
  Charlie: "Operational efficiency improvements"
  Diana: "Market expansion into new regions"

  Host Monitoring:
  - Real-time player updates work
  - Answer submissions appear correctly
  - Voting interface functions properly
  - Score calculations are accurate
  - Leaderboard updates correctly

  Step 4.2: Trivia Gameplay

  Purpose: Test trivia-specific mechanics

  Player Actions:
  1. Same players join trivia game
  2. Question Flow:
    - Host advances to trivia question
    - Players see multiple choice options
    - Players select answers (mix correct/incorrect)
    - Host shows results with correctness
    - Scores update based on correct answers
  3. Answer Distribution:
  Q: "What does ROI stand for?"
  Alice: A (correct) → 10 points
  Bob: B (incorrect) → 0 points
  Charlie: A (correct) → 10 points
  Diana: C (incorrect) → 0 points

  Validation:
  - Multiple choice options display correctly
  - Answer selection works on all devices
  - Correct answers are properly identified
  - Scoring reflects correctness (not voting)
  - Results show accuracy percentages

  ---
  Phase 5: AI Summary & Reporting

  Step 5.1: Call & Answer AI Summary

  Purpose: Test AI generation with voting data

  Actions:
  1. After completing 2-3 questions with voting
  2. Host clicks "Get AI Summary" for each question
  3. Test both cached and new generation:
    - First click: generates new summary
    - Second click: returns cached version
    - Use ?generateNew=true to force regeneration

  Validation Points:
  - AI summary generates without errors
  - Summary includes voting results and winner info
  - Discussion questions are relevant to responses
  - Next steps are actionable
  - Template variables are properly replaced:
    - {questionTitle} → actual question
    - {responsesText} → ranked player responses
    - {totalVotes} → number of votes cast
    - {winnerInfo} → highest-scoring answer

  Step 5.2: Trivia AI Summary

  Purpose: Test AI generation with trivia scoring

  Actions:
  1. Generate AI summary for trivia questions
  2. Verify trivia-specific handling

  Validation Points:
  - Critical: No "votes is not defined" error
  - Summary uses correctness instead of voting
  - Template variables work correctly:
    - {triviaChoices} → A) B) C) D) options
    - {correctAnswer} → the right answer
    - {triviaCorrectness} → "X of Y players correct (Z%)"
    - {triviaResponses} → distribution of answers
  - Consensus level shows "Trivia results - no consensus voting"

  Step 5.3: Comprehensive Reporting

  Purpose: Test full game reports and data export

  Actions:
  1. Generate Game Report:
    - Host → Reports → Generate Full Report
    - Include all questions and AI summaries
  2. Test Report Features:
    - PDF export functionality
    - Email report capability
    - Data completeness and formatting

  Validation:
  - Report generates successfully for both game types
  - All questions and summaries included
  - Player scores and rankings accurate
  - Export functions work properly
  - Report formatting is professional

  ---
  Phase 6: Edge Cases & Error Handling

  Step 6.1: Error Scenarios

  Test these problematic scenarios:

  1. Empty Responses:
    - Start question but don't submit answers
    - Try to generate AI summary with no data
  2. Partial Voting:
    - Some players vote, others don't
    - Test score calculations with incomplete data
  3. Connection Issues:
    - Players disconnect mid-game
    - Host refreshes browser
    - Network interruptions
  4. Invalid Data:
    - Very long player names
    - Special characters in responses
    - Empty question sets

  Validation:
  - Graceful error handling
  - Helpful error messages
  - Recovery mechanisms work
  - Data integrity maintained

  Step 6.2: Performance Testing

  Test under load:

  1. Multiple Concurrent Games:
    - Create 2-3 games simultaneously
    - Test player joining and gameplay
  2. Large Player Count:
    - Add 10+ players to single game
    - Test performance and responsiveness
  3. Rapid Actions:
    - Quick question advancement
    - Simultaneous answer submission
    - Concurrent voting

  ---
  Phase 7: Issue Documentation & Resolution

  Step 7.1: Issue Tracking Template

  For each issue found, document:

  ## Issue #X: [Brief Description]
  **Game Type**: Call & Answer / Trivia / Both
  **Phase**: Creation / Gameplay / Reporting
  **Severity**: Critical / High / Medium / Low

  **Steps to Reproduce**:
  1. [Step 1]
  2. [Step 2]
  3. [Error occurs]

  **Expected Behavior**: [What should happen]
  **Actual Behavior**: [What actually happens]
  **Error Messages**: [Any console errors/UI messages]

  **Impact**: [How this affects user experience]
  **Workaround**: [Temporary solution if available]

  Step 7.2: Priority Resolution Order

  1. Critical: Game-breaking errors, data loss
  2. High: Major functionality broken, poor UX
  3. Medium: Minor issues, edge cases
  4. Low: Cosmetic issues, nice-to-have improvements

  ---
  Success Criteria

  Call & Answer Games ✅

  - Complete flow from prompt to report works
  - Voting and scoring function correctly
  - AI summaries generate with voting context
  - All template variables populate properly

  Trivia Games ✅

  - Multiple choice questions work correctly
  - Scoring based on correctness (not voting)
  - AI summaries handle trivia data properly
  - No "votes is not defined" errors

  Overall Platform ✅

  - Both game types work independently
  - Shared components work for both types
  - Reports export correctly
  - Performance is acceptable
  - Error handling is robust

