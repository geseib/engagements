<title>One Look</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: the room's 16:9 screen, the host's dashboard and the phone remote side by side,
   all reading one shared state. Warm Summit dusk tokens (styles.css:9-55); single dark look. */
:root{
  --bg:#0F1A2E; --canvas:#0A1324; --surface:#1B2942; --surface-2:#25375A;
  --text:#F4EDE4; --muted:#9BA8BE; --primary:#F6A94C; --primary-deep:#C77B4A;
  --secondary:#7CA7E6; --success:#4FB286; --danger-text:#EF8C86;
  --line:rgba(155,168,190,.22); --line-strong:rgba(155,168,190,.4);
  --on-primary:#0F1A2E; --sec-tint:rgba(124,167,230,.16);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--canvas);color:var(--text)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 40px}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--secondary);outline-offset:2px}

/* ---------- prototype toolbar (not part of the design) ---------- */
.tb{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding-block:16px 10px;border-bottom:1px solid var(--line)}
.tb h1{font-family:var(--f-display);font-size:19px;font-weight:700;margin:0;letter-spacing:.01em}
.tb h1 small{display:block;font-family:var(--f-ui);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.tb .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tb label,.tb .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 10px;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--sec-tint);color:var(--text);box-shadow:inset 0 -2px 0 var(--secondary)}
.tb select{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:5px 8px;font-size:13px}
.fitstat{font-size:12px;font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.fitstat.ok{color:var(--success);border-color:rgba(79,178,134,.45)}
.fitstat.bad{color:var(--danger-text);border-color:rgba(239,140,134,.5)}
.ghost-sm{background:transparent;border:1px solid var(--line-strong);border-radius:8px;padding:5px 10px;font-size:13px}
.jump{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:10px;font-size:12px;color:var(--muted)}
.jump button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.jump button[aria-current="step"]{border-color:var(--secondary);color:var(--text);background:var(--sec-tint)}
.keys{font-size:12px;color:var(--muted);margin-left:auto}
kbd{font-family:var(--f-ui);font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--text)}

/* ---------- surfaces grid ---------- */
.surf{display:grid;gap:20px;align-items:start;padding-top:8px}
.surf.setup-a{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-areas:"dash pres" "dash rem"}
.surf.setup-b{grid-template-columns:minmax(0,1fr) minmax(0,760px);grid-template-areas:"pres rem"}
.surf.setup-all{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-areas:"dash pres" "dash rem"}
.s-phones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.surf.setup-a .s-phones .s-rem{display:none}
.surf.setup-b .s-dash{display:none}
.s-pres{grid-area:pres;min-width:0}.s-dash{grid-area:dash;min-width:0}.s-phones{grid-area:rem;min-width:0}.s-rem,.s-ply{min-width:0}
.surf.setup-all .s-rem{justify-self:stretch;width:100%;max-width:none}
.cap{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin:0 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cap b{color:var(--text);font-weight:600}
.cap-note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
@media (max-width:1000px){
  .surf.setup-a,.surf.setup-b,.surf.setup-all{grid-template-columns:minmax(0,1fr);grid-template-areas:"pres" "dash" "rem"}
  .surf .s-rem{justify-self:center;width:100%;max-width:390px}
  .keys{margin-left:0}
}

/* ---------- the 16:9 presentation frame ----------
   A virtual 1920x1080 canvas, scaled to its box. overflow:hidden everywhere: it never scrolls. */
.fw{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;border-radius:6px;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
.fw .pf{position:absolute;left:0;top:0;transform-origin:0 0}
.pf{width:1920px;height:1080px;overflow:hidden;display:flex;flex-direction:column;padding:64px 96px 56px;
  background:radial-gradient(120% 90% at 85% 0%,#1E3050 0%,var(--bg) 55%),var(--bg);color:var(--text);font-family:var(--f-ui);line-height:1.3}
/* the four ladders, as px at 1080 tall (styles/stage.css:43-86, clamp() resolved at 1080) */
.p-room,.p-call{--L-hero:91px;--L-primary:60px;--L-secondary:40px;--L-body:30px;--L-meta:21px;--fit-min:.55;--hair:1px}
.p-call{--hair:2px}
.p-tv{--L-hero:119px;--L-primary:80px;--L-secondary:52px;--L-body:38px;--L-meta:26px;--fit-min:.78;--hair:1px}
.p-table{--L-hero:64px;--L-primary:43px;--L-secondary:28px;--L-body:22px;--L-meta:16px;--fit-min:.55;--hair:1px}
.pf{--fit:1}
.pt{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--L-meta);color:var(--muted);font-weight:500;padding-bottom:20px;border-bottom:var(--hair) solid var(--line);flex:none}
.pt b{color:var(--text);font-weight:600}
.pm{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding-block:28px}
.pfoot{flex:none;display:flex;align-items:center;justify-content:center;gap:28px;font-size:var(--L-meta);color:var(--muted);padding-top:18px;border-top:var(--hair) solid var(--line);min-height:calc(var(--L-meta)*2.6)}
.pfoot b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.ey{font-size:calc(var(--L-meta)*var(--fit));text-transform:uppercase;letter-spacing:.12em;color:var(--secondary);font-weight:600;margin:0 0 .6em}
.hero{font-family:var(--f-display);font-weight:800;font-size:calc(var(--L-hero)*var(--fit));line-height:1.04;margin:0 0 .35em;text-wrap:balance;letter-spacing:-.01em}
.h2{font-family:var(--f-display);font-weight:700;font-size:calc(var(--L-primary)*var(--fit));line-height:1.1;margin:0 0 .4em;text-wrap:balance}
.lead{font-size:calc(var(--L-secondary)*var(--fit));line-height:1.3;margin:0 0 .6em;max-width:34ch}
.bodyt{font-size:calc(var(--L-body)*var(--fit));color:var(--muted);line-height:1.4;margin:0 0 .8em;max-width:52ch}
.meter{display:flex;gap:8px}
.meter i{display:block;width:44px;height:12px;border-radius:6px;background:var(--surface-2)}
.meter i.on{background:var(--secondary)}
.meter i.all{background:var(--success)}

/* lobby */
.lob{display:grid;grid-template-columns:1fr auto;gap:96px;align-items:center}
.code{font-family:var(--f-display);font-weight:800;font-size:calc(var(--L-hero)*2*var(--fit));letter-spacing:.08em;line-height:1;margin:.1em 0 .25em;color:var(--text)}
.qr{width:calc(380px*var(--fit));aspect-ratio:1;display:grid;grid-template-columns:repeat(21,1fr);background:#F4EDE4;padding:18px;border-radius:12px}
.qr span{background:transparent}.qr span.k{background:#0F1A2E}

/* tally (results) */
.tal{display:flex;flex-direction:column;gap:calc(22px*var(--fit))}
.trow{display:grid;grid-template-columns:calc(var(--L-secondary)*1.4*var(--fit)) minmax(0,1fr) auto;gap:24px;align-items:center}
.trow .rk{font-family:var(--f-display);font-weight:700;font-size:calc(var(--L-secondary)*var(--fit));color:var(--muted);text-align:right}
.trow .nm{font-size:calc(var(--L-secondary)*var(--fit));font-weight:600;line-height:1.15}
.trow .nm small{display:block;font-size:calc(var(--L-meta)*var(--fit));font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.2em}
.trow .bar{height:calc(14px*var(--fit));border-radius:7px;background:var(--secondary);margin-top:.5em}
.trow .pts{font-size:calc(var(--L-secondary)*var(--fit));font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.trow .pts small{font-size:.55em;color:var(--muted);font-weight:500;margin-left:.3em}
.tmore{font-size:calc(var(--L-body)*var(--fit));color:var(--muted);padding-left:calc(var(--L-secondary)*1.4*var(--fit) + 24px)}

/* response navigator */
.nav{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:40px;height:100%;min-height:0;align-items:stretch}
.fl{display:flex;flex-direction:column;justify-content:center;gap:18px;min-width:0}
.mini{border:var(--hair) solid var(--line-strong);border-radius:16px;padding:16px 20px;background:rgba(27,41,66,.6);min-width:0}
.mini .n{font-family:var(--f-display);font-weight:700;font-size:var(--L-secondary);line-height:1;color:var(--muted)}
.mini .w{font-size:var(--L-meta);color:var(--muted);line-height:1.3;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rng{border:var(--hair) dashed var(--line-strong);border-radius:16px;padding:16px 20px;text-align:center}
.rng .n{font-family:var(--f-display);font-weight:700;font-size:var(--L-secondary);line-height:1.1;color:var(--muted);font-variant-numeric:tabular-nums}
.rng .w{font-size:var(--L-meta);color:var(--muted)}
.card{background:var(--surface);border:3px solid var(--secondary);border-radius:28px;padding:44px 56px 40px;display:flex;flex-direction:column;min-height:0;min-width:0}
.ch{display:flex;align-items:center;gap:22px;flex:none;margin-bottom:24px}
.badge{flex:none;min-width:calc(var(--L-secondary)*1.7);height:calc(var(--L-secondary)*1.7);padding:0 .3em;border-radius:999px;background:var(--secondary);color:var(--bg);font-family:var(--f-display);font-weight:800;font-size:var(--L-secondary);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.ch .who{font-size:var(--L-secondary);font-weight:700;line-height:1.1;min-width:0}
.ch .who small{display:block;font-size:var(--L-meta);color:var(--muted);font-weight:500;margin-top:4px}
.ch .sample{margin-left:auto;font-size:var(--L-meta);border:var(--hair) solid var(--line-strong);border-radius:999px;padding:4px 14px;color:var(--muted);flex:none}
.fit-text{flex:1;min-height:0;overflow:hidden;font-size:var(--L-primary);line-height:1.28;font-weight:500;margin:0}
.part{flex:none;font-size:var(--L-meta);color:var(--secondary);font-weight:600;margin-top:16px}
.trk{display:flex;gap:6px;align-items:center}
.trk i{display:block;width:30px;height:10px;border-radius:5px;background:var(--surface-2)}
.trk i.on{background:var(--secondary);width:56px}
.trk.long{position:relative;width:640px;height:10px;border-radius:5px;background:var(--surface-2)}
.trk.long em{position:absolute;top:-5px;height:20px;width:12px;border-radius:6px;background:var(--secondary)}

/* Workie's read */
.rd-h{font-family:var(--f-display);font-weight:700;font-size:calc(var(--L-primary)*var(--fit));margin:0 0 .5em;line-height:1.1}
.rd-h small{font-family:var(--f-ui);font-weight:500;font-size:.45em;color:var(--muted);margin-left:.6em;letter-spacing:.02em}
.rd ul,.rd ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.75em}
.rd li,.rd p{font-size:calc(var(--L-body)*1.22*var(--fit));line-height:1.36;max-width:62ch;margin:0}
.rd ul li{padding-left:1.1em;position:relative}
.rd ul li::before{content:"";position:absolute;left:0;top:.55em;width:.42em;height:.42em;border-radius:50%;background:var(--secondary)}
.rd ol{counter-reset:t}
.rd ol li{counter-increment:t;padding-left:1.8em;position:relative}
.rd ol li::before{content:counter(t);position:absolute;left:0;top:-.05em;font-family:var(--f-display);font-weight:800;color:var(--primary-deep);font-size:1.15em}
.rd.topics li{font-size:calc(var(--L-secondary)*var(--fit));line-height:1.3}
.rd strong{font-weight:700;color:var(--text)}
.rd em{font-style:normal;color:#D9E5F7}
.pg{display:flex;gap:10px}
.pg i{display:block;width:48px;height:10px;border-radius:5px;background:var(--surface-2)}
.pg i.seen{background:rgba(124,167,230,.45)}
.pg i.on{background:var(--secondary)}

/* asks */
.opts{display:grid;gap:calc(18px*var(--fit));margin-top:.4em}
.opt{display:grid;grid-template-columns:calc(var(--L-secondary)*1.3*var(--fit)) minmax(0,1fr) auto;gap:20px;align-items:center;font-size:calc(var(--L-secondary)*var(--fit))}
.opt .k{font-family:var(--f-display);font-weight:800;color:var(--muted)}
.opt .c{font-weight:700;font-variant-numeric:tabular-nums}
.opt .b{grid-column:2/4;height:calc(16px*var(--fit));border-radius:8px;background:var(--secondary)}
.opt .b.z{background:var(--surface-2)}
.agree3{display:flex;gap:24px;margin-top:.6em}
.agree3 span{font-size:calc(var(--L-body)*var(--fit));border:var(--hair) solid var(--line-strong);border-radius:999px;padding:.35em 1em;color:var(--muted)}
.stmt{font-family:var(--f-display);font-weight:700;font-size:calc(var(--L-primary)*var(--fit));line-height:1.12;margin:0 0 .3em;max-width:24ch;text-wrap:balance}

/* off / not presenting */
.off{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:var(--L-secondary)}

/* one-screen strip (setup b, the no-phone fallback) */
.strip{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:rgba(15,26,46,.92);border:1px solid var(--line-strong);border-radius:12px;padding:6px 8px 6px 14px;font-size:12px;color:var(--muted);opacity:0;pointer-events:none;transition:opacity .2s;max-width:94%;white-space:nowrap}
.fw.stripon:hover .strip,.fw.stripon:focus-within .strip{opacity:1;pointer-events:auto}
.strip .st{overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ---------- shared control pieces ---------- */
.btn{border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-2);padding:9px 14px;font-weight:600;font-size:14px;line-height:1.2}
.btn-p{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn-p.armed{box-shadow:0 0 0 3px rgba(246,169,76,.35)}
.btn-p.ready{box-shadow:0 0 0 3px var(--success)}
.btn-g{background:transparent}
.btn-s{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[aria-pressed="true"]{background:var(--sec-tint);border-color:var(--secondary);color:var(--text)}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- dashboard (laptop) ---------- */
.db{background:var(--bg);border:1px solid var(--line-strong);border-radius:12px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:780px;overflow:hidden}
.db-h{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.db-h .ses{font-family:var(--f-display);font-weight:700;font-size:17px}
.db-h .rnd{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dots{display:flex;gap:4px}.dots i{width:16px;height:6px;border-radius:3px;background:var(--surface-2)}
.dots i.done{background:rgba(124,167,230,.5)}.dots i.on{background:var(--secondary)}
.db-h .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line-strong);border-radius:999px;padding:4px 10px;background:transparent}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--success)}
.chip.offc .dot{background:var(--muted)}
.db-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0}
.db-l{padding:14px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.db-r{padding:14px 16px;min-height:0;overflow:auto}
.lab{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.navrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.navrow .pos{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;min-width:0;flex:1}
.upnext{font-size:13px;color:var(--muted)}
.upnext b{color:var(--text);font-weight:600}
.qcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.qcard summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;gap:8px;justify-content:space-between}
.qcard summary::after{content:"Show";font-weight:500;font-size:12px;color:var(--secondary)}
.qcard[open] summary::after{content:"Hide"}
.qcard p{font-size:13px;margin:8px 0 0;color:var(--muted)}
.qcard p b{color:var(--text);font-weight:600}
.db-f{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.db-f .stat{flex:1;min-width:160px;font-size:14px}
.db-f .stat small{display:block;font-size:12px;color:var(--muted)}
.db-f .btn-p{font-size:16px;padding:12px 20px;min-width:180px}
@media (max-width:1000px){.db{height:auto}.db-b{grid-template-columns:minmax(0,1fr)}.db-l{border-right:0;border-bottom:1px solid var(--line)}}

/* moment panel (shared by dashboard and remote, two skins) */
.pl{display:flex;flex-direction:column;gap:12px}
.pl h3{font-family:var(--f-display);font-size:16px;font-weight:700;margin:0}
.pl .note{font-size:12px;color:var(--muted);margin:0}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);min-height:36px}
.row:first-child{border-top:0}
.row.on{background:var(--sec-tint);box-shadow:inset 3px 0 0 var(--secondary)}
.row .i{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;font-size:13px;text-align:right}
.row .t{min-width:0;font-size:14px}
.row .t b{font-weight:600}
.row .t span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span.wrap{white-space:normal}
.row .pts{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
.row .act{display:flex;align-items:center;gap:6px}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people span{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.people span.wait{border-color:rgba(246,169,76,.0);background:var(--surface-2)}
.ask{border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface);text-align:left;width:100%}
.ask[aria-pressed="true"]{border-color:var(--secondary);box-shadow:inset 0 0 0 1px var(--secondary);background:#1E3152}
.ask .ty{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--secondary);font-weight:600}
.ask .q{font-size:14px;font-weight:600}
.ask ol{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.ask .why{font-size:12px;color:var(--muted)}
.ask .mk{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:4px}
.tl{display:flex;flex-direction:column;gap:6px}
.tl div{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:8px;font-size:13px;align-items:center}
.tl div i{grid-column:1/3;height:6px;border-radius:3px;background:var(--secondary);display:block}
.pages{display:flex;flex-direction:column;gap:4px}
.pages button{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;font-size:14px}
.pages button[aria-current="page"]{border-color:var(--secondary);background:var(--sec-tint)}

<script>
(function(){
"use strict";
/* ================= real content: session 5479, round 5 ================= */
var Q={
  title:"Ada Lovelace Programs a Machine Not Yet Built",
  category:"New territory", set:"Professional Development",
  background:"In 1843, Ada Lovelace wrote the first algorithm intended for Charles Babbage's Analytical Engine, a computer that didn't yet exist. She conceived of a machine's potential beyond its inventor's own vision. She was writing instructions for a future nobody could see.",
  task:"What should our team be designing for a capability we do not have yet? Which assumptions would we be making, and how could we test them cheaply now?"
};
var REAL=[
 {name:"Maya Chen",pts:8,text:"Design our incident runbooks for the day monitoring can auto-remediate the top ten alerts, but only as a written spec, not a new platform. We'd be assuming those alerts are repetitive enough to script and that people will trust a bot to restart things at 3am. Test it cheaply: have on-call log every manual fix for six weeks and see how many were truly identical."},
 {name:"Sam Okafor",pts:7,text:"Usage-based pricing: we can't meter it today, but we should design the invoice and the margin model now. The assumption is that heavy users will pay more rather than leave; test it cheaply by sending ten customers a shadow invoice next quarter and counting who'd have churned."},
 {name:"Priya Nair",pts:6,text:"Proactive support: designing the playbook for the day we can spot a struggling customer from their usage before they ever file a ticket. We'd be assuming customers welcome an unprompted check-in rather than finding it creepy. Test it cheaply now: if CSMs hand-pick ten accounts with dropping logins and reach out this month, then we'll learn from their replies whether it builds trust."},
 {name:"Diego Ramos",pts:3,text:"Design the product for AI agents as first-class users: clean APIs and permissions an agent can drive end to end, not just a chat box bolted onto the UI. We're assuming agents get reliable enough within a year and customers will let them act on their behalf. Test it this month: point an off-the-shelf agent at our API for one real workflow and count where it breaks."}
];
var LONG_SAMPLE="Design the data export for the day every customer asks to leave with their history intact, because regulators are moving that way and a clean exit is also a reason to stay. We would be assuming three things. First, that customers want their raw records rather than a pretty report, which we have never asked. Second, that our schema is stable enough to promise a format for two years, which the last migration suggests it is not. Third, that sales will treat an easy exit as a selling point instead of a threat. Test the first one this month: offer ten accounts a one-click export of everything and see which file they open first. Test the second by freezing a draft format and counting how many fields we break in one quarter. Test the third by putting the export into two sales decks and asking the reps afterwards whether it came up, and whether the buyer leaned in or out.";
var POOL=[
 "Write the onboarding flow for when the product can import any spreadsheet. We assume people's files are messier than ours. Ask five customers for their worst file this week.",
 "Plan the support desk for a second language before we have one speaker. Assumes demand is there; count tickets that start in translation tools.",
 "Draft the pricing page for a free tier we cannot afford yet. Assumes free users convert; test with a waitlist and see who signs up.",
 "Design the audit trail for when the largest customers ask for it in every contract. Read the last ten contracts and count the clauses.",
 "Sketch how we would run releases daily. Assumes tests are trustworthy; measure how often a green build broke something last month.",
 "Prepare a partner API spec before any partner asks. Test by showing it to two integrators and timing how long they take to say no.",
 "Write the playbook for an outage in the region we are about to enter. Assumes the same on-call works across time zones; shadow one week.",
 "Design reporting for a manager who never logs in. Assumes email is read; send one plain summary to five managers and count replies."
];
var READ_MD="## What the room said\n\n- **Maya's runbook spec**: *\"Design our incident runbooks for the day monitoring can auto-remediate the top ten alerts\"*, scoped to a written spec, not a new platform, and it asks on-call to log six weeks of manual fixes to test whether they are truly identical.\n- **Sam's usage pricing**: *\"we can't meter it today, but we should design the invoice and the margin model now\"*. The bet is that heavy users pay more rather than leave, checked with ten shadow invoices.\n- **No split**: all four answers share one move: design something now and test it cheaply before building it.\n\n## What the room voted\n\n- **Maya Chen leads** with the runbook answer, *\"Design our incident runbooks for the day monitoring can auto-remediate the top ten alerts\"*, on 8 vote points (2 first, 1 second, 0 third).\n- **The vote tracked the writing**: Sam Okafor's pricing answer took 7 points and Priya Nair's support playbook took 6, so the top three sit close together.\n- **Worth keeping**: Diego Ramos's answer on *\"AI agents as first-class users\"* earned 3 points, all third-place. Ignoring it would drop the only answer that thinks about who the product serves next.\n\nStandings after this round: Maya Chen 28, Sam Okafor 26, Priya Nair 23. Maya gained 8 this round and holds a 2-point lead over Sam, so this is a close race, not a runaway. Turnout: 4 answered, 4 voted, 5 joined the session.\n\n## Discussion topics\n\n1. Maya's answer says *\"trust a bot to restart things at 3am\"*. What would on-call need to see before they trust an auto-remediation script?\n2. Sam's answer assumes *\"heavy users will pay more rather than leave\"*. Which of our 120 pilot customers would you expect to push back first?\n3. Diego's answer asks us to design for *\"AI agents as first-class users\"*. Would a clean API for agents conflict with the plain-language reports the Tally brief promises?\n\n## Suggested next steps\n\n1. Whoever runs on-call rotation: start logging every manual fix on the top ten alerts this week, so the six-week test can begin.\n2. Whoever owns billing: draft one shadow invoice with the usage-based margin model from Sam's answer and pick the first ten customers to receive it.\n3. Whoever leads customer success: pick ten accounts with dropping logins, as Priya's answer describes, and reach out before the week ends.";
var ASKS=[
 {type:"agree",statement:"people will trust a bot to restart things at 3am",answers:[1],why:"Tests whether the top-voted runbook idea holds for those who did not rank it first, by probing its riskiest assumption.",tally:[2,2,1]},
 {type:"choice",question:"Which test would you start first?",answers:[1,2,3,4],why:"Finds which cheap test the whole room would actually begin with, beyond the vote leader.",
  options:[{text:"have on-call log every manual fix for six weeks",rew:1},{text:"sending ten customers a shadow invoice next quarter"},{text:"CSMs hand-pick ten accounts with dropping logins"},{text:"point an off-the-shelf agent at our API",rew:1}],tally:[2,1,2,0]}
];

/* ================= state ================= */
var S={setup:"all",profile:"room",count:4,names:true,moment:"LOBBY",answered:0,voted:0,resp:0,part:0,vresp:0,page:0,seen:0,ask:0,askAns:0,armed:false,presenting:true,qOpen:false,mine:{answered:false,ballot:[]},feedback:false};
var MOMENTS=["LOBBY","ANSWERING","VOTING","VOTE_RESPONSES","RESULTS","RESPONSES","READ","FEEDBACK","COMPOSE","ASK_LIVE","ASK_RESULTS","NEXT"];
var MLABEL={LOBBY:"Lobby",ANSWERING:"Answering",VOTING:"Voting",VOTE_RESPONSES:"Voting · a response shown",RESULTS:"Results",RESPONSES:"Responses",READ:"What we heard",FEEDBACK:"Feedback",COMPOSE:"Ask the room",ASK_LIVE:"Room question",ASK_RESULTS:"Its results",NEXT:"Next round"};

function list(){
  var out=REAL.slice(0,Math.min(4,S.count));
  for(var k=4;k<S.count;k++){
    var t=(k===5)?LONG_SAMPLE:POOL[(k-4)%POOL.length];
    out.push({name:"Sample person "+(k+1),pts:Math.max(0,3-Math.floor((k-3)/3)),text:t,sample:true});
  }
  out.sort(function(a,b){return b.pts-a.pts});
  return out;
}
function joined(){return S.count+1}
/* The voting order every ballot shows: a seeded per-round shuffle (answer-order.js). No names travel in it. */
function voteList(){var L=list().slice(),seed=5005;for(var i=L.length-1;i>0;i--){seed=(seed*9301+49297)%233280;var j=Math.floor(seed/233280*(i+1));var t=L[i];L[i]=L[j];L[j]=t}return L}
function names(){var l=list().map(function(r){return r.name});l.push("Guest (no name given)");return l}

/* ================= markdown -> blocks ================= */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(&quot;.+?&quot;)\*/g,"<em>$1</em>").replace(/\*(.+?)\*/g,"<em>$1</em>")}
function sections(){
  var secs=[],cur=null;
  READ_MD.split("\n").forEach(function(l){
    if(/^## /.test(l)){cur={title:l.slice(3),blocks:[]};secs.push(cur);return}
    if(!l.trim()||!cur)return;
    var m;
    if(/^- /.test(l))cur.blocks.push({k:"ul",h:inl(l.slice(2))});
    else if((m=l.match(/^(\d+)\. (.*)$/)))cur.blocks.push({k:"ol",h:inl(m[2])});
    else cur.blocks.push({k:"p",h:inl(l)});
  });
  return secs;
}

/* ================= fitting ================= */
function over(el){return el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1}
function px(pf,name){return parseFloat(getComputedStyle(pf).getPropertyValue(name))||0}
function fitText(el,pf){
  var max=px(pf,"--L-primary"),min=px(pf,"--L-secondary"),f=max;
  el.style.fontSize=f+"px";
  while(over(el)&&f>min){f=Math.max(min,f-2);el.style.fontSize=f+"px"}
  return !over(el);
}
function fitFrame(pf){
  var main=pf.querySelector(".pm");if(!main)return true;
  var min=px(pf,"--fit-min")||.55,f=1;
  main.querySelectorAll("[data-drop]").forEach(function(e){e.hidden=false});
  pf.style.setProperty("--fit",1);
  while(over(main)&&f>min){f=Math.max(min,+(f-.03).toFixed(2));pf.style.setProperty("--fit",f)}
  if(over(main)){main.querySelectorAll("[data-drop]").forEach(function(e){e.hidden=true})}
  var ok=!over(main)&&!over(pf);
  pf.querySelectorAll(".fit-text").forEach(function(t){if(!fitText(t,pf))ok=false});
  return ok;
}
var measure=document.getElementById("measure");
function prep(el){el.className="pf p-"+S.profile}

/* Workie's read: measured pages. A section is one page unless it does not fit; then it splits by block. */
var readCache={};
function readPages(){
  var key=S.profile;if(readCache[key])return readCache[key];
  prep(measure);var pages=[];
  sections().forEach(function(sec){
    var cur={title:sec.title,blocks:[],cont:false};
    sec.blocks.forEach(function(b){
      cur.blocks.push(b);
      measure.innerHTML=readPageHTML(cur,0,9);
      if(!fitAtOne(measure)&&cur.blocks.length>1){
        cur.blocks.pop();pages.push(cur);cur={title:sec.title,blocks:[b],cont:true};
      }
    });
    pages.push(cur);
  });
  return (readCache[key]=pages);
}
function fitAtOne(pf){pf.style.setProperty("--fit",1);var m=pf.querySelector(".pm");return !over(m)}

/* A long response: fit the text between the primary and secondary sizes (read from the back of the room); past that, split it into parts by sentence. */
var partCache={};
function partsOf(i){
  var r=list()[i],key=S.profile+"|"+S.count+"|"+i+"|"+S.names;
  if(partCache[key])return partCache[key];
  prep(measure);
  var sents=r.text.match(/[^.!?;]+[.!?;]+["')]*\s*|[^.!?;]+$/g)||[r.text];
  for(var k=1;k<=6;k++){
    var groups=splitEven(sents,k),ok=true;
    for(var g=0;g<groups.length&&ok;g++){
      measure.innerHTML=navHTML(i,groups[g],g,groups.length);
      ok=fitText(measure.querySelector(".fit-text"),measure);
    }
    if(ok)return (partCache[key]=groups);
  }
  return (partCache[key]=[r.text]);
}
function splitEven(sents,k){
  if(k===1)return [sents.join("").trim()];
  var total=sents.join("").length,target=total/k,out=[],cur="";
  sents.forEach(function(s){
    if(cur&&cur.length+s.length/2>target&&out.length<k-1){out.push(cur.trim());cur=""}
    cur+=s;
  });
  if(cur.trim())out.push(cur.trim());
  return out;
}

/* ================= the round step: one decision function (roundStep) ================= */
function step(){
  var N=list().length,J=joined(),m=S.moment,pages=readPages(),P=pages.length,parts=(m==="RESPONSES")?partsOf(S.resp):[1];
  var st={label:MLABEL[m],status:"",sub:"",primary:null,secondary:null,next:""};
  if(m==="LOBBY"){st.status=J+" joined";st.sub="The screen shows the join code.";st.primary={id:"start",label:"Start round 5"};st.next="Round 5: "+Q.title}
  if(m==="ANSWERING"){var left=J-S.answered;
    st.status=left?S.answered+" of "+J+" answered":"Everyone has answered";st.ready=!left;
    st.sub=left?left+" still answering":"";
    st.primary={id:"vote",label:(S.armed&&left)?"Start voting: "+left+" still answering":"Start voting",arm:left>0};
    st.next="Voting: the room picks the answers they would back"}
  if(m==="VOTING"){var lv=J-S.voted;
    st.status=lv?S.voted+" of "+J+" voted":"Everyone has voted";st.ready=!lv;st.sub=lv?lv+" still voting":"";

    st.secondary={id:"vshow",label:"Show response 1 of "+N};
    st.next="Results: the tally of vote points"}

function act(id){
  var N=list().length,P=readPages().length;S.armed=false;
  switch(id){
    case"start":S.moment="ANSWERING";S.answered=1;break;
    case"vote":S.moment="VOTING";S.voted=0;break;
    case"results":S.moment="RESULTS";break;
    case"vshow":S.moment="VOTE_RESPONSES";S.vresp=0;break;
    case"vnext":S.vresp=Math.min(N-1,S.vresp+1);break;
    case"vstop":S.moment="VOTING";break;
    case"responses":S.moment="RESPONSES";S.resp=0;S.part=0;break;
    case"nextr":var parts=partsOf(S.resp);if(S.part<parts.length-1)S.part++;else{S.resp=Math.min(N-1,S.resp+1);S.part=0}break;
    case"stop":S.moment="RESULTS";break;
    case"heard":S.moment="READ";S.page=0;S.seen=0;break;
    case"nextp":S.page=Math.min(P-1,S.page+1);S.seen=Math.max(S.seen,S.page);break;
    case"ask":case"another":S.moment="COMPOSE";break;
    case"backread":S.moment="READ";S.page=P-1;break;
    case"send":S.moment="ASK_LIVE";S.askAns=0;break;
    case"askres":S.moment="ASK_RESULTS";break;
    case"cancel":S.moment="READ";S.page=P-1;break;
    case"next":S.moment="NEXT";break;
    case"restart":reset();break;
  }
  render();
}
function primary(){var st=step();if(!st.primary)return;if(st.primary.arm&&!S.armed){S.armed=true;render();return}act(st.primary.id)}
function back(){
  if(S.moment==="VOTE_RESPONSES"){if(S.vresp>0)S.vresp--;else S.moment="VOTING"}
  else if(S.moment==="RESPONSES"){if(S.part>0)S.part--;else if(S.resp>0){S.resp--;S.part=partsOf(S.resp).length-1}else S.moment="RESULTS"}
  else if(S.moment==="READ"&&S.page>0)S.page--;
  else if(S.moment==="ASK_RESULTS"){S.moment="READ";S.page=readPages().length-1}
  S.armed=false;render();
}
function escape_(){
  if(S.armed)S.armed=false;
  else if(S.moment==="RESPONSES")S.moment="RESULTS";
  else if(S.moment==="VOTE_RESPONSES")S.moment="VOTING";
  else if(S.moment==="COMPOSE"){S.moment="READ";S.page=readPages().length-1}
  render();
}
function show(i){S.moment="RESPONSES";S.resp=i;S.part=0;S.armed=false;render()}
function gotoPage(i){S.page=i;S.seen=Math.max(S.seen,i);render()}

    else h+='<p class="note">Selected: the '+(S.ask+1)+(S.ask===0?"st":"nd")+' suggestion. The screen still shows the read.</p>';
  }
  if(m==="ASK_RESULTS"){var a2=ASKS[S.ask],labs=a2.type==="agree"?["Agree","Not sure","Disagree"]:a2.options.map(function(o){return cap1(o.text)}),mx=Math.max.apply(null,a2.tally);
    h+='<h3>The room answered ('+sum(a2.tally)+')</h3><div class="tl">'+labs.map(function(l,i){return '<div><span>'+esc(l)+'</span><b>'+a2.tally[i]+'</b><i style="width:'+Math.max(2,a2.tally[i]/mx*100)+'%"></i></div>'}).join("")+'</div><p class="note">Sample counts: the real session has no answers to this ask.</p>'}
  if(m==="NEXT")h+='<h3>Round 6 is ready</h3><p class="note">Next round closes round 5, including any live question, then opens round 6 on the screen and every device.</p>';
  return h+'</div>';
}
function questionHTML(){return '<details class="qcard" id="qd"'+(S.qOpen?" open":"")+'><summary>'+esc(Q.title)+'</summary><p><b>Task:</b> '+esc(Q.task)+'</p><p><b>Background (yours):</b> '+esc(Q.background)+'</p><p><b>Set:</b> '+esc(Q.set)+' · '+esc(Q.category)+'</p></details>'}
function navRowHTML(){
  var m=S.moment,N=list().length;
  if(m==="VOTE_RESPONSES")return '<div class="navrow"><button type="button" class="btn btn-g" data-act="back" aria-label="Back">‹</button><span class="pos">Response '+(S.vresp+1)+' of '+N+' · name hidden</span><button type="button" class="btn btn-g" data-act="fwd" aria-label="Next">›</button></div>';
  if(m==="RESPONSES"){var parts=partsOf(S.resp);return '<div class="navrow"><button type="button" class="btn btn-g" data-act="back" aria-label="Back">‹</button><span class="pos">Response '+(S.resp+1)+' of '+N+(parts.length>1?' · part '+(S.part+1)+' of '+parts.length:'')+'</span><button type="button" class="btn btn-g" data-act="fwd" aria-label="Next">›</button></div>'}
  if(m==="READ"){var P=readPages().length;return '<div class="navrow"><button type="button" class="btn btn-g" data-act="back" aria-label="Back a page"'+(S.page?"":" disabled")+'>‹</button><span class="pos">Page '+(S.page+1)+' of '+P+'</span><button type="button" class="btn btn-g" data-act="fwd" aria-label="Next page"'+(S.page<P-1?"":" disabled")+'>›</button></div>'}
  return "";
}
function footHTML(st){
  var p=st.primary,cls="btn btn-p"+(S.armed?" armed":"")+(st.ready?" ready":"");
  return {stat:esc(st.status)+(st.sub?'<small>'+esc(st.sub)+'</small>':''),
    sec:st.secondary?'<button type="button" class="btn btn-g" data-act="'+st.secondary.id+'">'+esc(st.secondary.label)+'</button>':'',
    pri:p?'<button type="button" class="'+cls+'" data-act="primary">'+esc(p.label)+'</button>':''};
}


/* ================= the participant's device: the wall's look at hand size ================= */
var MINE_TEXT=REAL[0].text;
function ppTop(right){return '<div class="pp-h"><span><b>Q4 Wrap up</b> · Round 5</span><span>'+right+'</span></div>'}
function ppMeter(n,of){var cap=Math.min(of,16),on=Math.round(n*cap/of),h='<div class="pp-meter" aria-hidden="true">';for(var i=0;i<cap;i++)h+='<i class="'+(i<on?(n>=of?"all":"on"):"")+'"></i>';return h+'</div>'}
function ppProg(n,of,verb){return '<div class="pp-prog">'+ppMeter(n,of)+'<span><b>'+n+' of '+of+'</b> '+verb+'</span></div>'}
function ppLook(t){return '<div class="pp-look"><i>↑</i><span>'+t+'</span></div>'}
function rankOf(i){var b=S.mine.ballot;var k=b.indexOf(i);return k}
function pHTML(){
  var m=S.moment,J=joined(),L=list(),N=L.length,b='',f='',right=MLABEL[m];
  if(m==="LOBBY"){right="Joined";
    b='<p class="pp-ey">You\'re in</p><h1 class="pp-t">Waiting for round 5</h1><p class="pp-lead">Joined as <b>Maya</b>. '+J+' in the room.</p>'+
      '<div class="pp-card"><p class="pp-ey">If you lose this page</p><p class="pp-mut">Open engage.seibtribe.us/play, type 5479 and the same name. Your answers and score come back.</p></div>'+
      ppLook('The question appears on the main screen and here together.');}
  if(m==="ANSWERING"){right="Answering";
    if(!S.mine.answered){
      b='<p class="pp-ey">'+esc(Q.category)+'</p><h1 class="pp-t sm">'+esc(Q.title)+'</h1><p class="pp-lead">'+esc(Q.task)+'</p>'+
        '<label class="pp-ey" for="ppin">Your response</label><textarea class="pp-in" id="ppin">'+esc(MINE_TEXT.slice(0,160))+'</textarea>'+
        '<p class="pp-mut">The room votes on this. Your name is not attached to it until voting closes.</p>'+ppProg(S.answered,J,"answered");
      f='<button type="button" class="btn btn-p" data-ply="send">Send my answer</button>';
    }else{
      b='<p class="pp-ey">Sent</p><h1 class="pp-t">Your answer is in</h1><div class="pp-card"><p class="pp-ey">What you sent</p><p>'+esc(MINE_TEXT.slice(0,160))+'</p></div>'+
        '<p class="pp-mut">Locked for this round. If this page reloads, it comes back.</p>'+ppProg(S.answered,J,"answered")+ppLook('Every response comes up on the main screen when the round closes, without names.');
    }}
  if(m==="VOTING"||m==="VOTE_RESPONSES"){right="Voting";
    var VL=voteList(),need=Math.min(3,N),ballot=S.mine.ballot,shown=m==="VOTE_RESPONSES"?S.vresp:-1;
    b='<p class="pp-ey">Vote</p><h1 class="pp-t sm">Rank your top three</h1><p class="pp-mut">Nobody sees who wrote what, the host included, until voting closes.</p>';
    VL.forEach(function(r,i){var rk=rankOf(i),mine=r.name==="Maya Chen";
      b+='<div class="pp-card'+(i===shown?" on":"")+(mine?" mine":"")+'"><div class="pp-ch"><span class="pp-badge">'+(i+1)+'</span><span class="who">Response '+(i+1)+'</span>'+(i===shown?'<span class="pp-tag live">On the screen</span>':'')+(mine?'<span class="pp-tag">Yours</span>':'')+'</div><p>'+esc(first(r.text,26))+'</p>'+
        '<div class="pp-rk">'+["1st","2nd","3rd"].slice(0,need).map(function(l,k){return '<button type="button" data-ply="rank" data-i="'+i+'" data-k="'+k+'" aria-pressed="'+(rk===k)+'">'+l+'</button>'}).join("")+'</div></div>'});
    b+=ppProg(S.voted,J,"voted");
    var picked=ballot.filter(function(x){return x!==undefined&&x!==null}).length;
    f='<div class="pp-slots">'+["1st","2nd","3rd"].slice(0,need).map(function(l,k){return '<span>'+l+' <b>'+(ballot[k]!=null?"Response "+(ballot[k]+1):"—")+'</b></span>'}).join("")+'</div>'+
      '<button type="button" class="btn btn-p" data-ply="vote"'+(picked<need?" disabled":"")+'>'+(picked<need?"Pick "+(need-picked)+" more to send":"Send my votes")+'</button>';}
  if(m==="RESULTS"||m==="RESPONSES"){right="Results";
    var mx=L[0].pts||1,mi=0;L.forEach(function(r,i){if(r.name==="Maya Chen")mi=i});
    b='<p class="pp-ey">Results</p><h1 class="pp-t sm">Yours came '+(["1st","2nd","3rd"][mi]||((mi+1)+"th"))+' with '+L[mi].pts+' points</h1><p class="pp-mut">Total 28 · standing 1 of '+(J-1)+'</p><div class="pp-rows">';
    L.slice(0,5).forEach(function(r,i){var on=m==="RESPONSES"&&S.resp===i;
      b+='<div class="pp-row'+(i===mi?" mine":"")+'"><span class="rk">'+(i+1)+'</span><div class="nm">'+esc(S.names?r.name:"Response "+(i+1))+(i===mi?' <span class="pp-tag">Yours</span>':'')+(on?' <span class="pp-tag live">On the screen</span>':'')+'<small>'+esc(first(r.text,10))+'</small><div class="bar" style="width:'+Math.max(4,r.pts/mx*100)+'%"></div></div><span class="pt">'+r.pts+'</span></div>'});
    b+='</div>'+(N>5?'<p class="pp-mut">and '+(N-5)+' more responses</p>':'')+ppLook('The host is walking through the responses on the main screen.');
    f='<button type="button" class="btn btn-g">Feedback</button>';}
  if(m==="READ"||m==="COMPOSE"){right="What we heard";
    var P=readPages(),pi=m==="COMPOSE"?P.length-1:S.page,pg=P[pi];
    b='<p class="pp-ey">Workie\'s read</p><div class="pp-read"><h4>'+esc(pg.title)+(pg.cont?' <span class="pp-mut" style="display:inline">continued</span>':'')+'</h4>';
    var cur=null;pg.blocks.forEach(function(x){if(x.k!==cur){if(cur==="ul")b+="</ul>";if(cur==="ol")b+="</ol>";if(x.k==="ul")b+="<ul>";if(x.k==="ol")b+="<ol>";cur=x.k}b+=x.k==="p"?'<p class="pp-mut">'+x.h+'</p>':'<li>'+x.h+'</li>'});
    if(cur==="ul")b+="</ul>";if(cur==="ol")b+="</ol>";
    b+='</div><div class="pp-pips">'+P.map(function(_,i){return '<i class="'+(i===pi?"on":i<pi?"seen":"")+'"></i>'}).join("")+'<span>Page '+(pi+1)+' of '+P.length+', with the main screen</span></div>';
    f='<button type="button" class="btn btn-g">Feedback</button>';}
  if(m==="FEEDBACK"){right="Feedback";
    b='<p class="pp-ey">Feedback</p><h1 class="pp-t sm">What do you make of it?</h1><p class="pp-mut">Comment on the read, the results or any response.</p><textarea class="pp-in" placeholder="What do you make of it?"></textarea><p class="pp-mut">Your name is shown with this comment.</p>';
    f='<button type="button" class="btn btn-p">Post comment</button>';}
  if(m==="ASK_LIVE"){right="Question for the room";var a=ASKS[S.ask];
    b='<p class="pp-ey">'+(a.type==="agree"?"Agree or disagree":"Pick one")+'</p><h1 class="pp-t sm">'+esc(a.type==="agree"?"“"+cap1(a.statement)+"”":a.question)+'</h1><div class="pp-opts">'+
      (a.type==="agree"?["Agree","Not sure","Disagree"]:a.options.map(function(o){return cap1(o.text)})).map(function(l,i){return '<button type="button" aria-pressed="'+(i===0)+'">'+esc(l)+'</button>'}).join("")+'</div>'+ppProg(S.askAns,J,"answered");
    f='<button type="button" class="btn btn-p">Send</button>';}
  if(m==="ASK_RESULTS"){right="The room's answer";var a2=ASKS[S.ask],labs=a2.type==="agree"?["Agree","Not sure","Disagree"]:a2.options.map(function(o){return cap1(o.text)}),mx2=Math.max.apply(null,a2.tally);
    b='<p class="pp-ey">The room\'s answer</p><div class="pp-rows">'+labs.map(function(l,i){return '<div class="pp-row"><span class="rk">'+(i+1)+'</span><div class="nm">'+esc(l)+'<div class="bar" style="width:'+Math.max(4,a2.tally[i]/mx2*100)+'%"></div></div><span class="pt">'+a2.tally[i]+'</span></div>'}).join("")+'</div>';}
  if(m==="NEXT"){right="Next round";b='<p class="pp-ey">Up next</p><h1 class="pp-t">Round 6</h1><p class="pp-lead">Your total is 28, standing 1 of '+(J-1)+'.</p>'+ppLook('The question appears on the main screen and here together.');}
  return ppTop(right)+'<div class="pp-b">'+b+'</div>'+(f?'<div class="pp-f">'+f+'</div>':'');
}
function plyAct(a,t){
  if(a==="send"){S.mine.answered=true}
  if(a==="rank"){var i=+t.dataset.i,k=+t.dataset.k,bl=S.mine.ballot;
    if(bl[k]===i){bl[k]=null}else{for(var x=0;x<bl.length;x++)if(bl[x]===i)bl[x]=null;bl[k]=i}}
  render();
}

/* ================= render ================= */
var surf=document.getElementById("surf"),pres=document.getElementById("pres"),dash=document.getElementById("dash"),rem=document.getElementById("rem"),ply=document.getElementById("ply");
function render(){
  var st=step(),f=footHTML(st);
  surf.className="surf setup-"+S.setup;
  // presentation
  prep(pres);pres.innerHTML=presHTML();
  // dashboard
  var dScroll=(dash.querySelector(".db-r")||{}).scrollTop||0;
  dash.innerHTML='<div class="db-h"><span class="ses">Q4 Wrap up</span><span class="rnd">Round 5 <span class="dots" aria-hidden="true">'+[1,2,3,4,5,6].map(function(n){return '<i class="'+(n<5?"done":n===5?"on":"")+'"></i>'}).join("")+'</span> '+esc(st.label)+'</span><span class="sp">'+
    (S.presenting?'<button type="button" class="chip" data-act="present" title="Close the presentation window"><span class="dot"></span>Presenting on screen 2</button>':'<button type="button" class="btn btn-s" data-act="present">Present</button>')+
    '<button type="button" class="btn btn-s btn-g">Session</button></span></div>'+
    '<div class="db-b"><div class="db-l"><div><p class="lab"><span>On the screen now</span><span>'+esc(S.profile.charAt(0).toUpperCase()+S.profile.slice(1))+' profile</span></p><div class="fw"><div class="pf" id="dprev"></div></div></div>'+navRowHTML()+
    '<p class="upnext">Next on the screen: <b>'+esc(st.next)+'</b></p>'+questionHTML()+'</div><div class="db-r">'+panelHTML("dash")+'</div></div>'+
    '<div class="db-f"><div class="stat">'+f.stat+'</div>'+f.sec+f.pri+'</div>';
  dash.querySelector(".db-r").scrollTop=dScroll;
  var dp=dash.querySelector("#dprev");prep(dp);dp.innerHTML=presHTML();
  // remote
  var rScroll=(rem.querySelector(".rm-b")||{}).scrollTop||0;
  rem.innerHTML='<div class="rm-h"><div class="t"><b>Round 5 · '+esc(st.label)+'</b>Q4 Wrap up · '+joined()+' joined</div><button type="button" class="btn btn-s btn-g">Session</button></div>'+
    '<div class="rm-b"><div><p class="lab"><span>On the screen</span></p><div class="fw"><div class="pf" id="rprev"></div></div></div>'+navRowHTML()+questionHTML().replace('id="qd"','id="qr"')+panelHTML("rem")+'</div>'+
    '<div class="rm-f"><div class="stat">'+esc(st.status)+(st.sub?" · "+esc(st.sub):"")+'</div>'+f.sec+f.pri+'</div>';
  rem.querySelector(".rm-b").scrollTop=rScroll;
  var rp=rem.querySelector("#rprev");prep(rp);rp.innerHTML=presHTML();
  // participant
  var pScroll=(ply.querySelector(".pp-b")||{}).scrollTop||0;
  ply.innerHTML=pHTML();ply.querySelector(".pp-b").scrollTop=pScroll;
  // one-screen strip (setup b only)
  var wrap=document.getElementById("presWrap");wrap.classList.toggle("stripon",S.setup==="b");
  document.getElementById("strip").innerHTML='<span class="st">'+esc(st.status)+'</span>'+f.sec.replace("btn btn-g","btn btn-g btn-s")+f.pri.replace('class="btn btn-p','class="btn btn-p btn-s');
  // captions
  document.getElementById("presMeta").textContent=MLABEL[S.moment];
  document.getElementById("presNote").textContent=S.setup==="b"?"One screen, shared or projected. The phone drives it. With no phone, Space and the arrow keys drive it, and moving the mouse shows a small strip for three seconds (hover the screen to see it); the room sees that strip too.":
    "Its own window, opened by Present. It follows the session on the server, so closing and reopening it, or a dropped network, lands back on the same moment.";
  // jump strip + toolbar state
  document.querySelectorAll("#jump button").forEach(function(b){b.setAttribute("aria-current",b.dataset.m===S.moment?"step":"false")});
  document.querySelectorAll("[data-setup]").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.setup===S.setup)});
  document.querySelectorAll("[data-count]").forEach(function(b){b.setAttribute("aria-pressed",+b.dataset.count===S.count)});
  document.querySelectorAll("[data-names]").forEach(function(b){b.setAttribute("aria-pressed",(b.dataset.names==="1")===S.names)});
  document.getElementById("prof").value=S.profile;
  layout();
}
function layout(){
  var bad=[];
  document.querySelectorAll(".fw").forEach(function(w){var pf=w.querySelector(".pf");if(!pf)return;var sc=w.clientWidth/1920;pf.style.transform="scale("+sc+")";});
  [pres,document.getElementById("dprev"),document.getElementById("rprev")].forEach(function(pf){if(pf&&!fitFrame(pf))bad.push(pf.id)});
  var fs=document.getElementById("fitstat");
  var okMain=bad.indexOf("pres")<0;
  fs.className="fitstat "+(okMain?"ok":"bad");
  fs.textContent=okMain?"Screen fits, no scroll":"Overflow on the screen";
  window.__fit={moment:S.moment,profile:S.profile,count:S.count,ok:okMain,fit:getComputedStyle(pres).getPropertyValue("--fit"),bad:bad};
}

/* ================= wiring ================= */
var jump=document.getElementById("jump");
jump.innerHTML='<span>Prototype: jump to</span>'+MOMENTS.map(function(m){return '<button type="button" data-m="'+m+'">'+MLABEL[m]+'</button>'}).join("")+'<span class="keys"><kbd>Space</kbd> or <kbd>→</kbd> next step · <kbd>←</kbd> back · <kbd>Esc</kbd> stop or cancel</span>';
jump.addEventListener("click",function(e){var b=e.target.closest("[data-m]");if(!b)return;var m=b.dataset.m;
  S.armed=false;S.moment=m;var J=joined();
  if(m==="ANSWERING")S.answered=Math.min(J-1,list().length);if(m==="VOTING")S.voted=Math.min(J-1,list().length);
  if(m==="RESPONSES"){S.resp=0;S.part=0}if(m==="READ"){S.page=0;S.seen=0}if(m==="ASK_LIVE")S.askAns=Math.max(0,J-2);render()});
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act],[data-show],[data-vshow],[data-page],[data-ask],[data-setup],[data-count],[data-names],[data-ply]");if(!t)return;
  if(t.dataset.vshow!==undefined){S.moment="VOTE_RESPONSES";S.vresp=+t.dataset.vshow;S.armed=false;render();return}
  if(t.dataset.ply){plyAct(t.dataset.ply,t);return}
  if(t.dataset.setup){S.setup=t.dataset.setup;render();return}
  if(t.dataset.count){S.count=+t.dataset.count;S.resp=Math.min(S.resp,list().length-1);S.part=0;render();return}
  if(t.dataset.names){S.names=t.dataset.names==="1";render();return}
  if(t.dataset.show){show(+t.dataset.show);return}
  if(t.dataset.page){gotoPage(+t.dataset.page);return}
  if(t.dataset.ask){S.ask=+t.dataset.ask;if(S.moment==="READ")S.moment="COMPOSE";render();return}
  var a=t.dataset.act;
  if(a==="primary")primary();else if(a==="back")back();else if(a==="fwd"){if(S.moment==="READ")act("nextp");else if(S.moment==="VOTE_RESPONSES")act("vnext");else{var st=step();if(st.primary.id==="nextr")act("nextr")}}
  else if(a==="present"){S.presenting=!S.presenting;render()}
  else act(a);
});
document.addEventListener("toggle",function(e){if(e.target.id==="qd"||e.target.id==="qr"){S.qOpen=e.target.open}},true);
document.getElementById("prof").addEventListener("change",function(e){S.profile=e.target.value;S.part=0;render()});
document.getElementById("restart").addEventListener("click",function(){reset();render()});
document.addEventListener("keydown",function(e){
  var tag=(e.target.tagName||"").toLowerCase();if(tag==="select"||tag==="input"||tag==="textarea")return;
  if(e.key===" "||e.key==="ArrowRight"||e.key==="PageDown"){if(e.key===" "&&tag==="button"&&e.target.dataset.act!=="primary")return;e.preventDefault();primary()}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();back()}
  else if(e.key==="Escape"){escape_()}
});
/* the room acting: answers, votes and ask answers arrive by themselves */
setInterval(function(){
  var J=joined(),cap=Math.min(J-1,list().length),ch=false;
  if(S.moment==="ANSWERING"&&S.answered<cap){S.answered=Math.min(cap,S.answered+Math.max(1,Math.round(cap/6)));ch=true}
  if(S.moment==="VOTING"&&S.voted<cap){S.voted=Math.min(cap,S.voted+Math.max(1,Math.round(cap/6)));ch=true}
  if(S.moment==="ASK_LIVE"&&S.askAns<J){S.askAns=Math.min(J,S.askAns+1);ch=true}
  if(ch)render();
},1600);
if(window.ResizeObserver)new ResizeObserver(function(){layout()}).observe(document.body);else window.addEventListener("resize",layout);
window.__proto={S:S,render:render,step:step,readPages:readPages,partsOf:partsOf,act:act};
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){readCache={};partCache={};render()});
})();
</script>
