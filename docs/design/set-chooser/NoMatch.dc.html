<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chooser with nothing matching</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0F1A2E}
.sc{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#F4EDE4}
.sc *{box-sizing:border-box}
.seg{display:flex;border:1px solid #33476B;border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:#F4EDE4;border:0;border-right:1px solid #33476B;font:inherit;font-size:13px;padding:0 12px;height:34px}
.seg button:last-child{border-right:0}
.seg button.on{background:#25375A;color:#F6A94C;font-weight:700}
.seg b{font-weight:400;color:#9BA8BE;margin-left:6px}
.fbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid #33476B;border-radius:8px;background:#1B2942;color:#F4EDE4;font:inherit;font-size:13px}
.fbtn span{color:#9BA8BE}
.fbtn.set{border-color:#F6A94C}
.fbtn.set span{color:#F6C88A;font-weight:700}
.dim{color:#9BA8BE;font-size:13px}
.exit{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:1px solid #33476B;border-radius:8px;background:#1B2942;color:#F4EDE4;font:inherit;font-size:15px;text-align:left}
.exit b{margin-left:auto;font-weight:400;color:#9BA8BE;font-size:13px}
.btn{height:40px;padding:0 18px;border-radius:8px;font:inherit;font-size:15px;font-weight:600;border:1px solid #33476B;background:transparent;color:#F4EDE4}
.btn.pri{background:#F6A94C;border-color:#F6A94C;color:#1B2942}
a{color:#9DC0F0}a:hover{color:#C4D8F6}
</style>
</helmet>
<div class="sc" style="width: 1040px; height: 600px; padding: 28px; background: #0B1424; display: flex; align-items: flex-start; justify-content: center">
<section aria-label="New engagement" style="width: 984px; background: #1B2942; border: 1px solid #33476B; border-radius: 14px; display: flex; flex-direction: column">
<div style="padding: 18px 22px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="font-size: 15px; font-weight: 600">Question set</span>
<span class="dim" role="status">0 of 47 sets</span>
</div>
<label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border: 1px solid #7CA7E6; border-radius: 10px; background: #0F1A2E">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BA8BE" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input aria-label="Search sets" value="offsite" style="flex: 1; border: 0; background: transparent; color: #F4EDE4; font: inherit; font-size: 15px; outline: none">
</label>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<div class="seg" role="radiogroup" aria-label="Whose sets">
<button role="radio" aria-checked="false">All<b>3</b></button>
<button class="on" role="radio" aria-checked="true">Yours<b>0</b></button>
<button role="radio" aria-checked="false">TeamG<b>2</b></button>
<button role="radio" aria-checked="false">Engage<b>0</b></button>
<button role="radio" aria-checked="false">Public<b>1</b></button>
</div>
<button class="fbtn">Topic <span>Any</span> ▾</button>
<button class="fbtn">Tag <span>Any</span> ▾</button>
<button class="fbtn set">Updated <span>Last 30 days</span> ▾</button>
</div>
<div style="border: 1px dashed #5B6F93; border-radius: 10px; padding: 28px 32px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 19px">No poll sets of yours match “offsite” from the last 30 days</h2>
<p style="margin: 0; color: #C9D2E0; font-size: 15px">Each way out says what it would find:</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button class="exit">Look in every owner’s sets<b>3 sets</b></button>
<button class="exit">Any time, not just 30 days<b>1 set</b></button>
<button class="exit">Clear the search and filters<b>47 sets</b></button>
<button class="exit">Other formats: Call &amp; Answer<b>2 sets</b></button>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding-top: 6px; border-top: 1px solid #33476B">
<span class="dim">Not there at all?</span>
<button class="btn">Make a new set</button>
<button class="btn">Generate one with AI</button>
</div>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
