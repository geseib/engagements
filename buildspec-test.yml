version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
      # Named, so an image update cannot change the Python under pip. It was
      # not the cause on 28 Sep 2026: the failed build and the good builds
      # either side of it all ran Python 3.11.15. See the pin below.
      python: 3.11
    commands:
      # ── THE SAM CLI IS PINNED, NOT FLOORED ───────────────────────────
      # This line read `pip3 install aws-sam-cli` until 2026-09-28, when the
      # dev and test builds that started at 10:43 UTC both stopped at `sam
      # build` with "'nodejs22.x' runtime is not supported" (dev execution
      # f19530ef, source 727359bc). pip could not resolve aws-sam-cli's
      # boto3-stubs[...] extras and, instead of stopping, backtracked
      # aws-sam-cli from 1.166.2 down to 1.93.0, which predates nodejs22.x.
      # The builds either side ran the same Python and botocore and installed
      # 1.166.2 cleanly, so the resolver failure did not last. The silent
      # downgrade was the damage.
      #
      # An exact pin turns that failure into a resolver error here, and also
      # keeps out a release nobody has run through this pipeline, which a
      # floor (`>=`) lets in. Every function in template-clean.yaml runs
      # nodejs22.x, so any new version must support it; 1.166.2 is the last
      # one proven here. Move buildspec-dev, -test and -prod together.
      - echo "Installing SAM CLI..."
      - pip3 install 'aws-sam-cli==1.166.2'
      # The pip-installed sam first on PATH, ahead of any older one the image
      # ships. Build phase 0.2 commands share this shell, so it holds for
      # `sam build` and `sam deploy` below.
      - export PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_path("scripts"))'):$PATH"
      - echo "Using $(command -v sam)"
      - sam --version
      - echo "Installing Node.js dependencies..."
      - cd src && npm ci && cd ..

  pre_build:
    commands:
      - echo "Pre-build phase for $ENVIRONMENT environment"
      - 'echo "Domain: $DOMAIN_NAME"'
      - echo "Retrieving GitHub token from Secrets Manager..."
      - export GITHUB_TOKEN=$(aws secretsmanager get-secret-value --secret-id engage/test/github-token --query SecretString --output text | jq -r .GITHUB_TOKEN)
      - '[ -n "$GITHUB_TOKEN" ] && echo "Successfully retrieved GitHub token" || (echo "ERROR: Failed to retrieve GitHub token" && exit 1)'
      - export GITHUB_REPO="${GITHUB_REPO:-geseib/engagements}"

      # Google OAuth credentials from SSM (CloudFormation cannot resolve
      # ssm-secure in Cognito IdP properties, so values pass as NoEcho
      # parameters — same pattern as scripts/deploy-clean.sh on dev).
      # These lookups fall back to "" on any SSM failure. An empty value must
      # never be passed through as an explicit override: template-clean.yaml:68
      # gates HasGoogleOAuth on GoogleClientSecret != "", so an empty override
      # DELETES GoogleIdentityProvider and drops Google from the user pool
      # client's SupportedIdentityProviders. Omitting the parameter instead
      # lets CloudFormation keep the previous value. See the build phase.
      - export GOOGLE_CLIENT_ID=$(aws ssm get-parameter --name /engtest/google/client-id --with-decryption --query 'Parameter.Value' --output text 2>/dev/null || echo "")
      - export GOOGLE_CLIENT_SECRET=$(aws ssm get-parameter --name /engtest/google/client-secret --with-decryption --query 'Parameter.Value' --output text 2>/dev/null || echo "")
      - '[ -n "$GOOGLE_CLIENT_SECRET" ] && echo "Google OAuth credentials retrieved - Google sign-in enabled" || echo "WARNING: /engtest/google/* SSM params not found - leaving the existing Google configuration untouched"'

  build:
    commands:
      - echo "Building and deploying backend..."
      # Same conditional-append pattern as buildspec-dev.yml. Each of these
      # parameters has a previous value in the stack, so omitting one keeps it;
      # passing it EMPTY is an explicit override to "" and would tear down the
      # Google identity provider (see the pre_build note).
      - PARAM_OVERRIDES="Environment=$ENVIRONMENT StackName=$STACK_NAME DomainName=$DOMAIN_NAME HostedZoneId=$HOSTED_ZONE_ID"
      - '[ -n "$GITHUB_TOKEN" ] && PARAM_OVERRIDES="$PARAM_OVERRIDES GitHubToken=$GITHUB_TOKEN" || echo "skipping GitHubToken (empty)"'
      - '[ -n "$GITHUB_REPO" ] && PARAM_OVERRIDES="$PARAM_OVERRIDES GitHubRepo=$GITHUB_REPO" || echo "skipping GitHubRepo (empty)"'
      - '[ -n "$GOOGLE_CLIENT_ID" ] && PARAM_OVERRIDES="$PARAM_OVERRIDES GoogleClientId=$GOOGLE_CLIENT_ID" || echo "skipping GoogleClientId (empty)"'
      - '[ -n "$GOOGLE_CLIENT_SECRET" ] && PARAM_OVERRIDES="$PARAM_OVERRIDES GoogleClientSecret=$GOOGLE_CLIENT_SECRET" || echo "skipping GoogleClientSecret (empty)"'
      - echo "Parameter overrides:" $(echo "$PARAM_OVERRIDES" | sed -E 's/(GitHubToken|GoogleClientSecret)=[^ ]*/\1=***/g')
      # ── THE BACKEND GATE ─────────────────────────────────────────────
      # `sam deploy` spent ~18 of a ~27-minute deploy zipping the same four
      # CodeUri folders 119 times, then found 115-118 of the zips already in S3
      # (dev builds 4c71a3ad, 9bea635e, 2026-10-01/02). When every input the
      # backend is built from is byte-identical to the last successful deploy
      # of THIS stack, and the stack has not changed since, the result is an
      # empty changeset — so both steps are skipped. Any doubt runs them.
      # Only sam build and sam deploy are gated: lint, jest, webpack, the S3
      # sync and the invalidation below run on every deploy. The rules and the
      # escape hatch (FORCE_FULL_DEPLOY=true) are in scripts/ci/backend-gate.sh.
      - 'export BACKEND_FP=$(PARAM_OVERRIDES="$PARAM_OVERRIDES" bash scripts/ci/backend-gate.sh fingerprint)'
      - 'export BACKEND_ACTION=$(bash scripts/ci/backend-gate.sh check)'
      - 'echo "Backend gate: ${BACKEND_ACTION:-run}"'
      - 'if [ "$BACKEND_ACTION" = "skip" ]; then echo "Backend unchanged since the last deploy - skipping sam build and sam deploy"; else echo "Building SAM application..." && sam build -t template-clean.yaml; fi'
      - 'if [ "$BACKEND_ACTION" != "skip" ]; then echo "Deploying to AWS..." && sam deploy --template-file .aws-sam/build/template.yaml --stack-name $STACK_NAME --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM --parameter-overrides $PARAM_OVERRIDES --resolve-s3 --no-confirm-changeset --no-fail-on-empty-changeset; fi'
      - 'if [ "$BACKEND_ACTION" != "skip" ]; then bash scripts/ci/backend-gate.sh record; fi'

      - echo "Building frontend..."
      - cd src

      - echo "Getting API endpoints from CloudFormation..."
      - API_URL=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`RestApiUrl`].OutputValue' --output text)
      - WS_URL=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`WebSocketUrl`].OutputValue' --output text)
      - USER_POOL_ID=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`UserPoolId`].OutputValue' --output text)
      - USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`UserPoolClientId`].OutputValue' --output text)
      - COGNITO_DOMAIN=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`UserPoolDomain`].OutputValue' --output text)

      - echo "Creating config.js with API endpoints and Cognito configuration..."
      - echo "Values retrieved from CloudFormation:"
      - echo "  API_URL=$API_URL"
      - echo "  WS_URL=$WS_URL"
      - echo "  USER_POOL_ID=$USER_POOL_ID"
      - echo "  USER_POOL_CLIENT_ID=$USER_POOL_CLIENT_ID"
      - echo "  COGNITO_DOMAIN=$COGNITO_DOMAIN"
      - printf 'window.API_BASE = "%s/";\n' "$API_URL" > public/config.js
      - printf 'window.WS_URL = "%s";\n' "$WS_URL" >> public/config.js
      - printf 'window.USER_POOL_ID = "%s";\n' "$USER_POOL_ID" >> public/config.js
      - printf 'window.USER_POOL_CLIENT_ID = "%s";\n' "$USER_POOL_CLIENT_ID" >> public/config.js
      - printf 'window.COGNITO_DOMAIN = "%s";\n' "$COGNITO_DOMAIN" >> public/config.js
      - printf 'window.ENV = "test";\n' >> public/config.js
      - printf 'console.log("TEST Environment loaded");\n' >> public/config.js
      - echo "Generated config.js contents:"
      - cat public/config.js

      # ── THE GATE THAT DID NOT EXIST ──────────────────────────────────
      # This pipeline ran `npm ci` and `npm run build` and nothing else. No
      # lint, no tests. Three product-down bugs shipped through it in two days
      # — four calls to deleted setters, a hook depending on a later const, and
      # a useState below five early returns — every one a clean webpack build,
      # because babel transpiles without resolving identifiers or understanding
      # React.
      #
      # `lint` is what catches that class at all: react-hooks/rules-of-hooks
      # and no-undef, and nothing else, so it stays readable (see
      # src/.eslintrc.js for why the rule set is deliberately tiny).
      #
      # `test` runs 111 suites. Five of them had never run since the day they
      # were written, which is how the largest file in the product came to have
      # no runtime coverage at all.
      - echo "Linting..."
      - npm run lint
      - echo "Running frontend tests..."
      - npm test
      - echo "Building..."
      - npm run build

      - echo "Verifying config.js in dist folder..."
      - ls -la dist/config.js
      - echo "Contents of dist/config.js:"
      - cat dist/config.js

      - echo "Deploying frontend to S3..."
      - BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`FrontendBucketName`].OutputValue' --output text)
      - echo "Frontend bucket name is $BUCKET_NAME"
      - aws s3 sync dist/ s3://$BUCKET_NAME/ --delete

      - echo "Invalidating CloudFront cache..."
      - DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' --output text)
      - echo "CloudFront distribution ID is $DISTRIBUTION_ID"
      - 'if [ -n "$DISTRIBUTION_ID" ] && [ "$DISTRIBUTION_ID" != "None" ]; then aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"; else echo "Skipping CloudFront invalidation - distribution ID not found"; fi'

      - echo "Deployment complete!"

  post_build:
    commands:
      - echo "Deployment completed for $ENVIRONMENT environment"
      - 'echo "Website URL: https://$DOMAIN_NAME"'
